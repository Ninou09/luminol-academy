name: Enquiry ownership schema patch

on:
  push:
    branches:
      - feat/enquiry-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-ownership
      - name: Apply patch
        run: python scripts/apply-enquiry-ownership-patch.py
      - name: Commit schema patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma packages/database/prisma/migrations/20260828221500_enquiry_ownership/migration.sql
          git commit -m "feat: persist audited enquiry ownership"
          git push origin HEAD:feat/enquiry-ownership
