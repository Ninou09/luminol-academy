name: Apply campaign medium mix

on:
  push:
    branches:
      - feat/campaign-medium-mix

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/campaign-medium-mix
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate campaign medium mix into dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          ops = Path('apps/admin/lib/operations.server.ts')
          text = ops.read_text()

          import_marker = "import {\n  normalizeEnquiryLandingPathMix,\n  type EnquiryLandingPathMixSummary,\n} from './enquiry-landing-path-reporting';\n"
          import_addition = "import {\n  normalizeEnquiryCampaignMediumMix,\n  type EnquiryCampaignMediumMixSummary,\n} from './enquiry-campaign-medium-reporting';\n" + import_marker
          if import_marker not in text:
              raise SystemExit('landing path import marker not found')
          text = text.replace(import_marker, import_addition, 1)

          type_marker = "  campaignEnquiryMixLast30Days: {\n    taggedTotal: number;\n    untaggedTotal: number;\n    sourceMix: CampaignSourceMixItem[];\n    campaignMix: CampaignPairMixItem[];\n  };\n"
          type_addition = type_marker + "  enquiryCampaignMediumMixLast30Days: EnquiryCampaignMediumMixSummary;\n"
          if type_marker not in text:
              raise SystemExit('campaign dashboard type marker not found')
          text = text.replace(type_marker, type_addition, 1)

          destructure_marker = "    campaignPairGroupsLast30Days,\n    landingPathRecordedLast30Days,\n"
          destructure_addition = "    campaignPairGroupsLast30Days,\n    campaignMediumRecordedLast30Days,\n    campaignMediumGroupsLast30Days,\n    landingPathRecordedLast30Days,\n"
          if destructure_marker not in text:
              raise SystemExit('campaign promise destructure marker not found')
          text = text.replace(destructure_marker, destructure_addition, 1)

          query_marker = "    db.enquiry.groupBy({\n      by: ['utmSource', 'utmCampaign'],\n      where: getCampaignNamedRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.count({\n      where: {\n        ...getRecentEnquiryWhere(now),\n        landingPath: { not: null },\n      },\n    }),\n"
          query_addition = "    db.enquiry.groupBy({\n      by: ['utmSource', 'utmCampaign'],\n      where: getCampaignNamedRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.count({\n      where: {\n        ...getRecentEnquiryWhere(now),\n        utmMedium: { not: null },\n      },\n    }),\n    db.enquiry.groupBy({\n      by: ['utmMedium'],\n      where: {\n        ...getRecentEnquiryWhere(now),\n        utmMedium: { not: null },\n      },\n      _count: { _all: true },\n    }),\n    db.enquiry.count({\n      where: {\n        ...getRecentEnquiryWhere(now),\n        landingPath: { not: null },\n      },\n    }),\n"
          if query_marker not in text:
              raise SystemExit('campaign pair query marker not found')
          text = text.replace(query_marker, query_addition, 1)

          return_marker = "    campaignEnquiryMixLast30Days: {\n      taggedTotal: campaignAttributedLast30Days,\n      untaggedTotal: calculateUntaggedEnquiryCount(\n        enquiriesLast30Days,\n        campaignAttributedLast30Days,\n      ),\n      sourceMix: normalizeCampaignSourceMix(campaignSourceGroupsLast30Days),\n      campaignMix: normalizeCampaignPairMix(campaignPairGroupsLast30Days),\n    },\n"
          return_addition = return_marker + "    enquiryCampaignMediumMixLast30Days: normalizeEnquiryCampaignMediumMix(\n      campaignMediumGroupsLast30Days,\n      enquiriesLast30Days,\n      campaignMediumRecordedLast30Days,\n    ),\n"
          if return_marker not in text:
              raise SystemExit('campaign return marker not found')
          text = text.replace(return_marker, return_addition, 1)
          ops.write_text(text)

          page = Path('apps/admin/app/page.tsx')
          text = page.read_text()

          page_import_marker = "import { getEnquiryCampaignReportingCopy } from '../lib/enquiry-campaign-reporting-localization';\n"
          page_import_addition = page_import_marker + "import { getEnquiryCampaignMediumCopy } from '../lib/enquiry-campaign-medium-localization';\n"
          if page_import_marker not in text:
              raise SystemExit('campaign copy import marker not found')
          text = text.replace(page_import_marker, page_import_addition, 1)

          copy_marker = "  const campaignCopy = getEnquiryCampaignReportingCopy(locale);\n"
          copy_addition = copy_marker + "  const campaignMediumCopy = getEnquiryCampaignMediumCopy(locale);\n"
          if copy_marker not in text:
              raise SystemExit('campaign copy initializer marker not found')
          text = text.replace(copy_marker, copy_addition, 1)

          panel_marker = "          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{landingPathCopy.eyebrow}</p>\n"
          panel = "\n".join([
            "          <section className=\"admin-panel\">",
            "            <div className=\"panel-heading\">",
            "              <div>",
            "                <p className=\"eyebrow\">{campaignMediumCopy.eyebrow}</p>",
            "                <h2>{campaignMediumCopy.title}</h2>",
            "                <p>{campaignMediumCopy.intro}</p>",
            "              </div>",
            "              <span>{copy.dashboard.rollingThirtyDays}</span>",
            "            </div>",
            "            <div className=\"metric-grid\" aria-label={campaignMediumCopy.title}>",
            "              <article>",
            "                <span>{campaignMediumCopy.recorded}</span>",
            "                <strong>{number(operations.enquiryCampaignMediumMixLast30Days.recorded)}</strong>",
            "                <small>{campaignMediumCopy.count(number(operations.enquiryCampaignMediumMixLast30Days.recorded))}</small>",
            "              </article>",
            "              <article>",
            "                <span>{campaignMediumCopy.missing}</span>",
            "                <strong>{number(operations.enquiryCampaignMediumMixLast30Days.missing)}</strong>",
            "                <small>{campaignMediumCopy.count(number(operations.enquiryCampaignMediumMixLast30Days.missing))}</small>",
            "              </article>",
            "            </div>",
            "            <div className=\"panel-heading\">",
            "              <div>",
            "                <h3>{campaignMediumCopy.topMedia}</h3>",
            "              </div>",
            "            </div>",
            "            {operations.enquiryCampaignMediumMixLast30Days.items.length > 0 ? (",
            "              <div className=\"metric-grid\" aria-label={campaignMediumCopy.topMedia}>",
            "                {operations.enquiryCampaignMediumMixLast30Days.items.map((item) => (",
            "                  <article key={item.utmMedium}>",
            "                    <span dir=\"auto\">{item.utmMedium}</span>",
            "                    <strong>{number(item.count)}</strong>",
            "                    <small>{campaignMediumCopy.count(number(item.count))}</small>",
            "                  </article>",
            "                ))}",
            "              </div>",
            "            ) : (",
            "              <p className=\"admin-empty\">{campaignMediumCopy.noMedia}</p>",
            "            )}",
            "          </section>",
            "",
          ]) + "\n"
          if panel_marker not in text:
              raise SystemExit('landing path panel marker not found')
          text = text.replace(panel_marker, panel + panel_marker, 1)
          page.write_text(text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-campaign-medium-reporting.ts \
            apps/admin/lib/enquiry-campaign-medium-reporting.test.ts \
            apps/admin/lib/enquiry-campaign-medium-localization.ts \
            apps/admin/lib/enquiry-campaign-medium-localization.test.ts
      - run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-campaign-medium-reporting.ts \
            apps/admin/lib/enquiry-campaign-medium-reporting.test.ts \
            apps/admin/lib/enquiry-campaign-medium-localization.ts \
            apps/admin/lib/enquiry-campaign-medium-localization.test.ts
          git commit -m "Integrate campaign medium enquiry reporting"
          git push origin HEAD:feat/campaign-medium-mix
