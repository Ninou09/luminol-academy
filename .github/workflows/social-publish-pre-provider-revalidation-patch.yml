name: Temporary Social Publish Pre-Provider Revalidation Patch
on:
  push:
    branches: [feat/ai-operator-social-publish-attempts]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[social-attempt-pre-provider-revalidation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-operator-social-publish-attempts
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add immediate pre-provider revalidation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('packages/database/src/social-publishing-attempts.ts')
          text = source.read_text()
          marker = '''  if (!claimed) {\n    return {\n      attempt: await client.socialPublishingAttempt.findUniqueOrThrow({\n        where: { id: initial.id },\n      }),\n      providerInvoked: false,\n    };\n  }\n\n  try {\n    const result = await input.provider.publish({\n'''
          replacement = '''  if (!claimed) {\n    return {\n      attempt: await client.socialPublishingAttempt.findUniqueOrThrow({\n        where: { id: initial.id },\n      }),\n      providerInvoked: false,\n    };\n  }\n\n  try {\n    plan = await materializeSocialPublishingDeliveryPlan(\n      client,\n      claimed.proposalId,\n    );\n    assertAttemptMatchesPlan(\n      claimed,\n      plan,\n      buildSocialPublishingIdempotencyKey(plan),\n    );\n  } catch {\n    return {\n      attempt: await invalidateAttempt(client, claimed, actorUserId, now),\n      providerInvoked: false,\n    };\n  }\n\n  try {\n    const result = await input.provider.publish({\n'''
          if text.count(marker) != 1:
              raise SystemExit('Expected one post-claim provider marker')
          source.write_text(text.replace(marker, replacement))
          PY
          pnpm exec prettier --write packages/database/src/social-publishing-attempts.ts
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/src/social-publishing-attempts.ts
          git commit -m "Revalidate social delivery immediately before provider invocation [social-attempt-pre-provider-revalidation]"
          git push origin HEAD:feat/ai-operator-social-publish-attempts
