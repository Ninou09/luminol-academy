name: Fix portal arrows once

on:
  push:
    branches:
      - feature/milestone-15-portal-localization

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-15-portal-localization
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply locale-aware navigation arrows
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              'apps/portal/app/page.tsx': '../lib',
              'apps/portal/app/account/page.tsx': '../../lib',
              'apps/portal/app/search/page.tsx': '../../lib',
              'apps/portal/app/notifications/page.tsx': '../../lib',
              'apps/portal/app/certificates/[certificateId]/page.tsx': '../../../lib',
              'apps/portal/app/courses/[slug]/page.tsx': '../../../lib',
              'apps/portal/app/languages/page.tsx': '../../lib',
              'apps/portal/app/languages/results/[attemptId]/page.tsx': '../../../../lib',
              'apps/portal/app/languages/placement/[attemptId]/page.tsx': '../../../../lib',
          }

          for filename, lib_prefix in files.items():
              path = Path(filename)
              text = path.read_text()
              if '← ' not in text and '<span aria-hidden="true">→</span>' not in text:
                  continue
              request_import = f"import {{ getPortalRequestLocale }} from '{lib_prefix}/request-locale';"
              arrow_import = f"import {{ getPortalArrow }} from '{lib_prefix}/portal-direction';"
              if arrow_import not in text:
                  if request_import not in text:
                      raise SystemExit(f'missing request locale import in {filename}')
                  text = text.replace(request_import, arrow_import + '\n' + request_import, 1)
              text = text.replace('← ', "{getPortalArrow(locale, 'back')} ")
              text = text.replace(
                  '<span aria-hidden="true">→</span>',
                  '<span aria-hidden="true">{getPortalArrow(locale, \'forward\')}</span>',
              )
              path.write_text(text)
          PY

      - name: Format portal arrow fixes
        run: pnpm exec prettier --write apps/portal

      - name: Commit fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal
          git rm .github/workflows/fix-portal-arrows-once.yml
          git commit -m "Mirror learner navigation arrows in Arabic"
          git push origin HEAD:feature/milestone-15-portal-localization
