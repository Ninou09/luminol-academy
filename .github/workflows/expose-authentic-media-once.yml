name: Expose authentic academy media once

on:
  push:
    branches:
      - design/premium-motion-homepage

permissions:
  contents: write

jobs:
  expose-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/premium-motion-homepage
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Make authentic academy photography unmistakably visible
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hero = Path('apps/web/components/immersive-hero-media.tsx')
          text = hero.read_text()
          old = "const [manualPause, setManualPause] = useState(false);"
          new = "const [manualPause, setManualPause] = useState(true);"
          if old not in text:
              raise SystemExit('hero manualPause target not found')
          hero.write_text(text.replace(old, new, 1))

          page = Path('apps/web/app/page.tsx')
          text = page.read_text()
          old_import = "import { BranchStage } from '../components/branch-stage';"
          new_import = "import { AcademyArchive } from '../components/academy-archive';\nimport { BranchStage } from '../components/branch-stage';"
          if old_import not in text:
              raise SystemExit('Arabic home import target not found')
          text = text.replace(old_import, new_import, 1)
          old_render = "      <BranchStage />"
          new_render = "      <AcademyArchive />\n\n      <BranchStage />"
          if old_render not in text:
              raise SystemExit('Arabic home render target not found')
          page.write_text(text.replace(old_render, new_render, 1))

          localized = Path('apps/web/components/localized-home.tsx')
          text = localized.read_text()
          old_import = "import { BranchStage } from './branch-stage';"
          new_import = "import { AcademyArchive } from './academy-archive';\nimport { BranchStage } from './branch-stage';"
          if old_import not in text:
              raise SystemExit('localized home import target not found')
          text = text.replace(old_import, new_import, 1)
          old_render = "      <BranchStage locale={locale} />"
          new_render = "      <AcademyArchive locale={locale} />\n\n      <BranchStage locale={locale} />"
          if old_render not in text:
              raise SystemExit('localized home render target not found')
          localized.write_text(text.replace(old_render, new_render, 1))
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/components/immersive-hero-media.tsx \
            apps/web/app/page.tsx \
            apps/web/components/localized-home.tsx
          rm .github/workflows/expose-authentic-media-once.yml
      - name: Commit authentic-media visibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/components/immersive-hero-media.tsx \
            apps/web/app/page.tsx \
            apps/web/components/localized-home.tsx \
            .github/workflows/expose-authentic-media-once.yml
          git commit -m "Make authentic academy photography visibly lead V11"
          git push origin HEAD:design/premium-motion-homepage
