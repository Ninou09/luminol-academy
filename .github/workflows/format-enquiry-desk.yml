name: Format enquiry desk

on:
  push:
    branches:
      - feat/enquiry-follow-up-desk

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-follow-up-desk
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format enquiry desk files
        run: pnpm exec prettier --write apps/admin/app/enquiries/page.tsx apps/admin/lib/enquiry-desk-localization.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/enquiries/page.tsx apps/admin/lib/enquiry-desk-localization.ts
          git commit -m "style: format enquiry follow-up desk"
          git push origin HEAD:feat/enquiry-follow-up-desk
