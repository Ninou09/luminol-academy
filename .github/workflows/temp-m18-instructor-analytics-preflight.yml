name: Temporary Milestone 18 instructor analytics preflight

on:
  push:
    branches:
      - feature/milestone-18-instructor-analytics

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-18-instructor-analytics
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/portal/package.json apps/portal/lib/instructor-cohort-analytics.ts apps/portal/lib/instructor-cohort-analytics.server.ts apps/portal/lib/instructor-cohort-analytics-localization.ts apps/portal/lib/instructor-cohort-analytics.test.ts apps/portal/lib/instructor-cohort-analytics-localization.test.ts 'apps/portal/app/instructor/cohorts/[cohort]/page.tsx' 'apps/portal/app/instructor/cohorts/[cohort]/analytics/page.tsx' docs/LEARNING_ANALYTICS.md
      - run: pnpm --filter @luminol/portal typecheck
      - run: pnpm --filter @luminol/portal test
      - name: Commit generated lock and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/portal/package.json apps/portal/lib/instructor-cohort-analytics.ts apps/portal/lib/instructor-cohort-analytics.server.ts apps/portal/lib/instructor-cohort-analytics-localization.ts apps/portal/lib/instructor-cohort-analytics.test.ts apps/portal/lib/instructor-cohort-analytics-localization.test.ts 'apps/portal/app/instructor/cohorts/[cohort]/page.tsx' 'apps/portal/app/instructor/cohorts/[cohort]/analytics/page.tsx' docs/LEARNING_ANALYTICS.md
          git commit -m "Format and lock instructor cohort analytics"
          git push origin HEAD:feature/milestone-18-instructor-analytics
