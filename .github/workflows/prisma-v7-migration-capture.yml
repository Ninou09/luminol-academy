name: Prisma v7 migration capture

on:
  push:
    branches: [chore/issue-114-prisma-v7]

permissions:
  contents: write

jobs:
  migrate-source-and-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Move schema to the Prisma 7 client generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()
          old = '''generator client {
            provider = "prisma-client-js"
          }

          datasource db {
            provider = "postgresql"
            url      = env("DATABASE_URL")
          }
          '''
          new = '''generator client {
            provider = "prisma-client"
            output   = "../generated/prisma"
          }

          datasource db {
            provider = "postgresql"
          }
          '''
          if old not in text:
              raise SystemExit('Expected Prisma v6 schema preamble was not found; refusing to rewrite schema.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Regenerate lockfile for the coordinated Prisma 7 dependency set
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Remove this temporary workflow and commit the generated migration state
        shell: bash
        run: |
          git rm .github/workflows/prisma-v7-migration-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma pnpm-lock.yaml
          git commit -m "Complete Prisma 7 schema and lockfile migration"
          git push origin HEAD:chore/issue-114-prisma-v7
