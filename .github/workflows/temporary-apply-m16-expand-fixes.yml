name: Temporary Milestone 16 Expand Fixer

on:
  push:
    branches:
      - feature/milestone-16-finance-integration

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/milestone-16-finance-integration
          fetch-depth: 0
      - name: Apply reviewed migration fixes
        run: python .github/scripts/temporary_apply_m16_expand_fixes.py
      - name: Commit reviewed fixes
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/temporary-apply-m16-expand-fixes.yml
          git rm .github/scripts/temporary_apply_m16_expand_fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/prisma/migrations/20260814190000_milestone_16_verified_organization_integrations/migration.sql
          git add packages/database/src/milestone16-integrations.integration.test.ts
          git commit -m 'Harden expand-phase organization integrity'
          git push origin HEAD:feature/milestone-16-finance-integration
