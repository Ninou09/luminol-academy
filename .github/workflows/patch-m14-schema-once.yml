name: Patch Milestone 14 schema once

on:
  pull_request:
    paths:
      - .github/workflows/patch-m14-schema-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/milestone-14-search-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Model representable trigram indexes and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()

          course_old = '''  placementAssessments PlacementAssessment[]\n}\n\nmodel LanguageCourseProfile'''
          course_new = '''  placementAssessments PlacementAssessment[]\n\n  @@index([title(ops: raw("gin_trgm_ops"))], type: Gin, map: "Course_title_trgm_idx")\n  @@index([slug(ops: raw("gin_trgm_ops"))], type: Gin, map: "Course_slug_trgm_idx")\n}\n\nmodel LanguageCourseProfile'''
          if course_old not in text:
              raise SystemExit('Course model anchor not found')
          text = text.replace(course_old, course_new, 1)

          enquiry_old = '''  @@index([status, createdAt])\n  @@index([email])\n}\n\nmodel EnquiryStatusEvent'''
          enquiry_new = '''  @@index([status, createdAt])\n  @@index([email])\n  @@index([name(ops: raw("gin_trgm_ops"))], type: Gin, map: "Enquiry_name_trgm_idx")\n  @@index([email(ops: raw("gin_trgm_ops"))], type: Gin, map: "Enquiry_email_trgm_idx")\n}\n\nmodel EnquiryStatusEvent'''
          if enquiry_old not in text:
              raise SystemExit('Enquiry model anchor not found')
          text = text.replace(enquiry_old, enquiry_new, 1)

          path.write_text(text)
          Path('.github/workflows/patch-m14-schema-once.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma .github/workflows/patch-m14-schema-once.yml
          git commit -m "Model admin trigram indexes in Prisma"
          git push origin HEAD:${{ github.head_ref }}
