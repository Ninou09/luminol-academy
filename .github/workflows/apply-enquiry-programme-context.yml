name: Apply enquiry programme context patch

on:
  push:
    branches:
      - feat/enquiry-programme-context
    paths:
      - scripts/apply-enquiry-programme-context-patch.py
      - .github/workflows/apply-enquiry-programme-context.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-programme-context
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply programme context patch
        run: python scripts/apply-enquiry-programme-context-patch.py
      - name: Format and validate Prisma schema
        run: |
          pnpm exec prisma format --schema packages/database/prisma/schema.prisma
          pnpm exec prisma validate --schema packages/database/prisma/schema.prisma
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Format changed TypeScript
        run: >-
          pnpm exec prettier --write
          packages/validation/src/index.ts
          packages/validation/src/index.test.ts
          apps/web/app/contact/page.tsx
          apps/web/components/enquiry-form.tsx
          apps/web/app/api/enquiries/route.ts
          apps/web/app/api/enquiries/route.test.ts
          apps/admin/lib/enquiry-desk-localization.ts
          apps/admin/lib/enquiry-desk-localization.test.ts
          apps/admin/app/enquiries/page.tsx
          packages/database/src/enquiry-programme-context.integration.test.ts
      - name: Run focused tests
        run: >-
          pnpm exec vitest run
          packages/validation/src/index.test.ts
          apps/web/app/api/enquiries/route.test.ts
          apps/admin/lib/enquiry-desk-localization.test.ts
      - name: Typecheck web and admin
        run: |
          pnpm --filter @luminol/web typecheck
          pnpm --filter @luminol/admin typecheck
      - name: Remove temporary patch tooling
        run: rm scripts/apply-enquiry-programme-context-patch.py .github/workflows/apply-enquiry-programme-context.yml
      - name: Commit programme context slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: capture verified enquiry programme context"
          git push origin HEAD:feat/enquiry-programme-context
