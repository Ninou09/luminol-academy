name: Milestone 16 Slice C review fix

on:
  push:
    branches:
      - feature/milestone-16-organization-admin
    paths:
      - .github/workflows/m16-slice-c-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-admin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one block in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          server = '''import 'server-only';

          import { db } from '@luminol/database';
          import type { Prisma } from '@luminol/database';
          import { z } from 'zod';

          import { ORGANIZATION_ADMIN_COLLECTION_LIMIT } from './organization-admin';

          const ORGANIZATION_PAGE_SIZE = 25;
          const OPTION_LIMIT = 100;

          const dashboardQuerySchema = z.object({
            organizationQuery: z.string().trim().max(160).default(''),
            organizationPage: z.coerce.number().int().positive().max(10_000).default(1),
            userQuery: z.string().trim().max(160).default(''),
            teamQuery: z.string().trim().max(160).default(''),
            courseQuery: z.string().trim().max(160).default(''),
          });

          export type OrganizationAdminDashboardQuery = z.input<
            typeof dashboardQuerySchema
          >;

          export async function getOrganizationAdminDashboard(
            rawQuery: OrganizationAdminDashboardQuery = {},
          ) {
            const query = dashboardQuerySchema.parse(rawQuery);
            const organizationWhere: Prisma.OrganizationWhereInput =
              query.organizationQuery
                ? {
                    name: {
                      contains: query.organizationQuery,
                      mode: 'insensitive',
                    },
                  }
                : {};
            const userWhere: Prisma.UserWhereInput = query.userQuery
              ? {
                  deletedAt: null,
                  OR: [
                    {
                      email: { contains: query.userQuery, mode: 'insensitive' },
                    },
                    {
                      firstName: {
                        contains: query.userQuery,
                        mode: 'insensitive',
                      },
                    },
                    {
                      lastName: {
                        contains: query.userQuery,
                        mode: 'insensitive',
                      },
                    },
                  ],
                }
              : { deletedAt: null };
            const teamWhere: Prisma.TeamWhereInput = {
              archivedAt: null,
              ...(query.teamQuery
                ? {
                    name: {
                      contains: query.teamQuery,
                      mode: 'insensitive' as const,
                    },
                  }
                : {}),
            };
            const courseSearchWhere: Prisma.CourseWhereInput = query.courseQuery
              ? {
                  OR: [
                    {
                      title: {
                        contains: query.courseQuery,
                        mode: 'insensitive',
                      },
                    },
                    {
                      slug: {
                        contains: query.courseQuery,
                        mode: 'insensitive',
                      },
                    },
                  ],
                }
              : {};
            const publishedCourseWhere: Prisma.CourseWhereInput = {
              published: true,
              ...courseSearchWhere,
            };

            const organizationCount = await db.organization.count({
              where: organizationWhere,
            });
            const pageCount = Math.max(
              1,
              Math.ceil(organizationCount / ORGANIZATION_PAGE_SIZE),
            );
            const organizationPage = Math.min(query.organizationPage, pageCount);

            const organizations = await db.organization.findMany({
              where: organizationWhere,
              skip: (organizationPage - 1) * ORGANIZATION_PAGE_SIZE,
              take: ORGANIZATION_PAGE_SIZE,
              orderBy: [{ name: 'asc' }, { id: 'asc' }],
              select: {
                id: true,
                name: true,
                status: true,
                seatLimit: true,
                archivedAt: true,
                memberships: {
                  where: { active: true, user: userWhere },
                  take: ORGANIZATION_ADMIN_COLLECTION_LIMIT,
                  orderBy: [{ joinedAt: 'desc' }, { id: 'desc' }],
                  select: {
                    id: true,
                    role: true,
                    user: {
                      select: {
                        id: true,
                        firstName: true,
                        lastName: true,
                        email: true,
                      },
                    },
                  },
                },
                teams: {
                  where: teamWhere,
                  take: ORGANIZATION_ADMIN_COLLECTION_LIMIT,
                  orderBy: [{ name: 'asc' }, { id: 'asc' }],
                  select: {
                    id: true,
                    name: true,
                    memberships: {
                      where: {
                        organizationMembership: { active: true, user: userWhere },
                      },
                      take: ORGANIZATION_ADMIN_COLLECTION_LIMIT,
                      orderBy: { id: 'asc' },
                      select: {
                        id: true,
                        organizationMembership: {
                          select: {
                            id: true,
                            user: {
                              select: {
                                firstName: true,
                                lastName: true,
                                email: true,
                              },
                            },
                          },
                        },
                      },
                    },
                    _count: {
                      select: {
                        memberships: {
                          where: { organizationMembership: { active: true } },
                        },
                      },
                    },
                  },
                },
                seats: {
                  where: {
                    status: { in: ['INVITED', 'ACTIVE'] },
                    user: userWhere,
                  },
                  take: ORGANIZATION_ADMIN_COLLECTION_LIMIT,
                  orderBy: [{ invitedAt: 'desc' }, { id: 'desc' }],
                  select: {
                    id: true,
                    status: true,
                    userId: true,
                    user: {
                      select: {
                        firstName: true,
                        lastName: true,
                        email: true,
                      },
                    },
                  },
                },
                courses: {
                  where: { active: true, course: courseSearchWhere },
                  take: ORGANIZATION_ADMIN_COLLECTION_LIMIT,
                  orderBy: [{ assignedAt: 'desc' }, { id: 'desc' }],
                  select: {
                    id: true,
                    course: { select: { id: true, title: true } },
                  },
                },
                _count: {
                  select: {
                    memberships: { where: { active: true } },
                    teams: { where: { archivedAt: null } },
                    seats: true,
                    courses: { where: { active: true } },
                  },
                },
              },
            });

            const [users, publishedCourses] = await Promise.all([
              db.user.findMany({
                take: OPTION_LIMIT,
                where: userWhere,
                orderBy: [{ email: 'asc' }, { id: 'asc' }],
                select: {
                  id: true,
                  firstName: true,
                  lastName: true,
                  email: true,
                },
              }),
              db.course.findMany({
                take: OPTION_LIMIT,
                where: publishedCourseWhere,
                orderBy: [{ title: 'asc' }, { id: 'asc' }],
                select: { id: true, title: true },
              }),
            ]);

            const organizationIds = organizations.map((organization) => organization.id);
            const visibleTeamIds = organizations.flatMap((organization) =>
              organization.teams.map((team) => team.id),
            );
            const visibleMembershipIds = organizations.flatMap((organization) =>
              organization.memberships.map((membership) => membership.id),
            );
            const candidateUserIds = users.map((user) => user.id);
            const candidateCourseIds = publishedCourses.map((course) => course.id);

            const [
              seatEligibilityPages,
              candidateActiveMemberships,
              candidateActiveCourses,
              candidateTeamMemberships,
              progress,
            ] = await Promise.all([
              Promise.all(
                organizations.map((organization) =>
                  db.organizationMembership.findMany({
                    where: {
                      organizationId: organization.id,
                      active: true,
                      user: {
                        ...userWhere,
                        organizationSeats: {
                          none: { organizationId: organization.id },
                        },
                      },
                    },
                    take: ORGANIZATION_ADMIN_COLLECTION_LIMIT,
                    orderBy: [{ joinedAt: 'desc' }, { id: 'desc' }],
                    select: {
                      id: true,
                      organizationId: true,
                      role: true,
                      user: {
                        select: {
                          id: true,
                          firstName: true,
                          lastName: true,
                          email: true,
                        },
                      },
                    },
                  }),
                ),
              ),
              organizationIds.length > 0 && candidateUserIds.length > 0
                ? db.organizationMembership.findMany({
                    where: {
                      organizationId: { in: organizationIds },
                      userId: { in: candidateUserIds },
                      active: true,
                    },
                    select: { organizationId: true, userId: true },
                  })
                : Promise.resolve([]),
              organizationIds.length > 0 && candidateCourseIds.length > 0
                ? db.organizationCourse.findMany({
                    where: {
                      organizationId: { in: organizationIds },
                      courseId: { in: candidateCourseIds },
                      active: true,
                    },
                    select: { organizationId: true, courseId: true },
                  })
                : Promise.resolve([]),
              visibleTeamIds.length > 0 && visibleMembershipIds.length > 0
                ? db.teamMembership.findMany({
                    where: {
                      teamId: { in: visibleTeamIds },
                      organizationMembershipId: { in: visibleMembershipIds },
                    },
                    select: { teamId: true, organizationMembershipId: true },
                  })
                : Promise.resolve([]),
              Promise.all(
                organizations.map(async (organization) => {
                  const [assignmentCount, completedAssignments] = await Promise.all([
                    db.organizationEnrollmentSponsorship.count({
                      where: {
                        active: true,
                        organizationCourse: { organizationId: organization.id },
                      },
                    }),
                    db.organizationEnrollmentSponsorship.count({
                      where: {
                        active: true,
                        organizationCourse: { organizationId: organization.id },
                        enrollment: { status: 'COMPLETED' },
                      },
                    }),
                  ]);

                  return {
                    organizationId: organization.id,
                    assignmentCount,
                    completedAssignments,
                    completionPercent:
                      assignmentCount === 0
                        ? 0
                        : Math.round(
                            (completedAssignments / assignmentCount) * 100,
                          ),
                  };
                }),
              ),
            ]);

            const seatEligibleByOrganization = new Map(
              seatEligibilityPages.map((memberships, index) => [
                organizations[index]!.id,
                memberships,
              ]),
            );
            const activeMembershipKeys = new Set(
              candidateActiveMemberships.map(
                (membership) =>
                  `${membership.organizationId}:${membership.userId}`,
              ),
            );
            const activeCourseKeys = new Set(
              candidateActiveCourses.map(
                (assignment) =>
                  `${assignment.organizationId}:${assignment.courseId}`,
              ),
            );
            const teamMembershipKeys = new Set(
              candidateTeamMemberships.map(
                (membership) =>
                  `${membership.teamId}:${membership.organizationMembershipId}`,
              ),
            );
            const progressByOrganization = new Map(
              progress.map((summary) => [summary.organizationId, summary]),
            );

            return {
              organizations: organizations.map((organization) => ({
                ...organization,
                teams: organization.teams.map((team) => ({
                  ...team,
                  availableMemberships: organization.memberships.filter(
                    (membership) =>
                      !teamMembershipKeys.has(`${team.id}:${membership.id}`),
                  ),
                })),
                availableSeatMemberships:
                  seatEligibleByOrganization.get(organization.id) ?? [],
                availableMembershipUsers: users.filter(
                  (user) =>
                    !activeMembershipKeys.has(`${organization.id}:${user.id}`),
                ),
                availablePublishedCourses: publishedCourses.filter(
                  (course) =>
                    !activeCourseKeys.has(`${organization.id}:${course.id}`),
                ),
                progress: progressByOrganization.get(organization.id) ?? {
                  organizationId: organization.id,
                  assignmentCount: 0,
                  completedAssignments: 0,
                  completionPercent: 0,
                },
              })),
              options: { users, publishedCourses },
              query: { ...query, organizationPage },
              pagination: {
                page: organizationPage,
                pageCount,
                total: organizationCount,
                pageSize: ORGANIZATION_PAGE_SIZE,
                hasPreviousPage: organizationPage > 1,
                hasNextPage: organizationPage < pageCount,
              },
              limits: {
                optionSearchResults: OPTION_LIMIT,
                collectionResults: ORGANIZATION_ADMIN_COLLECTION_LIMIT,
              },
            };
          }
          '''
          Path('apps/admin/lib/organization-admin.server.ts').write_text(server)

          replace_once(
              'apps/admin/lib/organization-admin.ts',
              "export const ORGANIZATION_SEAT_TRANSITIONS = CORPORATE_SEAT_TRANSITIONS;\n",
              "export const ORGANIZATION_SEAT_TRANSITIONS = CORPORATE_SEAT_TRANSITIONS;\nexport const ORGANIZATION_ADMIN_COLLECTION_LIMIT = 25;\n",
          )

          replace_once(
              'apps/admin/lib/organization-admin.test.ts',
              "  getOrganizationSeatLifecycleUpdate,\n  ORGANIZATION_MEMBERSHIP_ROLES,\n",
              "  getOrganizationSeatLifecycleUpdate,\n  ORGANIZATION_ADMIN_COLLECTION_LIMIT,\n  ORGANIZATION_MEMBERSHIP_ROLES,\n",
          )
          replace_once(
              'apps/admin/lib/organization-admin.test.ts',
              "describe('organization administration invariants', () => {\n",
              "describe('organization administration invariants', () => {\n  test('bounds each organization administration collection', () => {\n    expect(ORGANIZATION_ADMIN_COLLECTION_LIMIT).toBe(25);\n  });\n\n",
          )

          replace_once(
              'apps/admin/app/organizations/actions.ts',
              "import { requirePlatformPermission } from '@luminol/auth';\n",
              "import { requirePlatformPermission } from '@luminol/auth';\nimport { localizeHref } from '@luminol/localization';\n",
          )
          replace_once(
              'apps/admin/app/organizations/actions.ts',
              "import { revalidatePath } from 'next/cache';\n",
              "import { revalidatePath } from 'next/cache';\nimport { cookies } from 'next/headers';\nimport { redirect } from 'next/navigation';\n",
          )
          replace_once(
              'apps/admin/app/organizations/actions.ts',
              "const idSchema = z.string().min(1).max(128);\n",
              "const idSchema = z.string().min(1).max(128);\nconst organizationAdminSearchSchema = z.object({\n  locale: z.enum(['ar', 'fr', 'en']),\n  organizationQuery: z.string().trim().max(160).default(''),\n  userQuery: z.string().trim().max(160).default(''),\n  teamQuery: z.string().trim().max(160).default(''),\n  courseQuery: z.string().trim().max(160).default(''),\n});\nconst ORGANIZATION_ADMIN_USER_SEARCH_COOKIE =\n  'luminol-organization-admin-user-search';\n",
          )
          actions = Path('apps/admin/app/organizations/actions.ts')
          action_text = actions.read_text()
          append = '''\n\nfunction organizationAdminSearchHref(input: {\n  locale: 'ar' | 'fr' | 'en';\n  organizationQuery: string;\n  teamQuery: string;\n  courseQuery: string;\n}) {\n  const params = new URLSearchParams();\n  if (input.organizationQuery) params.set('q', input.organizationQuery);\n  if (input.teamQuery) params.set('team', input.teamQuery);\n  if (input.courseQuery) params.set('course', input.courseQuery);\n  const pathname = localizeHref(input.locale, '/organizations');\n  const query = params.toString();\n  return query ? `${pathname}?${query}` : pathname;\n}\n\nasync function persistOrganizationAdminUserSearch(value: string) {\n  const cookieStore = await cookies();\n  cookieStore.set(ORGANIZATION_ADMIN_USER_SEARCH_COOKIE, value, {\n    httpOnly: true,\n    sameSite: 'lax',\n    secure: process.env.NODE_ENV === 'production',\n    maxAge: value ? 300 : 0,\n    path: '/',\n  });\n}\n\nexport async function searchOrganizationAdministration(formData: FormData) {\n  await requirePlatformPermission('academy:manage');\n  const input = organizationAdminSearchSchema.parse({\n    locale: formData.get('locale'),\n    organizationQuery: formData.get('organizationQuery'),\n    userQuery: formData.get('userQuery'),\n    teamQuery: formData.get('teamQuery'),\n    courseQuery: formData.get('courseQuery'),\n  });\n\n  await persistOrganizationAdminUserSearch(input.userQuery);\n  redirect(organizationAdminSearchHref(input));\n}\n\nexport async function clearOrganizationAdministrationSearch(\n  formData: FormData,\n) {\n  await requirePlatformPermission('academy:manage');\n  const locale = z.enum(['ar', 'fr', 'en']).parse(formData.get('locale'));\n  await persistOrganizationAdminUserSearch('');\n  redirect(localizeHref(locale, '/organizations'));\n}\n'''
          if 'export async function searchOrganizationAdministration' in action_text:
              raise SystemExit('Search actions already present')
          actions.write_text(action_text.rstrip() + append)

          page = 'apps/admin/app/organizations/page.tsx'
          replace_once(
              page,
              "import Link from 'next/link';\n",
              "import { cookies } from 'next/headers';\nimport Link from 'next/link';\n",
          )
          replace_once(
              page,
              "  createOrganizationTeam,\n  deactivateOrganizationMembership,\n",
              "  createOrganizationTeam,\n  clearOrganizationAdministrationSearch,\n  deactivateOrganizationMembership,\n",
          )
          replace_once(
              page,
              "  removeOrganizationTeamMember,\n  transitionOrganizationSeat,\n",
              "  removeOrganizationTeamMember,\n  searchOrganizationAdministration,\n  transitionOrganizationSeat,\n",
          )
          replace_once(
              page,
              "    organizationPage: number;\n    userQuery: string;\n    courseQuery: string;\n",
              "    organizationPage: number;\n    teamQuery: string;\n    courseQuery: string;\n",
          )
          replace_once(
              page,
              "  if (input.userQuery) params.set('user', input.userQuery);\n  if (input.courseQuery) params.set('course', input.courseQuery);\n",
              "  if (input.teamQuery) params.set('team', input.teamQuery);\n  if (input.courseQuery) params.set('course', input.courseQuery);\n",
          )
          replace_once(
              page,
              "  const params = await searchParams;\n  const dashboard = await getOrganizationAdminDashboard({\n    organizationQuery: firstSearchParam(params.q),\n    organizationPage: firstSearchParam(params.page) || 1,\n    userQuery: firstSearchParam(params.user),\n    courseQuery: firstSearchParam(params.course),\n  });\n",
              "  const params = await searchParams;\n  const cookieStore = await cookies();\n  const userQuery = (\n    cookieStore.get('luminol-organization-admin-user-search')?.value ?? ''\n  ).slice(0, 160);\n  const dashboard = await getOrganizationAdminDashboard({\n    organizationQuery: firstSearchParam(params.q),\n    organizationPage: firstSearchParam(params.page) || 1,\n    userQuery,\n    teamQuery: firstSearchParam(params.team),\n    courseQuery: firstSearchParam(params.course),\n  });\n",
          )
          replace_once(
              page,
              "  const selectorLimit = copy.selectorLimit.replace(\n    '{count}',\n    number(dashboard.limits.optionSearchResults),\n  );\n",
              "  const selectorLimit = copy.selectorLimit.replace(\n    '{count}',\n    number(dashboard.limits.optionSearchResults),\n  );\n  const collectionLimit = copy.collectionLimit.replace(\n    '{count}',\n    number(dashboard.limits.collectionResults),\n  );\n",
          )
          old_form = '''            <form method="get" className="status-form">\n              <label>\n                <span>{copy.organizationName}</span>\n                <input\n                  name="q"\n                  defaultValue={dashboard.query.organizationQuery}\n                  maxLength={160}\n                />\n              </label>\n              <label>\n                <span>{copy.userSearch}</span>\n                <input\n                  name="user"\n                  defaultValue={dashboard.query.userQuery}\n                  maxLength={160}\n                />\n              </label>\n              <label>\n                <span>{copy.courseSearch}</span>\n                <input\n                  name="course"\n                  defaultValue={dashboard.query.courseQuery}\n                  maxLength={160}\n                />\n              </label>\n              <button type="submit">{copy.search}</button>\n              <Link href={localizeHref(locale, '/organizations')}>\n                {copy.clearFilters}\n              </Link>\n            </form>\n            <p className="admin-empty">{selectorLimit}</p>\n'''
          new_form = '''            <form\n              action={searchOrganizationAdministration}\n              className="status-form"\n              autoComplete="off"\n            >\n              <input type="hidden" name="locale" value={locale} />\n              <label>\n                <span>{copy.organizationName}</span>\n                <input\n                  name="organizationQuery"\n                  defaultValue={dashboard.query.organizationQuery}\n                  maxLength={160}\n                />\n              </label>\n              <label>\n                <span>{copy.userSearch}</span>\n                <input\n                  name="userQuery"\n                  type="search"\n                  defaultValue={dashboard.query.userQuery}\n                  maxLength={160}\n                  autoComplete="off"\n                  spellCheck={false}\n                />\n              </label>\n              <label>\n                <span>{copy.teamName}</span>\n                <input\n                  name="teamQuery"\n                  defaultValue={dashboard.query.teamQuery}\n                  maxLength={160}\n                />\n              </label>\n              <label>\n                <span>{copy.courseSearch}</span>\n                <input\n                  name="courseQuery"\n                  defaultValue={dashboard.query.courseQuery}\n                  maxLength={160}\n                />\n              </label>\n              <button type="submit">{copy.search}</button>\n              <button\n                type="submit"\n                formAction={clearOrganizationAdministrationSearch}\n                formNoValidate\n              >\n                {copy.clearFilters}\n              </button>\n            </form>\n            <p className="admin-empty">{selectorLimit}</p>\n            <p className="admin-empty">{collectionLimit}</p>\n'''
          replace_once(page, old_form, new_form)
          replace_once(
              page,
              '<strong>{number(organization.memberships.length)}</strong>',
              '<strong>{number(organization._count.memberships)}</strong>',
          )
          replace_once(
              page,
              '<strong>{number(organization.teams.length)}</strong>',
              '<strong>{number(organization._count.teams)}</strong>',
          )
          replace_once(
              page,
              '<strong>{number(organization.courses.length)}</strong>',
              '<strong>{number(organization._count.courses)}</strong>',
          )
          replace_once(
              page,
              '{number(team.memberships.length)}{\' \'}\n                                  {copy.members}',
              '{number(team._count.memberships)}{\' \'}\n                                  {copy.members}',
          )
          p = Path(page)
          text = p.read_text()
          text = text.replace(
              '                      userQuery: dashboard.query.userQuery,\n                      courseQuery: dashboard.query.courseQuery,',
              '                      teamQuery: dashboard.query.teamQuery,\n                      courseQuery: dashboard.query.courseQuery,',
          )
          if 'userQuery: dashboard.query.userQuery' in text:
              raise SystemExit('Sensitive userQuery still present in pagination URL construction')
          p.write_text(text)

          localization = 'apps/admin/lib/organization-localization.ts'
          replace_once(
              localization,
              '  selectorLimit: string;\n  createEyebrow: string;\n',
              '  selectorLimit: string;\n  collectionLimit: string;\n  createEyebrow: string;\n',
          )
          replace_once(
              localization,
              "    selectorLimit:\n      'User and course selectors show up to {count} matching results. Narrow the search to reach records outside the initial result set.',\n",
              "    selectorLimit:\n      'User and course selectors show up to {count} matching results. Narrow the search to reach records outside the initial result set.',\n    collectionLimit:\n      'Each organization section shows up to {count} matching records. Use member, team, or course search to reach records outside the current slice.',\n",
          )
          replace_once(
              localization,
              "    selectorLimit:\n      'Les sélecteurs d’utilisateurs et de cours affichent jusqu’à {count} résultats. Affinez la recherche pour atteindre les autres dossiers.',\n",
              "    selectorLimit:\n      'Les sélecteurs d’utilisateurs et de cours affichent jusqu’à {count} résultats. Affinez la recherche pour atteindre les autres dossiers.',\n    collectionLimit:\n      'Chaque section d’organisation affiche jusqu’à {count} dossiers correspondants. Utilisez la recherche de membre, d’équipe ou de cours pour atteindre les autres dossiers.',\n",
          )
          replace_once(
              localization,
              "    selectorLimit:\n      'تعرض قوائم المستخدمين والدورات حتى {count} نتيجة مطابقة. ضيّق البحث للوصول إلى السجلات الأخرى.',\n",
              "    selectorLimit:\n      'تعرض قوائم المستخدمين والدورات حتى {count} نتيجة مطابقة. ضيّق البحث للوصول إلى السجلات الأخرى.',\n    collectionLimit:\n      'يعرض كل قسم للمؤسسة حتى {count} سجلاً مطابقاً. استخدم بحث العضو أو الفريق أو الدورة للوصول إلى السجلات الأخرى.',\n",
          )
          PY
      - run: pnpm exec prettier --write apps/admin/app/organizations/actions.ts apps/admin/app/organizations/page.tsx apps/admin/lib/organization-admin.server.ts apps/admin/lib/organization-admin.ts apps/admin/lib/organization-admin.test.ts apps/admin/lib/organization-localization.ts
      - name: Commit review fixes and remove helper
        shell: bash
        run: |
          rm .github/workflows/m16-slice-c-review-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Address Slice C privacy and payload bounds"
