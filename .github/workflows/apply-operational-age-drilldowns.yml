name: Apply operational age drill-downs

on:
  push:
    branches:
      - feat/operational-age-drilldowns

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/operational-age-drilldowns
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Link operational age buckets
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('apps/admin/app/page.tsx')
          text = page.read_text()

          import_marker = "import { buildEnquiryActiveAgeQuery } from '../lib/enquiry-active-age-filter';\n"
          import_line = "import { buildEnquiryOperationalAgeQuery } from '../lib/enquiry-operational-age-drilldown';\n"
          if import_marker not in text:
              raise SystemExit('active-age import marker not found')
          if import_line not in text:
              text = text.replace(import_marker, import_marker + import_line, 1)

          panels = [
              ('unassignedAgeCopy', 'unassigned'),
              ('missingFollowUpAgeCopy', 'active-without-follow-up'),
              ('incompleteQualificationAgeCopy', 'active-incomplete-qualification'),
              ('unrecordedContactAgeCopy', 'active-without-recorded-contact'),
          ]
          buckets = [
              ('under24Hours', 'under24Hours'),
              ('oneToThreeDays', 'oneToThreeDays'),
              ('fourToSevenDays', 'fourToSevenDays'),
              ('overSevenDays', 'overSevenDays'),
          ]

          for copy_var, attention in panels:
              for label, bucket in buckets:
                  old = f'<span>{{{copy_var}.{label}}}</span>'
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f'expected exactly one {copy_var}.{label} marker, found {count}'
                      )
                  href = (
                      "<Link\n"
                      "  href={localizeHref(\n"
                      "    locale,\n"
                      + "    `/enquiries?${buildEnquiryOperationalAgeQuery('"
                      + attention
                      + "', '"
                      + bucket
                      + "')}`,\n"
                      "  )}\n"
                      ">\n"
                      "  "
                      + old
                      + "\n"
                      "</Link>"
                  )
                  text = text.replace(old, href, 1)

          expected_links = 16
          actual_links = text.count('buildEnquiryOperationalAgeQuery(')
          if actual_links != expected_links:
              raise SystemExit(
                  f'expected {expected_links} operational age links, found {actual_links}'
              )

          page.write_text(text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-operational-age-drilldown.ts \
            apps/admin/lib/enquiry-operational-age-drilldown.test.ts
      - name: Run focused checks
        run: |
          pnpm --filter @luminol/admin typecheck
          pnpm --filter @luminol/admin test -- enquiry-operational-age-drilldown
          git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-operational-age-drilldown.ts \
            apps/admin/lib/enquiry-operational-age-drilldown.test.ts
          git commit -m "Link operational age distributions to enquiry desk"
          git push origin HEAD:feat/operational-age-drilldowns
