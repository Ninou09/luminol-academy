name: Apply enquiry follow-up plan

on:
  push:
    branches:
      - feat/enquiry-follow-up-plan

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-follow-up-plan
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply follow-up plan slice
        run: python scripts/apply-enquiry-follow-up-plan.py
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/enquiries/actions.ts \
            apps/admin/app/enquiries/page.tsx \
            apps/admin/app/enquiries/page.module.css \
            apps/admin/lib/enquiry-desk-localization.ts \
            apps/admin/lib/enquiry-desk-localization.test.ts \
            packages/database/src/enquiry-follow-up.integration.test.ts
      - name: Remove temporary patch tooling
        run: |
          rm .github/workflows/apply-enquiry-follow-up-plan.yml
          rm scripts/apply-enquiry-follow-up-plan.py
      - name: Commit follow-up plan slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add audited enquiry follow-up planning"
          git push origin HEAD:feat/enquiry-follow-up-plan
