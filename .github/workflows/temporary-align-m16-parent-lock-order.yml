name: Temporary Align Milestone 16 Parent Lock Order

on:
  push:
    branches:
      - feature/milestone-16-finance-integration

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/milestone-16-finance-integration
          fetch-depth: 0
      - name: Align permanent child lock ordering
        run: python .github/scripts/temporary_align_m16_parent_lock_order.py
      - name: Commit lock-order alignment
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/temporary-align-m16-parent-lock-order.yml
          git rm .github/scripts/temporary_align_m16_parent_lock_order.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/prisma/migrations/20260814190000_milestone_16_verified_organization_integrations/migration.sql
          git commit -m 'Align organization child lock ordering'
          git push origin HEAD:feature/milestone-16-finance-integration
