name: Temporary Social Delivery Final Format
on:
  push:
    branches: [feat/ai-operator-social-delivery-foundation]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[social-delivery-final-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-operator-social-delivery-foundation
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final social delivery files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/social-publishing/page.tsx \
            apps/admin/lib/social-publishing-localization.ts \
            apps/admin/lib/social-publishing-localization.test.ts
          git diff --check
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/admin/app/social-publishing/page.tsx \
            apps/admin/lib/social-publishing-localization.ts \
            apps/admin/lib/social-publishing-localization.test.ts
          git commit -m "Format final social delivery changes [social-delivery-final-format]"
          git push origin HEAD:feat/ai-operator-social-delivery-foundation
