name: Format founder pages once

on:
  push:
    branches:
      - design/premium-motion-homepage
    paths:
      - .github/workflows/format-founder-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/premium-motion-homepage
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/about/page.tsx apps/web/components/localized-about.tsx
      - name: Commit formatted founder pages
        shell: bash
        run: |
          rm .github/workflows/format-founder-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/about/page.tsx apps/web/components/localized-about.tsx .github/workflows/format-founder-once.yml
          git commit -m "Format founder About sections"
          git push origin HEAD:design/premium-motion-homepage
