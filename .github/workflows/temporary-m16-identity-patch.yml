name: Temporary M16 Identity Patch

on:
  push:
    branches:
      - feature/milestone-16-finance-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/milestone-16-finance-integration
          fetch-depth: 0
      - name: Patch permanent identity detection
        env:
          OLD_B64: 
          NEW_B64: 
        shell: bash
        run: |
          python -c "import base64,os,pathlib; p=pathlib.Path('packages/database/prisma/migrations/20260814190000_milestone_16_verified_organization_integrations/migration.sql'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/prisma/migrations/20260814190000_milestone_16_verified_organization_integrations/migration.sql
          git commit -m 'Revalidate child organization identity changes'
          git push origin HEAD:feature/milestone-16-finance-integration
