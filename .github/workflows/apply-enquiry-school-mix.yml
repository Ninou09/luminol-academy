name: Apply enquiry school mix patch

on:
  push:
    branches:
      - feat/enquiry-school-mix
    paths:
      - scripts/apply-enquiry-school-mix-patch.py
      - .github/workflows/apply-enquiry-school-mix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-school-mix
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply school mix patch
        run: python scripts/apply-enquiry-school-mix-patch.py
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/admin/lib/enquiry-pipeline-reporting.ts
          apps/admin/lib/enquiry-pipeline-reporting.test.ts
          apps/admin/lib/operations.server.ts
          apps/admin/lib/admin-localization.ts
          apps/admin/app/page.tsx
      - name: Run focused tests
        run: pnpm exec vitest run apps/admin/lib/enquiry-pipeline-reporting.test.ts
      - name: Typecheck admin
        run: pnpm --filter @luminol/admin typecheck
      - name: Remove temporary patch tooling
        run: rm scripts/apply-enquiry-school-mix-patch.py .github/workflows/apply-enquiry-school-mix.yml
      - name: Commit school mix slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show enquiry mix by school"
          git push origin HEAD:feat/enquiry-school-mix
