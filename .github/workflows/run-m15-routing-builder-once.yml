name: Run Milestone 15 locale routing builder once

on:
  push:
    branches:
      - feature/milestone-15-locale-routing

permissions:
  contents: write

jobs:
  run-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install current workspace
        run: pnpm install --frozen-lockfile
      - name: Execute corrected builder payload
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/m15-locale-routing-once.yml').read_text().splitlines()
          marker = '      - name: Build locale routing and persistence'
          try:
              marker_index = source.index(marker)
          except ValueError as exc:
              raise SystemExit('Builder step marker not found') from exc

          run_index = next(
              index
              for index in range(marker_index + 1, len(source))
              if source[index] == '        run: |'
          )
          payload_lines = []
          for line in source[run_index + 1:]:
              if line and not line.startswith('          '):
                  break
              payload_lines.append(line[10:] if line.startswith('          ') else '')

          payload = '\n'.join(payload_lines) + '\n'
          payload = payload.replace(
              'pnpm --filter @luminol/localization test',
              'pnpm exec vitest run packages/localization/src/index.test.ts packages/localization/src/routing.test.ts',
          )
          payload = payload.replace(
              'rm .github/workflows/m15-locale-routing-once.yml',
              ': # workflow cleanup is performed through the GitHub connector after a successful push',
          )
          payload = payload.replace(
              'git commit -m "Build locale routing and persistence"',
              'if git diff --cached --quiet; then exit 0; fi\ngit commit -m "Build locale routing and persistence"',
          )
          Path('/tmp/m15-routing-builder.sh').write_text(payload)
          PY

          bash /tmp/m15-routing-builder.sh
