name: Generate reviewed Sharp lockfile

on:
  push:
    branches:
      - ops/generate-sharp-lockfile

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Preserve reviewed baseline
        shell: bash
        run: |
          cp package.json "$RUNNER_TEMP/package.before.json"
          cp pnpm-lock.yaml "$RUNNER_TEMP/pnpm-lock.before.yaml"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Update only the reviewed Sharp override
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.pnpm.overrides['next>sharp'] = '0.35.3';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
      - name: Regenerate only the affected lockfile graph
        shell: bash
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Apply the reviewed pnpm pin after lockfile generation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.packageManager = 'pnpm@10.34.0';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
      - name: Validate manifest and lockfile semantics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = structuredClone(before);
          expected.packageManager = 'pnpm@10.34.0';
          expected.pnpm.overrides['next>sharp'] = '0.35.3';
          if (JSON.stringify(after) !== JSON.stringify(expected)) {
            console.error('package.json contains changes beyond the reviewed pnpm and Sharp pins');
            process.exit(1);
          }
          NODE

          ruby <<'RUBY'
          require 'yaml'
          require 'json'

          before = YAML.safe_load(File.read(File.join(ENV.fetch('RUNNER_TEMP'), 'pnpm-lock.before.yaml')), aliases: true)
          after = YAML.safe_load(File.read('pnpm-lock.yaml'), aliases: true)
          peer_suffix = '(@types/node@20.19.43)'

          differences = lambda do |old_value, new_value, path = [], output = []|
            if old_value.is_a?(Hash) && new_value.is_a?(Hash)
              (old_value.keys | new_value.keys).sort_by(&:to_s).each do |key|
                differences.call(old_value[key], new_value[key], path + [key], output)
              end
            elsif old_value.is_a?(Array) && new_value.is_a?(Array)
              [old_value.length, new_value.length].max.times do |index|
                differences.call(old_value[index], new_value[index], path + [index], output)
              end
            elsif old_value != new_value
              output << {
                'path' => path.map(&:to_s).join('.'),
                'before' => old_value,
                'after' => new_value,
              }
            end
            output
          end

          sharp_key = lambda do |key|
            key.include?('sharp@') || key.include?('@img/sharp-') || key.include?('@img/sharp-libvips-')
          end

          expected_importer_paths = [
            'apps/admin.dependencies.@clerk/nextjs.version',
            'apps/admin.dependencies.next.version',
            'apps/portal.dependencies.@clerk/nextjs.version',
            'apps/portal.dependencies.next.version',
            'apps/web.dependencies.next.version',
            'packages/auth.dependencies.@clerk/nextjs.version',
          ]
          importer_differences = differences.call(before['importers'], after['importers'])
          importer_valid =
            importer_differences.map { |item| item['path'] }.sort == expected_importer_paths.sort &&
            importer_differences.all? do |item|
              item['before'].is_a?(String) &&
                item['after'].is_a?(String) &&
                item['after'].gsub(peer_suffix, '') == item['before']
            end

          old_overrides = before.fetch('overrides').dup
          new_overrides = after.fetch('overrides').dup
          override_valid = old_overrides.delete('next>sharp') == '0.35.0' &&
            new_overrides.delete('next>sharp') == '0.35.3' &&
            old_overrides == new_overrides

          report = {
            'importer_differences' => importer_differences,
            'importer_transition_valid' => importer_valid,
            'override_transition_valid' => override_valid,
          }

          %w[packages snapshots].each do |section|
            old_section = before.fetch(section)
            new_section = after.fetch(section)
            changed = (old_section.keys | new_section.keys).sort.select { |key| old_section[key] != new_section[key] }
            unrelated = changed.reject do |key|
              sharp_key.call(key) ||
                key == 'postcss@8.4.31' ||
                key.include?('next@15.5.21') ||
                key.start_with?('@clerk/nextjs@6.39.6')
            end
            report["changed_#{section}"] = changed
            report["unrelated_#{section}"] = unrelated
          end

          stale_postcss_removed = before.fetch('packages').key?('postcss@8.4.31') &&
            !after.fetch('packages').key?('postcss@8.4.31') &&
            before.fetch('snapshots').key?('postcss@8.4.31') &&
            !after.fetch('snapshots').key?('postcss@8.4.31')

          referenced_stale_postcss = []
          walk = lambda do |value, path = []|
            case value
            when Hash
              value.each { |key, nested| walk.call(nested, path + [key]) }
            when Array
              value.each_with_index { |nested, index| walk.call(nested, path + [index]) }
            when String
              referenced_stale_postcss << path.map(&:to_s).join('.') if value == '8.4.31' || value.include?('postcss@8.4.31')
            end
          end
          walk.call(before.fetch('importers'), ['importers'])
          before.fetch('snapshots').each do |key, value|
            next if key == 'postcss@8.4.31'
            walk.call(value, ['snapshots', key])
          end

          report['stale_postcss_removed'] = stale_postcss_removed
          report['stale_postcss_references'] = referenced_stale_postcss

          unchanged_sections = %w[lockfileVersion settings]
          sections_valid = unchanged_sections.all? { |section| before[section] == after[section] }
          top_level_valid = before.keys == after.keys
          extra_sections = before.keys - %w[lockfileVersion settings overrides importers packages snapshots]
          extra_sections_valid = extra_sections.all? { |section| before[section] == after[section] }

          report['ok'] = top_level_valid &&
            sections_valid &&
            extra_sections_valid &&
            override_valid &&
            importer_valid &&
            report['unrelated_packages'].empty? &&
            report['unrelated_snapshots'].empty? &&
            stale_postcss_removed &&
            referenced_stale_postcss.empty?

          File.write('semantic-lockfile-report.json', JSON.pretty_generate(report) + "\n")
          puts JSON.pretty_generate(report)
          abort 'Generated lockfile contains changes outside the proven Sharp transition' unless report['ok']
          RUBY

          grep -F 'next>sharp: 0.35.3' pnpm-lock.yaml
          grep -F 'sharp@0.35.3' pnpm-lock.yaml
          if grep -F 'sharp@0.35.0' pnpm-lock.yaml; then
            echo 'Unexpected Sharp 0.35.0 entry remains' >&2
            exit 1
          fi
          git diff --stat -- package.json pnpm-lock.yaml
      - name: Verify strict pnpm 10.34 frozen installation
        shell: bash
        run: |
          rm -rf node_modules
          npx --yes pnpm@10.34.0 install --frozen-lockfile 2>&1 | tee frozen-install.log
          grep -F 'Done in' frozen-install.log
          if grep -F 'ERR_PNPM_TARBALL_INTEGRITY' frozen-install.log; then
            echo 'Sharp integrity retry remains' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-sharp-lockfile
          path: |
            package.json
            pnpm-lock.yaml
            semantic-lockfile-report.json
            frozen-install.log
          if-no-files-found: error
          retention-days: 1
