name: Publish reviewed Sharp lockfile

on:
  push:
    branches:
      - ops/generate-sharp-lockfile

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/upgrade-pnpm-sharp-integrity
          fetch-depth: 0
      - name: Verify implementation baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a434baf32dff9cce3bc4e2ab64781f3a5e94a86b"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Generate the reviewed Sharp dependency files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.pnpm.overrides['next>sharp'] = '0.35.3';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          pnpm config set registry https://registry.npmjs.org/
          pnpm install --lockfile-only --no-frozen-lockfile

          printf '%s  %s\n' \
            '1d22c768b09626326e9abc21210fe5760dcf25499bb587483028f3b1e74ec43e' package.json \
            '59666ab68bac4b1a0b037328e57c781d286d0aa15bd0364cdd7d089effe33f8b' pnpm-lock.yaml \
            | sha256sum --check --strict

          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'package.json'
          test "${changed[1]}" = 'pnpm-lock.yaml'
      - name: Verify frozen installation and production audit
        shell: bash
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile 2>&1 | tee frozen-install.log
          if grep -F 'ERR_PNPM_TARBALL_INTEGRITY' frozen-install.log; then
            echo 'Integrity warning remains' >&2
            exit 1
          fi
          pnpm audit --prod --audit-level high
          rm frozen-install.log
      - name: Commit and push the Sharp lockfile update
        shell: bash
        run: |
          git diff --check
          git add package.json pnpm-lock.yaml
          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = 'package.json'
          test "${staged[1]}" = 'pnpm-lock.yaml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Upgrade Sharp integrity metadata'
          git push origin HEAD:ops/upgrade-pnpm-sharp-integrity
