name: Generate reviewed Sharp lockfile

on:
  push:
    branches:
      - ops/generate-sharp-lockfile

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Preserve reviewed baseline
        shell: bash
        run: |
          cp package.json "$RUNNER_TEMP/package.before.json"
          cp pnpm-lock.yaml "$RUNNER_TEMP/pnpm-lock.before.yaml"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Update only the reviewed Sharp override
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.pnpm.overrides['next>sharp'] = '0.35.3';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
      - name: Regenerate only the affected lockfile graph
        shell: bash
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Apply the reviewed pnpm pin after lockfile generation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.packageManager = 'pnpm@10.34.0';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
      - name: Report manifest and lockfile semantics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = structuredClone(before);
          expected.packageManager = 'pnpm@10.34.0';
          expected.pnpm.overrides['next>sharp'] = '0.35.3';
          if (JSON.stringify(after) !== JSON.stringify(expected)) {
            fs.writeFileSync('manifest-semantic-failed', 'package.json contains changes beyond the reviewed pins\n');
          }
          NODE

          ruby <<'RUBY'
          require 'yaml'
          require 'json'

          before = YAML.safe_load(File.read(File.join(ENV.fetch('RUNNER_TEMP'), 'pnpm-lock.before.yaml')), aliases: true)
          after = YAML.safe_load(File.read('pnpm-lock.yaml'), aliases: true)

          differences = lambda do |old_value, new_value, path = [], output = []|
            if old_value.is_a?(Hash) && new_value.is_a?(Hash)
              (old_value.keys | new_value.keys).sort_by(&:to_s).each do |key|
                differences.call(old_value[key], new_value[key], path + [key], output)
              end
            elsif old_value.is_a?(Array) && new_value.is_a?(Array)
              [old_value.length, new_value.length].max.times do |index|
                differences.call(old_value[index], new_value[index], path + [index], output)
              end
            elsif old_value != new_value
              output << {
                'path' => path.map(&:to_s).join('.'),
                'before' => old_value,
                'after' => new_value,
              }
            end
            output
          end

          sharp_key = lambda do |key|
            key.include?('sharp@') || key.include?('@img/sharp-') || key.include?('@img/sharp-libvips-')
          end

          report = {
            'top_level_keys_before' => before.keys,
            'top_level_keys_after' => after.keys,
            'importer_differences' => differences.call(before['importers'], after['importers']),
            'changed_packages' => [],
            'unrelated_packages' => [],
            'changed_snapshots' => [],
            'unrelated_snapshots' => [],
            'other_section_differences' => {},
          }

          %w[packages snapshots].each do |section|
            old_section = before.fetch(section)
            new_section = after.fetch(section)
            changed = (old_section.keys | new_section.keys).sort.select { |key| old_section[key] != new_section[key] }
            report["changed_#{section}"] = changed
            report["unrelated_#{section}"] = changed.reject { |key| sharp_key.call(key) }
          end

          %w[lockfileVersion settings].each do |section|
            diff = differences.call(before[section], after[section])
            report['other_section_differences'][section] = diff unless diff.empty?
          end

          old_overrides = before.fetch('overrides').dup
          new_overrides = after.fetch('overrides').dup
          expected_override = old_overrides.delete('next>sharp') == '0.35.0' && new_overrides.delete('next>sharp') == '0.35.3'
          report['override_transition_valid'] = expected_override
          override_diff = differences.call(old_overrides, new_overrides)
          report['other_section_differences']['overrides'] = override_diff unless override_diff.empty?

          ignored_sections = %w[lockfileVersion settings overrides importers packages snapshots]
          (before.keys | after.keys).reject { |key| ignored_sections.include?(key) }.each do |section|
            diff = differences.call(before[section], after[section])
            report['other_section_differences'][section] = diff unless diff.empty?
          end

          report['ok'] =
            report['top_level_keys_before'] == report['top_level_keys_after'] &&
            report['importer_differences'].empty? &&
            report['unrelated_packages'].empty? &&
            report['unrelated_snapshots'].empty? &&
            report['other_section_differences'].empty? &&
            report['override_transition_valid']

          File.write('semantic-lockfile-report.json', JSON.pretty_generate(report) + "\n")
          puts JSON.pretty_generate(report)
          File.write('lockfile-semantic-failed', 'generated lockfile contains unrelated semantic changes\n') unless report['ok']
          RUBY

          grep -F 'next>sharp: 0.35.3' pnpm-lock.yaml
          grep -F 'sharp@0.35.3' pnpm-lock.yaml
          if grep -F 'sharp@0.35.0' pnpm-lock.yaml; then
            echo 'Unexpected Sharp 0.35.0 entry remains' >&2
            touch lockfile-semantic-failed
          fi
          git diff --stat -- package.json pnpm-lock.yaml
      - name: Verify strict pnpm 10.34 frozen installation
        if: ${{ hashFiles('manifest-semantic-failed', 'lockfile-semantic-failed') == '' }}
        shell: bash
        run: |
          rm -rf node_modules
          npx --yes pnpm@10.34.0 install --frozen-lockfile 2>&1 | tee frozen-install.log
          grep -F 'Done in' frozen-install.log
          if grep -F 'ERR_PNPM_TARBALL_INTEGRITY' frozen-install.log; then
            echo 'Sharp integrity retry remains' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-sharp-lockfile
          path: |
            package.json
            pnpm-lock.yaml
            semantic-lockfile-report.json
            frozen-install.log
            manifest-semantic-failed
            lockfile-semantic-failed
          if-no-files-found: error
          retention-days: 1
      - name: Enforce semantic gate
        if: always()
        shell: bash
        run: |
          if [ -e manifest-semantic-failed ] || [ -e lockfile-semantic-failed ]; then
            echo 'Generated lockfile failed the semantic gate' >&2
            exit 1
          fi
