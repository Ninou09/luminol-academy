name: Temporary Align Milestone 16 Membership Test

on:
  push:
    branches:
      - feature/milestone-16-finance-integration

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/milestone-16-finance-integration
          fetch-depth: 0
      - name: Align stronger fail-closed expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/database/src/milestone16-integrations.integration.test.ts')
          text = path.read_text()
          old = "'Verified notification requires an active organization recipient'"
          new = "'First-class organization scope requires a verified relationship'"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit expectation alignment
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/temporary-align-m16-membership-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/milestone16-integrations.integration.test.ts
          git commit -m 'Align membership fail-closed expectation'
          git push origin HEAD:feature/milestone-16-finance-integration
