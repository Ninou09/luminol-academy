name: Format portal localization once

on:
  push:
    branches:
      - feature/milestone-15-portal-localization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-15-portal-localization
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format portal localization
        run: pnpm exec prettier --write apps/portal

      - name: Commit formatted portal and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal
          git rm .github/workflows/format-portal-localization-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format learner portal localization"
          git push origin HEAD:feature/milestone-15-portal-localization
