name: Generate Next ESLint lockfile

on:
  push:
    branches: [lint/next-eslint-rules]
    paths:
      - packages/config/package.json
      - .github/workflows/generate-next-eslint-lockfile.yml

permissions:
  contents: write

concurrency:
  group: generate-next-eslint-lockfile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lint/next-eslint-rules
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only
      - name: Publish generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches package manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Regenerate lockfile for Next ESLint plugin"
          git push origin HEAD:lint/next-eslint-rules
