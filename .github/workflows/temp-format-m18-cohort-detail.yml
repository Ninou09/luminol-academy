name: Temporary Milestone 18 cohort-detail formatter

on:
  push:
    branches:
      - feature/milestone-18-instructor-cohort-detail

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-18-instructor-cohort-detail
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/portal/lib/instructor-cohort-localization.test.ts apps/portal/lib/instructor-cohort-localization.ts apps/portal/lib/instructor-cohort.server.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/lib/instructor-cohort-localization.test.ts apps/portal/lib/instructor-cohort-localization.ts apps/portal/lib/instructor-cohort.server.ts
          git commit -m "Format instructor cohort teaching view"
          git push origin HEAD:feature/milestone-18-instructor-cohort-detail
