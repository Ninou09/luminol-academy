name: Apply enquiry attention queue patch

on:
  push:
    branches: [feat/enquiry-attention-queues]

permissions:
  contents: write

concurrency:
  group: apply-enquiry-attention-queues
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/enquiry-attention-queues
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply attention queue patches
        run: python scripts/apply-enquiry-attention-patch.py
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/enquiries/page.tsx \
            apps/admin/app/enquiries/page.module.css \
            apps/admin/lib/enquiry-attention.ts \
            apps/admin/lib/enquiry-attention.test.ts \
            apps/admin/lib/enquiry-desk-localization.ts \
            apps/admin/lib/enquiry-desk-localization.test.ts
      - name: Run focused tests
        run: pnpm exec vitest run apps/admin/lib/enquiry-attention.test.ts apps/admin/lib/enquiry-desk-localization.test.ts
      - name: Typecheck admin
        run: pnpm --filter @luminol/admin typecheck
      - name: Remove temporary patch tooling
        run: |
          rm .github/workflows/apply-enquiry-attention.yml
          rm scripts/apply-enquiry-attention-patch.py
      - name: Commit attention queue slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add enquiry attention queues"
          git push origin HEAD:feat/enquiry-attention-queues
