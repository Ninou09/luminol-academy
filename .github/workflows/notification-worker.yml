name: Production notification worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-notification-worker
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check worker configuration
        id: configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BREVO_API_KEY" ] || [ -z "$NOTIFICATION_FROM_EMAIL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Notification worker skipped because one or more required repository secrets are not configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configuration.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.configuration.outputs.ready == 'true'
      - run: pnpm db:generate
        if: steps.configuration.outputs.ready == 'true'
      - name: Deliver one notification batch
        if: steps.configuration.outputs.ready == 'true'
        run: pnpm --filter @luminol/worker run:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
          NOTIFICATION_FROM_NAME: ${{ vars.NOTIFICATION_FROM_NAME || 'Luminol Academy' }}
          NOTIFICATION_WORKER_BATCH_SIZE: ${{ vars.NOTIFICATION_WORKER_BATCH_SIZE || '25' }}
