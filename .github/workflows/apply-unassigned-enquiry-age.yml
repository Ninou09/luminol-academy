name: Apply unassigned enquiry age

on:
  push:
    branches:
      - feat/unassigned-enquiry-age

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/unassigned-enquiry-age
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate unassigned enquiry age into dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          ops = Path('apps/admin/lib/operations.server.ts')
          text = ops.read_text()
          import_marker = "import {\n  getActiveEnquiryAgeWhere,\n  summarizeActiveEnquiryAge,\n  type ActiveEnquiryAgeSummary,\n} from './enquiry-age-reporting';\n"
          import_addition = import_marker + "import {\n  getUnassignedActiveEnquiryAgeWhere,\n  summarizeUnassignedActiveEnquiryAge,\n} from './enquiry-unassigned-age-reporting';\n"
          if import_marker not in text:
              raise SystemExit('age import marker not found')
          text = text.replace(import_marker, import_addition, 1)

          type_marker = "  activeEnquiryAge: ActiveEnquiryAgeSummary;\n"
          type_addition = type_marker + "  unassignedActiveEnquiryAge: ActiveEnquiryAgeSummary;\n"
          if type_marker not in text:
              raise SystemExit('active age type marker not found')
          text = text.replace(type_marker, type_addition, 1)

          destructure_marker = "    activeOverSevenDays,\n    followUpMissingPlan,\n"
          destructure_addition = "    activeOverSevenDays,\n    unassignedUnder24Hours,\n    unassignedOneToThreeDays,\n    unassignedFourToSevenDays,\n    unassignedOverSevenDays,\n    followUpMissingPlan,\n"
          if destructure_marker not in text:
              raise SystemExit('age destructure marker not found')
          text = text.replace(destructure_marker, destructure_addition, 1)

          query_marker = "    db.enquiry.count({ where: getActiveEnquiryAgeWhere(now, 'overSevenDays') }),\n    db.enquiry.count({\n      where: getActiveEnquiryFollowUpTimingWhere(now, 'missingPlan'),\n    }),\n"
          query_addition = "    db.enquiry.count({ where: getActiveEnquiryAgeWhere(now, 'overSevenDays') }),\n    db.enquiry.count({\n      where: getUnassignedActiveEnquiryAgeWhere(now, 'under24Hours'),\n    }),\n    db.enquiry.count({\n      where: getUnassignedActiveEnquiryAgeWhere(now, 'oneToThreeDays'),\n    }),\n    db.enquiry.count({\n      where: getUnassignedActiveEnquiryAgeWhere(now, 'fourToSevenDays'),\n    }),\n    db.enquiry.count({\n      where: getUnassignedActiveEnquiryAgeWhere(now, 'overSevenDays'),\n    }),\n    db.enquiry.count({\n      where: getActiveEnquiryFollowUpTimingWhere(now, 'missingPlan'),\n    }),\n"
          if query_marker not in text:
              raise SystemExit('age query marker not found')
          text = text.replace(query_marker, query_addition, 1)

          return_marker = "    activeEnquiryStatusMix: normalizeActiveEnquiryStatusMix(\n"
          return_addition = "    unassignedActiveEnquiryAge: summarizeUnassignedActiveEnquiryAge({\n      under24Hours: unassignedUnder24Hours,\n      oneToThreeDays: unassignedOneToThreeDays,\n      fourToSevenDays: unassignedFourToSevenDays,\n      overSevenDays: unassignedOverSevenDays,\n    }),\n    activeEnquiryStatusMix: normalizeActiveEnquiryStatusMix(\n"
          if return_marker not in text:
              raise SystemExit('active status return marker not found')
          text = text.replace(return_marker, return_addition, 1)
          ops.write_text(text)

          page = Path('apps/admin/app/page.tsx')
          text = page.read_text()
          page_import_marker = "import { getEnquiryAgeCopy } from '../lib/enquiry-age-localization';\n"
          page_import_addition = page_import_marker + "import { getUnassignedEnquiryAgeCopy } from '../lib/enquiry-unassigned-age-localization';\n"
          if page_import_marker not in text:
              raise SystemExit('page age import marker not found')
          text = text.replace(page_import_marker, page_import_addition, 1)

          copy_marker = "  const ageCopy = getEnquiryAgeCopy(locale);\n"
          copy_addition = copy_marker + "  const unassignedAgeCopy = getUnassignedEnquiryAgeCopy(locale);\n"
          if copy_marker not in text:
              raise SystemExit('page age copy marker not found')
          text = text.replace(copy_marker, copy_addition, 1)

          panel_marker = "          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{followUpTimingCopy.eyebrow}</p>\n"
          panel = "\n".join([
            "          <section className=\"admin-panel\">",
            "            <div className=\"panel-heading\">",
            "              <div>",
            "                <p className=\"eyebrow\">{unassignedAgeCopy.eyebrow}</p>",
            "                <h2>{unassignedAgeCopy.title}</h2>",
            "                <p>{unassignedAgeCopy.intro}</p>",
            "              </div>",
            "              <span>{number(operations.unassignedActiveEnquiryAge.activeTotal)}</span>",
            "            </div>",
            "            <div className=\"metric-grid\" aria-label={unassignedAgeCopy.title}>",
            "              <article>",
            "                <span>{unassignedAgeCopy.under24Hours}</span>",
            "                <strong>{number(operations.unassignedActiveEnquiryAge.buckets.under24Hours)}</strong>",
            "                <small>{unassignedAgeCopy.count(number(operations.unassignedActiveEnquiryAge.buckets.under24Hours))}</small>",
            "              </article>",
            "              <article>",
            "                <span>{unassignedAgeCopy.oneToThreeDays}</span>",
            "                <strong>{number(operations.unassignedActiveEnquiryAge.buckets.oneToThreeDays)}</strong>",
            "                <small>{unassignedAgeCopy.count(number(operations.unassignedActiveEnquiryAge.buckets.oneToThreeDays))}</small>",
            "              </article>",
            "              <article>",
            "                <span>{unassignedAgeCopy.fourToSevenDays}</span>",
            "                <strong>{number(operations.unassignedActiveEnquiryAge.buckets.fourToSevenDays)}</strong>",
            "                <small>{unassignedAgeCopy.count(number(operations.unassignedActiveEnquiryAge.buckets.fourToSevenDays))}</small>",
            "              </article>",
            "              <article>",
            "                <span>{unassignedAgeCopy.overSevenDays}</span>",
            "                <strong>{number(operations.unassignedActiveEnquiryAge.buckets.overSevenDays)}</strong>",
            "                <small>{unassignedAgeCopy.count(number(operations.unassignedActiveEnquiryAge.buckets.overSevenDays))}</small>",
            "              </article>",
            "            </div>",
            "          </section>",
            "",
          ]) + "\n"
          if panel_marker not in text:
              raise SystemExit('follow-up panel marker not found')
          text = text.replace(panel_marker, panel + panel_marker, 1)
          page.write_text(text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-unassigned-age-reporting.ts \
            apps/admin/lib/enquiry-unassigned-age-reporting.test.ts \
            apps/admin/lib/enquiry-unassigned-age-localization.ts \
            apps/admin/lib/enquiry-unassigned-age-localization.test.ts
      - run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-unassigned-age-reporting.ts \
            apps/admin/lib/enquiry-unassigned-age-reporting.test.ts \
            apps/admin/lib/enquiry-unassigned-age-localization.ts \
            apps/admin/lib/enquiry-unassigned-age-localization.test.ts
          git commit -m "Integrate unassigned enquiry age reporting"
          git push origin HEAD:feat/unassigned-enquiry-age
