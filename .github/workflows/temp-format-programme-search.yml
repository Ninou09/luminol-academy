name: Temporary programme search formatter

on:
  push:
    branches:
      - polish/programme-search-localized-delivery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: polish/programme-search-localized-delivery
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/web/lib/programme-discovery.ts
          apps/web/lib/programme-discovery.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/programme-discovery.ts apps/web/lib/programme-discovery.test.ts
          git commit -m "Format localized programme search"
          git push origin HEAD:polish/programme-search-localized-delivery
