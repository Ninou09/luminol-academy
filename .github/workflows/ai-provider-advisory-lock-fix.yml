name: Temporary AI Provider Advisory Lock Fix
on:
  push:
    branches: [feat/ai-provider-gateway]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ai-provider-lock-fix]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luminol
          POSTGRES_PASSWORD: luminol
          POSTGRES_DB: luminol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luminol -d luminol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
      TEST_DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-provider-gateway
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Deploy migrations
        run: pnpm --filter @luminol/database migrate:deploy
      - name: Patch advisory lock query
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/database/src/ai-provider-gateway.ts')
          text = path.read_text()
          old = '    await transaction.$queryRaw`SELECT pg_advisory_xact_lock(${AI_PROVIDER_BUDGET_LOCK_KEY})`;'
          new = '''    await transaction.$queryRaw`
            SELECT COUNT(*)::integer AS "locked"
            FROM (
              SELECT pg_advisory_xact_lock(${AI_PROVIDER_BUDGET_LOCK_KEY})
            ) AS "budgetLock"
          `;'''
          if text.count(old) != 1:
              raise SystemExit('Expected advisory-lock query exactly once')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write packages/database/src/ai-provider-gateway.ts
          pnpm --filter @luminol/database typecheck
          pnpm exec vitest run packages/database/src/ai-provider-gateway.integration.test.ts
          git diff --check
      - name: Commit advisory lock fix
        run: |
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/src/ai-provider-gateway.ts
          git commit -m "Fix AI provider advisory lock result [ai-provider-lock-fix]"
          git push origin HEAD:feat/ai-provider-gateway
