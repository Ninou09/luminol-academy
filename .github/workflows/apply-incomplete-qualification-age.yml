name: Apply incomplete qualification age

on:
  push:
    branches:
      - feat/incomplete-qualification-age

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/incomplete-qualification-age
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate incomplete qualification age into dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          ops = Path('apps/admin/lib/operations.server.ts')
          text = ops.read_text()

          import_marker = "import {\n  getMissingFollowUpPlanAgeWhere,\n  summarizeMissingFollowUpPlanAge,\n} from './enquiry-missing-follow-up-age-reporting';\n"
          import_addition = import_marker + "import {\n  getIncompleteQualificationAgeWhere,\n  summarizeIncompleteQualificationAge,\n} from './enquiry-incomplete-qualification-age-reporting';\n"
          if import_marker not in text:
              raise SystemExit('missing follow-up age import marker not found')
          text = text.replace(import_marker, import_addition, 1)

          type_marker = "  missingFollowUpPlanAge: ActiveEnquiryAgeSummary;\n"
          type_addition = type_marker + "  incompleteQualificationAge: ActiveEnquiryAgeSummary;\n"
          if type_marker not in text:
              raise SystemExit('missing follow-up age type marker not found')
          text = text.replace(type_marker, type_addition, 1)

          destructure_marker = "    missingPlanOverSevenDays,\n    followUpMissingPlan,\n"
          destructure_addition = "    missingPlanOverSevenDays,\n    incompleteQualificationUnder24Hours,\n    incompleteQualificationOneToThreeDays,\n    incompleteQualificationFourToSevenDays,\n    incompleteQualificationOverSevenDays,\n    followUpMissingPlan,\n"
          if destructure_marker not in text:
              raise SystemExit('missing follow-up age destructure marker not found')
          text = text.replace(destructure_marker, destructure_addition, 1)

          query_marker = "    db.enquiry.count({\n      where: getMissingFollowUpPlanAgeWhere(now, 'overSevenDays'),\n    }),\n    db.enquiry.count({\n      where: getActiveEnquiryFollowUpTimingWhere(now, 'missingPlan'),\n    }),\n"
          query_addition = "    db.enquiry.count({\n      where: getMissingFollowUpPlanAgeWhere(now, 'overSevenDays'),\n    }),\n    db.enquiry.count({\n      where: getIncompleteQualificationAgeWhere(now, 'under24Hours'),\n    }),\n    db.enquiry.count({\n      where: getIncompleteQualificationAgeWhere(now, 'oneToThreeDays'),\n    }),\n    db.enquiry.count({\n      where: getIncompleteQualificationAgeWhere(now, 'fourToSevenDays'),\n    }),\n    db.enquiry.count({\n      where: getIncompleteQualificationAgeWhere(now, 'overSevenDays'),\n    }),\n    db.enquiry.count({\n      where: getActiveEnquiryFollowUpTimingWhere(now, 'missingPlan'),\n    }),\n"
          if query_marker not in text:
              raise SystemExit('missing follow-up age query marker not found')
          text = text.replace(query_marker, query_addition, 1)

          return_marker = "    activeEnquiryStatusMix: normalizeActiveEnquiryStatusMix(\n"
          return_addition = "    incompleteQualificationAge: summarizeIncompleteQualificationAge({\n      under24Hours: incompleteQualificationUnder24Hours,\n      oneToThreeDays: incompleteQualificationOneToThreeDays,\n      fourToSevenDays: incompleteQualificationFourToSevenDays,\n      overSevenDays: incompleteQualificationOverSevenDays,\n    }),\n    activeEnquiryStatusMix: normalizeActiveEnquiryStatusMix(\n"
          if return_marker not in text:
              raise SystemExit('active status return marker not found')
          text = text.replace(return_marker, return_addition, 1)
          ops.write_text(text)

          page = Path('apps/admin/app/page.tsx')
          text = page.read_text()

          page_import_marker = "import { getMissingFollowUpPlanAgeCopy } from '../lib/enquiry-missing-follow-up-age-localization';\n"
          page_import_addition = page_import_marker + "import { getIncompleteQualificationAgeCopy } from '../lib/enquiry-incomplete-qualification-age-localization';\n"
          if page_import_marker not in text:
              raise SystemExit('missing follow-up age page import marker not found')
          text = text.replace(page_import_marker, page_import_addition, 1)

          copy_marker = "  const missingFollowUpAgeCopy = getMissingFollowUpPlanAgeCopy(locale);\n"
          copy_addition = copy_marker + "  const incompleteQualificationAgeCopy = getIncompleteQualificationAgeCopy(locale);\n"
          if copy_marker not in text:
              raise SystemExit('missing follow-up age copy initializer marker not found')
          text = text.replace(copy_marker, copy_addition, 1)

          panel_marker = "          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{followUpTimingCopy.eyebrow}</p>\n"
          panel = "\n".join([
            "          <section className=\"admin-panel\">",
            "            <div className=\"panel-heading\">",
            "              <div>",
            "                <p className=\"eyebrow\">{incompleteQualificationAgeCopy.eyebrow}</p>",
            "                <h2>{incompleteQualificationAgeCopy.title}</h2>",
            "                <p>{incompleteQualificationAgeCopy.intro}</p>",
            "              </div>",
            "              <span>{number(operations.incompleteQualificationAge.activeTotal)}</span>",
            "            </div>",
            "            <div className=\"metric-grid\" aria-label={incompleteQualificationAgeCopy.title}>",
            "              <article>",
            "                <span>{incompleteQualificationAgeCopy.under24Hours}</span>",
            "                <strong>{number(operations.incompleteQualificationAge.buckets.under24Hours)}</strong>",
            "                <small>{incompleteQualificationAgeCopy.count(number(operations.incompleteQualificationAge.buckets.under24Hours))}</small>",
            "              </article>",
            "              <article>",
            "                <span>{incompleteQualificationAgeCopy.oneToThreeDays}</span>",
            "                <strong>{number(operations.incompleteQualificationAge.buckets.oneToThreeDays)}</strong>",
            "                <small>{incompleteQualificationAgeCopy.count(number(operations.incompleteQualificationAge.buckets.oneToThreeDays))}</small>",
            "              </article>",
            "              <article>",
            "                <span>{incompleteQualificationAgeCopy.fourToSevenDays}</span>",
            "                <strong>{number(operations.incompleteQualificationAge.buckets.fourToSevenDays)}</strong>",
            "                <small>{incompleteQualificationAgeCopy.count(number(operations.incompleteQualificationAge.buckets.fourToSevenDays))}</small>",
            "              </article>",
            "              <article>",
            "                <span>{incompleteQualificationAgeCopy.overSevenDays}</span>",
            "                <strong>{number(operations.incompleteQualificationAge.buckets.overSevenDays)}</strong>",
            "                <small>{incompleteQualificationAgeCopy.count(number(operations.incompleteQualificationAge.buckets.overSevenDays))}</small>",
            "              </article>",
            "            </div>",
            "          </section>",
            "",
          ]) + "\n"
          if panel_marker not in text:
              raise SystemExit('follow-up timing panel marker not found')
          text = text.replace(panel_marker, panel + panel_marker, 1)
          page.write_text(text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-incomplete-qualification-age-reporting.ts \
            apps/admin/lib/enquiry-incomplete-qualification-age-reporting.test.ts \
            apps/admin/lib/enquiry-incomplete-qualification-age-localization.ts \
            apps/admin/lib/enquiry-incomplete-qualification-age-localization.test.ts
      - name: Run git diff --check
        run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-incomplete-qualification-age-reporting.ts \
            apps/admin/lib/enquiry-incomplete-qualification-age-reporting.test.ts \
            apps/admin/lib/enquiry-incomplete-qualification-age-localization.ts \
            apps/admin/lib/enquiry-incomplete-qualification-age-localization.test.ts
          git commit -m "Integrate incomplete qualification age reporting"
          git push origin HEAD:feat/incomplete-qualification-age
