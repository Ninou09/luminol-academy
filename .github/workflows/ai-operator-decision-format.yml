name: Temporary AI Operator Decision Format
on:
  push:
    branches: [feat/ai-operator-approval-queue]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[decision-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-operator-approval-queue
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            packages/database/src/ai-operator-proposals.ts \
            packages/database/src/ai-operator-proposals.integration.test.ts
          git diff --check
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            packages/database/src/ai-operator-proposals.ts \
            packages/database/src/ai-operator-proposals.integration.test.ts
          git commit -m "Format AI Operator decision chronology [decision-formatted]"
          git push origin HEAD:feat/ai-operator-approval-queue
