name: Prettier diagnose

on:
  push:
    branches:
      - feat/meta-instagram-reels-provider

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          pnpm exec prettier --write packages/database/src/social-publishing-meta-provider.ts packages/database/src/social-publishing-meta-provider.test.ts
          if git diff --quiet -- packages/database/src/social-publishing-meta-provider.ts packages/database/src/social-publishing-meta-provider.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/social-publishing-meta-provider.ts packages/database/src/social-publishing-meta-provider.test.ts
          git commit -m "Format Meta social publishing provider"
          git push origin HEAD:feat/meta-instagram-reels-provider
