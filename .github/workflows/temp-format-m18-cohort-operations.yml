name: Temporary Milestone 18 cohort-operations formatter

on:
  push:
    branches:
      - feature/milestone-18-cohort-delivery-operations

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-18-cohort-delivery-operations
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/lib/cohort-operations.ts apps/admin/lib/cohort-operations.test.ts apps/admin/lib/cohort-operations-localization.ts apps/admin/lib/cohort-operations-localization.test.ts apps/admin/lib/cohort-operations.server.ts apps/admin/app/cohorts/actions.ts apps/admin/app/cohorts/schedule-actions.ts apps/admin/app/cohorts/page.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/lib/cohort-operations.ts apps/admin/lib/cohort-operations.test.ts apps/admin/lib/cohort-operations-localization.ts apps/admin/lib/cohort-operations-localization.test.ts apps/admin/lib/cohort-operations.server.ts apps/admin/app/cohorts/actions.ts apps/admin/app/cohorts/schedule-actions.ts apps/admin/app/cohorts/page.tsx
          git commit -m "Format cohort delivery operations"
          git push origin HEAD:feature/milestone-18-cohort-delivery-operations
