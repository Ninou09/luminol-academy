name: Refresh Milestone 14 nanoid lock once

on:
  push:
    branches:
      - feature/milestone-14-search-discovery

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out milestone branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/milestone-14-search-discovery
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: |
          set -euo pipefail
          grep -q '"nanoid@3.3.16": "3.3.17"' package.json
          pnpm install --lockfile-only --no-frozen-lockfile
          grep -q "nanoid@3.3.17" pnpm-lock.yaml
          if grep -q "nanoid@3.3.16" pnpm-lock.yaml; then
            echo "Vulnerable nanoid 3.3.16 remains in lockfile" >&2
            exit 1
          fi
          rm .github/workflows/refresh-nanoid-m14-once.yml
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/refresh-nanoid-m14-once.yml
          git commit -m "Refresh Milestone 14 lockfile for patched nanoid"
          git push origin HEAD:feature/milestone-14-search-discovery
