name: Prettier preview

on:
  push:
    branches:
      - feature/milestone-16-organizations-foundation
    paths:
      - .github/workflows/prettier-preview.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output
        run: |
          pnpm exec prettier --write packages/professional/src/corporate-training.ts packages/professional/src/corporate-training.test.ts
          echo '=== corporate-training.ts ==='
          cat packages/professional/src/corporate-training.ts
          echo '=== corporate-training.test.ts ==='
          cat packages/professional/src/corporate-training.test.ts
