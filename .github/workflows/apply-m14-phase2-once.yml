name: Apply Milestone 14 Phase 2

on:
  push:
    branches:
      - feature/milestone-14-search-discovery
    paths:
      - .github/workflows/apply-m14-phase2-once.yml

permissions:
  contents: write

jobs:
  build-phase-2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out milestone branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-14-search-discovery
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply public programme discovery slice
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          branch = 'feature/milestone-14-search-discovery'

          sanity = Path('apps/web/lib/sanity.ts')
          text = sanity.read_text()
          text = text.replace(
              "import type { SchoolSlug } from './schools';\n",
              "import type { SchoolSlug } from './schools';\n\nexport const PROGRAMME_LANGUAGE_CODES = ['ar', 'fr', 'en'] as const;\nconst schoolSlugSchema = z.enum(['psychology', 'languages', 'training']);\nconst programmeLanguageSchema = z.enum(PROGRAMME_LANGUAGE_CODES);\n",
          )
          text = text.replace(
              "  slug: z.object({ current: z.string().min(1) }).nullish(),\n  delivery: z.string().trim().max(80).nullish(),\n",
              "  slug: z.object({ current: z.string().min(1) }).nullish(),\n  school: schoolSlugSchema.nullish(),\n  languages: z.array(programmeLanguageSchema).max(3).optional(),\n  delivery: z.string().trim().max(80).nullish(),\n",
          )
          text = text.replace(
              "const cmsProgrammeListSchema = z.array(cmsProgrammeSchema).max(100);\n\nexport type CmsProgramme = z.infer<typeof cmsProgrammeSchema>;\n",
              "const cmsProgrammeListSchema = z.array(cmsProgrammeSchema).max(100);\nconst publicCmsProgrammeSchema = cmsProgrammeSchema.extend({\n  slug: z.object({ current: z.string().trim().min(1).max(96) }),\n  school: schoolSlugSchema,\n  languages: z.array(programmeLanguageSchema).max(3).default([]),\n});\nconst publicCmsProgrammeListSchema = z.array(publicCmsProgrammeSchema).max(250);\n\nexport type CmsProgramme = z.infer<typeof cmsProgrammeSchema>;\nexport type PublicCmsProgramme = z.infer<typeof publicCmsProgrammeSchema>;\nexport type CmsProgrammeLanguage = (typeof PROGRAMME_LANGUAGE_CODES)[number];\n",
          )
          text = text.replace(
              "    _type == \"programme\" &&\n    school == $school &&\n    active == true\n",
              "    _type == \"programme\" &&\n    school == $school &&\n    active == true &&\n    !(_id in path(\"drafts.**\")) &&\n    defined(slug.current)\n",
          )
          text = text.replace(
              "    slug,\n    delivery,\n",
              "    slug,\n    school,\n    \"languages\": coalesce(languages, []),\n    delivery,\n",
              1,
          )
          addition = r'''

export async function getPublicProgrammes(): Promise<
  PublicCmsProgramme[] | null
> {
  const config = getSanityConfig();
  if (!config) return null;

  const query = `*[
    _type == "programme" &&
    active == true &&
    !(_id in path("drafts.**")) &&
    defined(slug.current)
  ] | order(featured desc, school asc, order asc, title asc, _id asc) {
    _id,
    title,
    summary,
    slug,
    school,
    "languages": coalesce(languages, []),
    delivery,
    "featured": coalesce(featured, false),
    "image": select(
      defined(image.asset) => {
        "url": image.asset->url,
        "alt": image.alt,
        "crop": image.crop,
        "hotspot": image.hotspot,
        "dimensions": image.asset->metadata.dimensions
      },
      null
    )
  }`;

  const endpoint = new URL(
    `https://${config.projectId}.api.sanity.io/v${SANITY_API_VERSION}/data/query/${config.dataset}`,
  );
  endpoint.searchParams.set('query', query);

  try {
    const response = await fetch(endpoint, {
      next: { revalidate: 300 },
    });
    if (!response.ok) return null;

    const payload: unknown = await response.json();
    const result = z.object({ result: z.unknown() }).safeParse(payload);
    if (!result.success) return null;

    const programmes = publicCmsProgrammeListSchema.safeParse(
      result.data.result,
    );
    return programmes.success ? programmes.data : null;
  } catch {
    return null;
  }
}
'''
          if 'export async function getPublicProgrammes' not in text:
              text = text.rstrip() + addition + '\n'
          sanity.write_text(text)

          schema = Path('apps/studio/schemaTypes/index.ts')
          text = schema.read_text()
          text = text.replace(
              "] as const;\n\nconst programme = defineType({",
              "] as const;\n\nconst languageOptions = [\n  { title: 'Arabic', value: 'ar' },\n  { title: 'French', value: 'fr' },\n  { title: 'English', value: 'en' },\n] as const;\n\nconst programme = defineType({",
              1,
          )
          marker = "    defineField({\n      name: 'image',\n      title: 'Purposeful programme image',"
          language_field = "    defineField({\n      name: 'languages',\n      title: 'Languages of delivery',\n      description:\n        'Select each language in which this programme can currently be delivered. Used by public discovery filters.',\n      type: 'array',\n      of: [{ type: 'string' }],\n      options: { list: [...languageOptions], layout: 'grid' },\n      validation: (rule) => rule.unique().max(3),\n    }),\n"
          if language_field not in text:
              if marker not in text:
                  raise SystemExit('programme image marker not found')
              text = text.replace(marker, language_field + marker, 1)
          schema.write_text(text)

          discovery = Path('apps/web/lib/programme-discovery.ts')
          discovery.write_text(r'''import { z } from 'zod';

import {
  PROGRAMME_LANGUAGE_CODES,
  type CmsProgrammeLanguage,
  type PublicCmsProgramme,
} from './sanity';
import { isSchoolSlug, schools, type SchoolSlug } from './schools';

export const PUBLIC_PROGRAMME_MAX_QUERY_LENGTH = 100;

export const programmeLanguageLabels: Record<CmsProgrammeLanguage, string> = {
  ar: 'Arabic',
  fr: 'French',
  en: 'English',
};

export type ProgrammeDiscoveryFilters = {
  query: string;
  school?: SchoolSlug;
  language?: CmsProgrammeLanguage;
};

const paramsObjectSchema = z.record(z.string(), z.unknown());
const singleValueSchema = z.union([
  z.string(),
  z.tuple([z.string()]).transform(([value]) => value),
]);

function parseSingleParam(value: unknown, maxLength: number) {
  const parsed = singleValueSchema.safeParse(value);
  if (!parsed.success) return undefined;
  return parsed.data.trim().slice(0, maxLength);
}

function fold(value: string) {
  return value
    .normalize('NFKC')
    .toLocaleLowerCase('en')
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/[أإآ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ')
    .trim();
}

export function parseProgrammeDiscoveryParams(
  value: unknown,
): ProgrammeDiscoveryFilters {
  const parsed = paramsObjectSchema.safeParse(value);
  if (!parsed.success) return { query: '' };

  const query =
    parseSingleParam(parsed.data.q, PUBLIC_PROGRAMME_MAX_QUERY_LENGTH) ?? '';
  const schoolValue = parseSingleParam(parsed.data.school, 32);
  const languageValue = parseSingleParam(parsed.data.language, 8);

  const school = schoolValue && isSchoolSlug(schoolValue) ? schoolValue : undefined;
  const languageResult = z.enum(PROGRAMME_LANGUAGE_CODES).safeParse(languageValue);

  return {
    query,
    school,
    language: languageResult.success ? languageResult.data : undefined,
  };
}

function textScore(programme: PublicCmsProgramme, foldedQuery: string) {
  if (!foldedQuery) return 0;

  const title = fold(programme.title);
  const summary = fold(programme.summary);
  const delivery = fold(programme.delivery ?? '');
  const school = fold(schools[programme.school].name);
  const languageText = fold(
    programme.languages.map((code) => programmeLanguageLabels[code]).join(' '),
  );

  let score = 0;
  if (title === foldedQuery) score += 120;
  else if (title.startsWith(foldedQuery)) score += 90;
  else if (title.includes(foldedQuery)) score += 70;

  if (summary.includes(foldedQuery)) score += 30;
  if (school.includes(foldedQuery)) score += 20;
  if (delivery.includes(foldedQuery)) score += 10;
  if (languageText.includes(foldedQuery)) score += 10;

  return score;
}

export function filterPublicProgrammes(
  programmes: readonly PublicCmsProgramme[],
  filters: ProgrammeDiscoveryFilters,
) {
  const foldedQuery = fold(filters.query);

  return programmes
    .flatMap((programme) => {
      if (filters.school && programme.school !== filters.school) return [];
      if (
        filters.language &&
        !programme.languages.includes(filters.language)
      ) {
        return [];
      }

      const score = textScore(programme, foldedQuery);
      if (foldedQuery && score === 0) return [];

      return [{ programme, score }];
    })
    .sort(
      (a, b) =>
        Number(b.programme.featured) - Number(a.programme.featured) ||
        b.score - a.score ||
        a.programme.title.localeCompare(b.programme.title) ||
        a.programme._id.localeCompare(b.programme._id),
    )
    .map(({ programme }) => programme);
}
''')

          Path('apps/web/lib/programme-discovery.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';

import {
  filterPublicProgrammes,
  parseProgrammeDiscoveryParams,
} from './programme-discovery';
import type { PublicCmsProgramme } from './sanity';

const programmes: PublicCmsProgramme[] = [
  {
    _id: 'programme-english',
    title: 'English Conversation',
    summary: 'Build confidence for practical everyday conversations.',
    slug: { current: 'english-conversation' },
    school: 'languages',
    languages: ['en'],
    delivery: 'Hybrid',
    featured: true,
    image: null,
  },
  {
    _id: 'programme-stress',
    title: 'إدارة الضغط',
    summary: 'برنامج عملي لفهم الضغط وبناء عادات يومية أكثر توازناً.',
    slug: { current: 'stress-management' },
    school: 'psychology',
    languages: ['ar', 'fr'],
    delivery: 'In person',
    featured: false,
    image: null,
  },
  {
    _id: 'programme-leadership',
    title: 'Leadership Foundations',
    summary: 'Practical leadership habits for managers and team leads.',
    slug: { current: 'leadership-foundations' },
    school: 'training',
    languages: ['en', 'fr'],
    delivery: 'Flexible',
    featured: false,
    image: null,
  },
];

describe('programme discovery filters', () => {
  it('validates and bounds URL-owned filters', () => {
    expect(
      parseProgrammeDiscoveryParams({
        q: '  leadership  ',
        school: 'training',
        language: 'fr',
      }),
    ).toEqual({ query: 'leadership', school: 'training', language: 'fr' });

    expect(
      parseProgrammeDiscoveryParams({
        q: ['one', 'two'],
        school: 'unknown',
        language: 'de',
      }),
    ).toEqual({ query: '' });
  });

  it('filters by school and delivery language', () => {
    expect(
      filterPublicProgrammes(programmes, {
        query: '',
        school: 'training',
        language: 'fr',
      }).map((programme) => programme._id),
    ).toEqual(['programme-leadership']);
  });

  it('supports normalized Arabic programme search', () => {
    expect(
      filterPublicProgrammes(programmes, { query: 'ادارة الضغط' })[0]?._id,
    ).toBe('programme-stress');
  });

  it('ranks featured matches first and stays deterministic', () => {
    expect(
      filterPublicProgrammes(programmes, { query: '' }).map(
        (programme) => programme._id,
      ),
    ).toEqual([
      'programme-english',
      'programme-stress',
      'programme-leadership',
    ]);
  });
});
''')

          Path('apps/web/lib/public-programmes.test.ts').write_text(r'''import { afterEach, describe, expect, it, vi } from 'vitest';

