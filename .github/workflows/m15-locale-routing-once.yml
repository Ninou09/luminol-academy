name: Build Milestone 15 locale routing once

on:
  push:
    branches:
      - feature/milestone-15-locale-routing

permissions:
  contents: write

jobs:
  build-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install current workspace
        run: pnpm install --frozen-lockfile
      - name: Build locale routing and persistence
        shell: bash
        run: |
          set -euo pipefail

          node <<'EOF'
          const fs = require('node:fs');

          for (const path of [
            'apps/web/package.json',
            'apps/portal/package.json',
            'apps/admin/package.json',
          ]) {
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.dependencies = pkg.dependencies || {};
            pkg.dependencies['@luminol/localization'] = 'workspace:*';
            pkg.dependencies = Object.fromEntries(
              Object.entries(pkg.dependencies).sort(([a], [b]) => a.localeCompare(b)),
            );
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          EOF

          if ! grep -q "LOCALE_COOKIE_NAME" packages/localization/src/index.ts; then
            cat >> packages/localization/src/index.ts <<'EOF'

          export const LOCALE_COOKIE_NAME = 'luminol_locale';
          export const LOCALE_COOKIE_MAX_AGE_SECONDS = 60 * 60 * 24 * 365;

          export type LocaleRoutingOptions = {
            bypassPrefixes?: readonly string[];
            bypassExact?: readonly string[];
          };

          export type LocaleRoutingDecision =
            | { kind: 'bypass' }
            | { kind: 'rewrite'; locale: Locale; pathname: string }
            | { kind: 'redirect'; locale: Locale; pathname: string };

          function matchesPathPrefix(pathname: string, prefix: string): boolean {
            return pathname === prefix || pathname.startsWith(`${prefix}/`);
          }

          function shouldBypassLocaleRouting(
            pathname: string,
            options: LocaleRoutingOptions,
          ): boolean {
            if (options.bypassExact?.includes(pathname)) return true;
            return Boolean(
              options.bypassPrefixes?.some((prefix) =>
                matchesPathPrefix(pathname, prefix),
              ),
            );
          }

          export function resolveLocaleRequest(
            pathname: string,
            storedLocale: unknown,
            options: LocaleRoutingOptions = {},
          ): LocaleRoutingDecision {
            const safePathname = pathname.startsWith('/') ? pathname : '/';

            if (shouldBypassLocaleRouting(safePathname, options)) {
              return { kind: 'bypass' };
            }

            const localized = parseLocalizedPathname(safePathname);
            if (localized) {
              if (shouldBypassLocaleRouting(localized.pathname, options)) {
                return { kind: 'bypass' };
              }

              const rawLocaleSegment = safePathname.split('/')[1] ?? '';
              const canonicalPathname = localizePathname(
                localized.locale,
                localized.pathname,
              );

              if (rawLocaleSegment !== localized.locale) {
                return {
                  kind: 'redirect',
                  locale: localized.locale,
                  pathname: canonicalPathname,
                };
              }

              return {
                kind: 'rewrite',
                locale: localized.locale,
                pathname: localized.pathname,
              };
            }

            const locale = parseLocale(storedLocale);
            return {
              kind: 'redirect',
              locale,
              pathname: localizePathname(locale, safePathname),
            };
          }
          EOF
          fi

          cat > packages/localization/src/routing.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          import {
            LOCALE_COOKIE_MAX_AGE_SECONDS,
            LOCALE_COOKIE_NAME,
            resolveLocaleRequest,
          } from './index';

          const routingOptions = {
            bypassPrefixes: ['/api', '/trpc', '/__clerk', '/.well-known'],
            bypassExact: ['/robots.txt', '/sitemap.xml'],
          } as const;

          describe('locale request routing', () => {
            it('redirects unprefixed pages to the persisted locale', () => {
              expect(resolveLocaleRequest('/programmes', 'fr', routingOptions)).toEqual({
                kind: 'redirect',
                locale: 'fr',
                pathname: '/fr/programmes',
              });
            });

            it('falls back deterministically to English', () => {
              expect(resolveLocaleRequest('/about', 'de', routingOptions)).toEqual({
                kind: 'redirect',
                locale: 'en',
                pathname: '/en/about',
              });
            });

            it('rewrites canonical localized pages to their internal route', () => {
              expect(resolveLocaleRequest('/ar/programmes', 'en', routingOptions)).toEqual({
                kind: 'rewrite',
                locale: 'ar',
                pathname: '/programmes',
              });
            });

            it('canonicalizes locale prefix casing', () => {
              expect(resolveLocaleRequest('/FR/about', 'en', routingOptions)).toEqual({
                kind: 'redirect',
                locale: 'fr',
                pathname: '/fr/about',
              });
            });

            it('does not localize machine routes or create localized API aliases', () => {
              expect(resolveLocaleRequest('/api/health', 'ar', routingOptions)).toEqual({
                kind: 'bypass',
              });
              expect(resolveLocaleRequest('/fr/api/health', 'ar', routingOptions)).toEqual({
                kind: 'bypass',
              });
              expect(resolveLocaleRequest('/robots.txt', 'fr', routingOptions)).toEqual({
                kind: 'bypass',
              });
            });

            it('uses path-segment boundaries for bypass prefixes', () => {
              expect(resolveLocaleRequest('/apiary', 'fr', routingOptions)).toEqual({
                kind: 'redirect',
                locale: 'fr',
                pathname: '/fr/apiary',
              });
            });

            it('defines a durable same-origin locale cookie contract', () => {
              expect(LOCALE_COOKIE_NAME).toBe('luminol_locale');
              expect(LOCALE_COOKIE_MAX_AGE_SECONDS).toBe(31_536_000);
            });
          });
          EOF

          cat > apps/web/proxy.ts <<'EOF'
          import {
            LOCALE_COOKIE_MAX_AGE_SECONDS,
            LOCALE_COOKIE_NAME,
            LOCALE_REQUEST_HEADER,
            resolveLocaleRequest,
            type Locale,
          } from '@luminol/localization';
          import type { NextRequest } from 'next/server';
          import { NextResponse } from 'next/server';

          const localeRoutingOptions = {
            bypassPrefixes: ['/api', '/trpc', '/.well-known'],
            bypassExact: ['/robots.txt', '/sitemap.xml'],
          } as const;

          function persistLocale(
            response: NextResponse,
            request: NextRequest,
            locale: Locale,
          ) {
            if (request.cookies.get(LOCALE_COOKIE_NAME)?.value !== locale) {
              response.cookies.set(LOCALE_COOKIE_NAME, locale, {
                httpOnly: true,
                sameSite: 'lax',
                secure: process.env.NODE_ENV === 'production',
                path: '/',
                maxAge: LOCALE_COOKIE_MAX_AGE_SECONDS,
              });
            }

            return response;
          }

          export function proxy(request: NextRequest) {
            const decision = resolveLocaleRequest(
              request.nextUrl.pathname,
              request.cookies.get(LOCALE_COOKIE_NAME)?.value,
              localeRoutingOptions,
            );

            if (decision.kind === 'bypass') return NextResponse.next();

            if (decision.kind === 'redirect') {
              const destination = request.nextUrl.clone();
              destination.pathname = decision.pathname;
              return persistLocale(
                NextResponse.redirect(destination),
                request,
                decision.locale,
              );
            }

            const destination = request.nextUrl.clone();
            destination.pathname = decision.pathname;
            const requestHeaders = new Headers(request.headers);
            requestHeaders.set(LOCALE_REQUEST_HEADER, decision.locale);

            return persistLocale(
              NextResponse.rewrite(destination, {
                request: { headers: requestHeaders },
              }),
              request,
              decision.locale,
            );
          }

          export const config = {
            matcher: [
              '/((?!_next|[^?]*\\.(?:html?|css|js(?!on)|jpe?g|webp|png|gif|svg|ttf|woff2?|ico|csv|docx?|xlsx?|zip|webmanifest)).*)',
              '/(api|trpc)(.*)',
            ],
          };
          EOF

          cat > apps/portal/proxy.ts <<'EOF'
          import { clerkMiddleware } from '@clerk/nextjs/server';
          import {
            LOCALE_COOKIE_MAX_AGE_SECONDS,
            LOCALE_COOKIE_NAME,
            LOCALE_REQUEST_HEADER,
            resolveLocaleRequest,
            type Locale,
          } from '@luminol/localization';
          import type { NextRequest } from 'next/server';
          import { NextResponse } from 'next/server';

          const localeRoutingOptions = {
            bypassPrefixes: ['/api', '/trpc', '/__clerk', '/.well-known'],
          } as const;

          function isPublicPathname(pathname: string) {
            return (
              pathname === '/sign-in' ||
              pathname.startsWith('/sign-in/') ||
              pathname === '/sign-up' ||
              pathname.startsWith('/sign-up/')
            );
          }

          function persistLocale(
            response: NextResponse,
            request: NextRequest,
            locale: Locale,
          ) {
            if (request.cookies.get(LOCALE_COOKIE_NAME)?.value !== locale) {
              response.cookies.set(LOCALE_COOKIE_NAME, locale, {
                httpOnly: true,
                sameSite: 'lax',
                secure: process.env.NODE_ENV === 'production',
                path: '/',
                maxAge: LOCALE_COOKIE_MAX_AGE_SECONDS,
              });
            }

            return response;
          }

          export default clerkMiddleware(async (auth, request) => {
            const decision = resolveLocaleRequest(
              request.nextUrl.pathname,
              request.cookies.get(LOCALE_COOKIE_NAME)?.value,
              localeRoutingOptions,
            );

            if (decision.kind === 'bypass') {
              if (!isPublicPathname(request.nextUrl.pathname)) {
                await auth.protect();
              }
              return NextResponse.next();
            }

            if (decision.kind === 'redirect') {
              const destination = request.nextUrl.clone();
              destination.pathname = decision.pathname;
              return persistLocale(
                NextResponse.redirect(destination),
                request,
                decision.locale,
              );
            }

            if (!isPublicPathname(decision.pathname)) await auth.protect();

            const destination = request.nextUrl.clone();
            destination.pathname = decision.pathname;
            const requestHeaders = new Headers(request.headers);
            requestHeaders.set(LOCALE_REQUEST_HEADER, decision.locale);

            return persistLocale(
              NextResponse.rewrite(destination, {
                request: { headers: requestHeaders },
              }),
              request,
              decision.locale,
            );
          });

          export const config = {
            matcher: [
              '/((?!_next|[^?]*\\.(?:html?|css|js(?!on)|jpe?g|webp|png|gif|svg|ttf|woff2?|ico|csv|docx?|xlsx?|zip|webmanifest)).*)',
              '/(api|trpc)(.*)',
            ],
          };
          EOF

