name: Apply landing path mix

on:
  push:
    branches:
      - feat/landing-path-mix

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/landing-path-mix
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate landing path mix into dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          ops = Path('apps/admin/lib/operations.server.ts')
          text = ops.read_text()
          text = text.replace(
              "import {\n  normalizeEnquiryTimingPreferenceMix,\n  type EnquiryTimingPreferenceMixSummary,\n} from './enquiry-timing-preference-reporting';\n",
              "import {\n  normalizeEnquiryTimingPreferenceMix,\n  type EnquiryTimingPreferenceMixSummary,\n} from './enquiry-timing-preference-reporting';\nimport {\n  normalizeEnquiryLandingPathMix,\n  type EnquiryLandingPathMixSummary,\n} from './enquiry-landing-path-reporting';\n",
          )
          text = text.replace(
              "  enquiryTimingPreferenceMixLast30Days: EnquiryTimingPreferenceMixSummary;\n",
              "  enquiryTimingPreferenceMixLast30Days: EnquiryTimingPreferenceMixSummary;\n  enquiryLandingPathMixLast30Days: EnquiryLandingPathMixSummary;\n",
          )
          text = text.replace(
              "    campaignPairGroupsLast30Days,\n    preferredContactGroupsLast30Days,\n",
              "    campaignPairGroupsLast30Days,\n    landingPathRecordedLast30Days,\n    landingPathGroupsLast30Days,\n    preferredContactGroupsLast30Days,\n",
          )
          text = text.replace(
              "    db.enquiry.groupBy({\n      by: ['utmSource', 'utmCampaign'],\n      where: getCampaignNamedRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.groupBy({\n      by: ['preferredContact'],\n",
              "    db.enquiry.groupBy({\n      by: ['utmSource', 'utmCampaign'],\n      where: getCampaignNamedRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.count({\n      where: {\n        ...getRecentEnquiryWhere(now),\n        landingPath: { not: null },\n      },\n    }),\n    db.enquiry.groupBy({\n      by: ['landingPath'],\n      where: {\n        ...getRecentEnquiryWhere(now),\n        landingPath: { not: null },\n      },\n      _count: { _all: true },\n    }),\n    db.enquiry.groupBy({\n      by: ['preferredContact'],\n",
          )
          marker = """    campaignEnquiryMixLast30Days: {\n      taggedTotal: campaignAttributedLast30Days,\n      untaggedTotal: calculateUntaggedEnquiryCount(\n        enquiriesLast30Days,\n        campaignAttributedLast30Days,\n      ),\n      sourceMix: normalizeCampaignSourceMix(campaignSourceGroupsLast30Days),\n      campaignMix: normalizeCampaignPairMix(campaignPairGroupsLast30Days),\n    },\n"""
          addition = marker + """    enquiryLandingPathMixLast30Days: normalizeEnquiryLandingPathMix(\n      landingPathGroupsLast30Days,\n      enquiriesLast30Days,\n      landingPathRecordedLast30Days,\n    ),\n"""
          if marker not in text:
              raise SystemExit('campaign return marker not found')
          text = text.replace(marker, addition, 1)
          ops.write_text(text)

          page = Path('apps/admin/app/page.tsx')
          text = page.read_text()
          text = text.replace(
              "import { getEnquiryCampaignReportingCopy } from '../lib/enquiry-campaign-reporting-localization';\n",
              "import { getEnquiryCampaignReportingCopy } from '../lib/enquiry-campaign-reporting-localization';\nimport { getEnquiryLandingPathCopy } from '../lib/enquiry-landing-path-localization';\n",
          )
          text = text.replace(
              "  const campaignCopy = getEnquiryCampaignReportingCopy(locale);\n",
              "  const campaignCopy = getEnquiryCampaignReportingCopy(locale);\n  const landingPathCopy = getEnquiryLandingPathCopy(locale);\n",
          )
          marker = """          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{workflowCopy.eyebrow}</p>\n"""
          panel = """          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{landingPathCopy.eyebrow}</p>\n                <h2>{landingPathCopy.title}</h2>\n                <p>{landingPathCopy.intro}</p>\n              </div>\n              <span>{copy.dashboard.rollingThirtyDays}</span>\n            </div>\n            <div className=\"metric-grid\" aria-label={landingPathCopy.title}>\n              <article>\n                <span>{landingPathCopy.recorded}</span>\n                <strong>{number(operations.enquiryLandingPathMixLast30Days.recorded)}</strong>\n                <small>{landingPathCopy.count(number(operations.enquiryLandingPathMixLast30Days.recorded))}</small>\n              </article>\n              <article>\n                <span>{landingPathCopy.missing}</span>\n                <strong>{number(operations.enquiryLandingPathMixLast30Days.missing)}</strong>\n                <small>{landingPathCopy.count(number(operations.enquiryLandingPathMixLast30Days.missing))}</small>\n              </article>\n            </div>\n            <div className=\"panel-heading\">\n              <div>\n                <h3>{landingPathCopy.topPaths}</h3>\n              </div>\n            </div>\n            {operations.enquiryLandingPathMixLast30Days.items.length > 0 ? (\n              <div className=\"metric-grid\" aria-label={landingPathCopy.topPaths}>\n                {operations.enquiryLandingPathMixLast30Days.items.map((item) => (\n                  <article key={item.landingPath}>\n                    <span dir=\"ltr\">{item.landingPath}</span>\n                    <strong>{number(item.count)}</strong>\n                    <small>{landingPathCopy.count(number(item.count))}</small>\n                  </article>\n                ))}\n              </div>\n            ) : (\n              <p className=\"admin-empty\">{landingPathCopy.noPaths}</p>\n            )}\n          </section>\n\n"""
          if marker not in text:
              raise SystemExit('workflow panel marker not found')
          text = text.replace(marker, panel + marker, 1)
          page.write_text(text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-landing-path-reporting.ts \
            apps/admin/lib/enquiry-landing-path-reporting.test.ts \
            apps/admin/lib/enquiry-landing-path-localization.ts \
            apps/admin/lib/enquiry-landing-path-localization.test.ts
      - run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-landing-path-reporting.ts \
            apps/admin/lib/enquiry-landing-path-reporting.test.ts \
            apps/admin/lib/enquiry-landing-path-localization.ts \
            apps/admin/lib/enquiry-landing-path-localization.test.ts
          git commit -m "Integrate landing path enquiry reporting"
          git push origin HEAD:feat/landing-path-mix
