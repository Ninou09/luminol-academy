name: Apply delivery preference mix

on:
  push:
    branches:
      - feat/delivery-preference-mix

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/delivery-preference-mix
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate delivery preference mix into dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          ops = Path('apps/admin/lib/operations.server.ts')
          text = ops.read_text()
          text = text.replace(
              "import {\n  normalizeEnquiryContactPreferenceMix,\n  type EnquiryContactPreferenceMixSummary,\n} from './enquiry-contact-preference-reporting';\n",
              "import {\n  normalizeEnquiryContactPreferenceMix,\n  type EnquiryContactPreferenceMixSummary,\n} from './enquiry-contact-preference-reporting';\nimport {\n  normalizeEnquiryDeliveryPreferenceMix,\n  type EnquiryDeliveryPreferenceMixSummary,\n} from './enquiry-delivery-preference-reporting';\n",
          )
          text = text.replace(
              "  enquiryContactPreferenceMixLast30Days: EnquiryContactPreferenceMixSummary;\n",
              "  enquiryContactPreferenceMixLast30Days: EnquiryContactPreferenceMixSummary;\n  enquiryDeliveryPreferenceMixLast30Days: EnquiryDeliveryPreferenceMixSummary;\n",
          )
          text = text.replace(
              "    preferredContactGroupsLast30Days,\n    activeEnquiryStatusGroups,\n",
              "    preferredContactGroupsLast30Days,\n    deliveryPreferenceGroupsLast30Days,\n    activeEnquiryStatusGroups,\n",
          )
          text = text.replace(
              "    db.enquiry.groupBy({\n      by: ['preferredContact'],\n      where: getRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.groupBy({\n      by: ['status'],\n",
              "    db.enquiry.groupBy({\n      by: ['preferredContact'],\n      where: getRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.groupBy({\n      by: ['deliveryPreference'],\n      where: getRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.groupBy({\n      by: ['status'],\n",
          )
          text = text.replace(
              "    enquiryContactPreferenceMixLast30Days:\n      normalizeEnquiryContactPreferenceMix(\n        preferredContactGroupsLast30Days,\n        enquiriesLast30Days,\n      ),\n",
              "    enquiryContactPreferenceMixLast30Days:\n      normalizeEnquiryContactPreferenceMix(\n        preferredContactGroupsLast30Days,\n        enquiriesLast30Days,\n      ),\n    enquiryDeliveryPreferenceMixLast30Days:\n      normalizeEnquiryDeliveryPreferenceMix(\n        deliveryPreferenceGroupsLast30Days,\n        enquiriesLast30Days,\n      ),\n",
          )
          ops.write_text(text)

          page = Path('apps/admin/app/page.tsx')
          text = page.read_text()
          text = text.replace(
              "import { getEnquiryContactPreferenceCopy } from '../lib/enquiry-contact-preference-localization';\n",
              "import { getEnquiryContactPreferenceCopy } from '../lib/enquiry-contact-preference-localization';\nimport { getEnquiryDeliveryPreferenceCopy } from '../lib/enquiry-delivery-preference-localization';\n",
          )
          text = text.replace(
              "  const contactPreferenceCopy = getEnquiryContactPreferenceCopy(locale);\n",
              "  const contactPreferenceCopy = getEnquiryContactPreferenceCopy(locale);\n  const deliveryPreferenceCopy = getEnquiryDeliveryPreferenceCopy(locale);\n",
          )
          marker = """          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{outcomeCoverageCopy.eyebrow}</p>\n"""
          panel = """          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{deliveryPreferenceCopy.eyebrow}</p>\n                <h2>{deliveryPreferenceCopy.title}</h2>\n                <p>{deliveryPreferenceCopy.intro}</p>\n              </div>\n              <span>{copy.dashboard.rollingThirtyDays}</span>\n            </div>\n            <div className=\"metric-grid\" aria-label={deliveryPreferenceCopy.title}>\n              <article>\n                <span>{deliveryPreferenceCopy.missing}</span>\n                <strong>\n                  {number(operations.enquiryDeliveryPreferenceMixLast30Days.missing)}\n                </strong>\n                <small>\n                  {deliveryPreferenceCopy.count(\n                    number(operations.enquiryDeliveryPreferenceMixLast30Days.missing),\n                  )}\n                </small>\n              </article>\n              {operations.enquiryDeliveryPreferenceMixLast30Days.items.map(\n                (item) => (\n                  <article key={item.deliveryPreference}>\n                    <span>\n                      {item.deliveryPreference === 'IN_PERSON'\n                        ? deliveryPreferenceCopy.inPerson\n                        : item.deliveryPreference === 'ONLINE'\n                          ? deliveryPreferenceCopy.online\n                          : item.deliveryPreference === 'FLEXIBLE'\n                            ? deliveryPreferenceCopy.flexible\n                            : deliveryPreferenceCopy.notSure}\n                    </span>\n                    <strong>{number(item.count)}</strong>\n                    <small>{deliveryPreferenceCopy.count(number(item.count))}</small>\n                  </article>\n                ),\n              )}\n            </div>\n          </section>\n\n"""
          if marker not in text:
              raise SystemExit('outcome panel marker not found')
          text = text.replace(marker, panel + marker, 1)
          page.write_text(text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-delivery-preference-reporting.ts \
            apps/admin/lib/enquiry-delivery-preference-reporting.test.ts \
            apps/admin/lib/enquiry-delivery-preference-localization.ts \
            apps/admin/lib/enquiry-delivery-preference-localization.test.ts
      - run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-delivery-preference-reporting.ts \
            apps/admin/lib/enquiry-delivery-preference-reporting.test.ts \
            apps/admin/lib/enquiry-delivery-preference-localization.ts \
            apps/admin/lib/enquiry-delivery-preference-localization.test.ts
          git commit -m "Integrate delivery preference mix reporting"
          git push origin HEAD:feat/delivery-preference-mix
