name: Format Milestone 14 once

on:
  push:
    branches:
      - feature/milestone-14-search-discovery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out milestone branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/milestone-14-search-discovery
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Milestone 14 files
        run: |
          pnpm exec prettier --write \
            apps/portal/app/search/page.tsx \
            apps/portal/lib/learning-search.ts \
            apps/portal/lib/learning-search.test.ts
          rm .github/workflows/format-m14-once.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/app/search/page.tsx apps/portal/lib/learning-search.ts apps/portal/lib/learning-search.test.ts .github/workflows/format-m14-once.yml
          git commit -m "Format Milestone 14 search files"
          git push origin HEAD:feature/milestone-14-search-discovery
