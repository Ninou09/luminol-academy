    },
''',
          '''    organizations: {
      metadataTitle: 'المؤسسات | إدارة لومينول',
      milestoneEyebrow: 'المرحلة 16',
      title: 'المؤسسات والتعلّم الجماعي',
      intro: 'إدارة مخصّصة للأكاديمية لعضويات المؤسسات والفرق والمقاعد والتعلّم المسند ومؤشرات الإكمال المجمّعة مع احترام الخصوصية.',
      back: 'العودة إلى الإدارة',
      findEyebrow: 'بحث',
      findTitle: 'البحث في إدارة المؤسسات',
      page: 'الصفحة',
      of: 'من',
      organizationsCount: 'مؤسسات',
      organizationName: 'اسم المؤسسة',
      userSearch: 'اسم المستخدم أو البريد الإلكتروني',
      courseSearch: 'الدورة المنشورة',
      search: 'بحث',
      clearFilters: 'مسح عوامل التصفية',
      selectorLimit: 'تعرض قوائم المستخدمين والدورات حتى {count} نتيجة مطابقة. ضيّق البحث للوصول إلى السجلات الأخرى.',
      createEyebrow: 'إنشاء',
      newOrganization: 'مؤسسة جديدة',
      seatLimit: 'حد المقاعد',
      createOrganization: 'إنشاء المؤسسة',
      noOrganizations: 'لم يتم إنشاء أي مؤسسة بعد.',
      archived: 'مؤرشفة',
      summaryAria: 'ملخص المؤسسة',
      persistedSeats: 'المقاعد المسجلة',
      activeMemberships: 'العضويات النشطة',
      activeTeams: 'الفرق النشطة',
      assignedCourses: 'الدورات المسندة',
      sponsoredCompletion: 'إكمال التعلّم المموّل',
      completed: 'مكتمل',
      memberships: 'العضويات',
      user: 'المستخدم',
      selectUser: 'اختر مستخدماً',
      role: 'الدور',
      addOrReactivate: 'إضافة أو إعادة تفعيل',
      changeRole: 'تغيير الدور',
      deactivate: 'إلغاء التفعيل',
      seats: 'المقاعد',
      activeMember: 'عضو نشط',
      selectMember: 'اختر عضواً',
      allocateSeat: 'تخصيص مقعد',
      nextSeatStatus: 'حالة المقعد التالية',
      moveTo: 'نقل إلى',
      updateSeat: 'تحديث المقعد',
      teams: 'الفرق',
      teamName: 'اسم الفريق',
      createTeam: 'إنشاء فريق',
      members: 'أعضاء',
      addMember: 'إضافة عضو',
      add: 'إضافة',
      remove: 'إزالة',
      archiveTeam: 'أرشفة الفريق',
      assignedLearning: 'التعلّم المسند',
      publishedCourse: 'الدورة المنشورة',
      selectCourse: 'اختر دورة',
      assignCourse: 'إسناد الدورة',
      unassignCourse: 'إلغاء الإسناد',
      mutationsDisabled: 'تم تعطيل التعديلات للمؤسسات المؤرشفة.',
      previousOrganizations: 'المؤسسات السابقة',
      nextOrganizations: 'المؤسسات التالية',
      loading: 'جارٍ تحميل إدارة المؤسسات…',
      errorTitle: 'إدارة المؤسسات غير متاحة حالياً',
      errorBody: 'لم نفترض نجاح أي تعديل على المؤسسة. أعد المحاولة بعد التحقق من الحالة الحالية للبيانات.',
      retry: 'إعادة المحاولة',
      notFoundTitle: 'لم يتم العثور على المؤسسة',
      notFoundBody: 'نطاق المؤسسة المطلوب غير موجود.',
      returnOrganizations: 'العودة إلى المؤسسات',
    },
'''
          ]

          anchor = '    certificates: {\n'
          for copy in copies:
              index = text.find(anchor)
              if index < 0:
                  raise SystemExit('Locale certificates anchor not found')
              text = text[:index] + copy + text[index:]
              # move search forward so the next lookup cannot hit the same locale again
              next_index = text.find(anchor, index + len(copy) + len(anchor))
              if copy is not copies[-1] and next_index < 0:
                  raise SystemExit('Next locale certificates anchor not found')
              if copy is not copies[-1]:
                  # replace the first anchor with a marker temporarily to advance iteration
                  text = text[:index + len(copy)] + text[index + len(copy):].replace(anchor, '__CERT_ANCHOR__\n', 1)
                  # restore prior markers after insertion loop below via sentinel accounting
          text = text.replace('__CERT_ANCHOR__\n', anchor)

          # The loop above is deliberately simple but can re-hit prior blocks after marker restoration.
          # Ensure exactly one organizations dictionary exists per supported locale.
          if text.count('    organizations: {') != 3:
              raise SystemExit(f'Expected 3 locale organization dictionaries, found {text.count("    organizations: {")}')

          enum_marker = 'const ENUM_LABELS'
          enum_index = text.find(enum_marker)
          if enum_index < 0:
              raise SystemExit('Enum label map not found')
          prefix, enum_text = text[:enum_index], text[enum_index:]
          enum_insertions = {
            "  en: {\n": "  en: {\n    OWNER: 'Owner', MANAGER: 'Manager', LEARNER: 'Learner', INVITED: 'Invited', SUSPENDED: 'Suspended', ARCHIVED: 'Archived',\n",
            "  fr: {\n": "  fr: {\n    OWNER: 'Propriétaire', MANAGER: 'Gestionnaire', LEARNER: 'Apprenant', INVITED: 'Invité', SUSPENDED: 'Suspendue', ARCHIVED: 'Archivée',\n",
            "  ar: {\n": "  ar: {\n    OWNER: 'المالك', MANAGER: 'المسيّر', LEARNER: 'المتعلم', INVITED: 'مدعو', SUSPENDED: 'معلّقة', ARCHIVED: 'مؤرشفة',\n",
          }
          for old, new in enum_insertions.items():
              if old not in enum_text:
                  raise SystemExit(f'Enum locale anchor not found: {old!r}')
              enum_text = enum_text.replace(old, new, 1)
          text = prefix + enum_text

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/admin/lib/admin-localization.ts
      - name: Commit localization dictionaries
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/admin/lib/admin-localization.ts
          git diff --cached --check
          git commit -m "Localize organization administration copy"
          git push origin HEAD:feature/milestone-16-organization-admin
