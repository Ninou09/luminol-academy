name: Milestone 16 organization localization patch

on:
  push:
    branches:
      - feature/milestone-16-organization-admin
    paths:
      - .github/workflows/m16-localization-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-admin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add organization administration dictionaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/admin/lib/admin-localization.ts')
          text = path.read_text()

          type_block = '''  organizations: {
    metadataTitle: string;
    milestoneEyebrow: string;
    title: string;
    intro: string;
    back: string;
    findEyebrow: string;
    findTitle: string;
    page: string;
    of: string;
    organizationsCount: string;
    organizationName: string;
    userSearch: string;
    courseSearch: string;
    search: string;
    clearFilters: string;
    selectorLimit: string;
    createEyebrow: string;
    newOrganization: string;
    seatLimit: string;
    createOrganization: string;
    noOrganizations: string;
    archived: string;
    summaryAria: string;
    persistedSeats: string;
    activeMemberships: string;
    activeTeams: string;
    assignedCourses: string;
    sponsoredCompletion: string;
    completed: string;
    memberships: string;
    user: string;
    selectUser: string;
    role: string;
    addOrReactivate: string;
    changeRole: string;
    deactivate: string;
    seats: string;
    activeMember: string;
    selectMember: string;
    allocateSeat: string;
    nextSeatStatus: string;
    moveTo: string;
    updateSeat: string;
    teams: string;
    teamName: string;
    createTeam: string;
    members: string;
    addMember: string;
    add: string;
    remove: string;
    archiveTeam: string;
    assignedLearning: string;
    publishedCourse: string;
    selectCourse: string;
    assignCourse: string;
    unassignCourse: string;
    mutationsDisabled: string;
    previousOrganizations: string;
    nextOrganizations: string;
    loading: string;
    errorTitle: string;
    errorBody: string;
    retry: string;
    notFoundTitle: string;
    notFoundBody: string;
    returnOrganizations: string;
  };
'''
          type_anchor = '  certificates: {\n'
          if type_block not in text:
              if type_anchor not in text:
                  raise SystemExit('AdminCopy certificates type anchor not found')
              text = text.replace(type_anchor, type_block + type_anchor, 1)

          copies = [
          '''    organizations: {
      metadataTitle: 'Organizations | Luminol Administration',
      milestoneEyebrow: 'Milestone 16',
      title: 'Organizations & team learning',
      intro: 'Academy-only administration for organization memberships, teams, seats, assigned learning and privacy-safe aggregate completion.',
      back: 'Back to administration',
