name: Temporary AI Provider Schema Patch
on:
  push:
    branches: [feat/ai-provider-gateway]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ai-provider-schema-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-provider-gateway
      - name: Add AI provider usage schema and migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema = Path('packages/database/prisma/schema.prisma')
          text = schema.read_text()
          enum_anchor = '''enum SocialPublishingAttemptEventType {\n  PLANNED\n  STARTED\n  SUCCEEDED\n  PROVIDER_FAILED\n  INVALIDATED\n}\n'''
          enum_addition = enum_anchor + '''\nenum AiProviderMode {\n  OFF\n  OPENAI\n}\n\nenum AiProviderTaskClass {\n  SUMMARIZE_OPERATIONAL_STATE\n  DRAFT_OPERATOR_RECOMMENDATIONS\n  ANALYZE_CAMPAIGN_METRICS\n}\n\nenum AiProviderUsageOutcome {\n  SUCCEEDED\n  FAILED\n  BLOCKED\n}\n'''
          if text.count(enum_anchor) != 1:
              raise SystemExit('Expected one AI provider enum insertion anchor')
          text = text.replace(enum_anchor, enum_addition)

          model_anchor = '''model ContentCalendarItem {\n'''
          model = '''model AiProviderUsage {\n  id                     String                 @id @default(cuid())\n  providerMode           AiProviderMode\n  taskClass              AiProviderTaskClass\n  outcome                AiProviderUsageOutcome\n  model                  String?\n  inputTokens            Int?\n  outputTokens           Int?\n  estimatedCostUsdMicros Int                    @default(0)\n  latencyMs              Int?\n  errorCode              String?\n  occurredAt             DateTime               @default(now())\n\n  @@index([occurredAt])\n  @@index([providerMode, taskClass, occurredAt])\n  @@index([outcome, occurredAt])\n}\n\n'''
          if text.count(model_anchor) != 1:
              raise SystemExit('Expected one AI provider model insertion anchor')
          text = text.replace(model_anchor, model + model_anchor)
          schema.write_text(text)

          migration = Path('packages/database/prisma/migrations/20260901181000_ai_provider_usage_gateway')
          migration.mkdir(parents=True, exist_ok=False)
          (migration / 'migration.sql').write_text('''-- CreateEnum\nCREATE TYPE "AiProviderMode" AS ENUM ('OFF', 'OPENAI');\n\n-- CreateEnum\nCREATE TYPE "AiProviderTaskClass" AS ENUM ('SUMMARIZE_OPERATIONAL_STATE', 'DRAFT_OPERATOR_RECOMMENDATIONS', 'ANALYZE_CAMPAIGN_METRICS');\n\n-- CreateEnum\nCREATE TYPE "AiProviderUsageOutcome" AS ENUM ('SUCCEEDED', 'FAILED', 'BLOCKED');\n\n-- CreateTable\nCREATE TABLE "AiProviderUsage" (\n    "id" TEXT NOT NULL,\n    "providerMode" "AiProviderMode" NOT NULL,\n    "taskClass" "AiProviderTaskClass" NOT NULL,\n    "outcome" "AiProviderUsageOutcome" NOT NULL,\n    "model" TEXT,\n    "inputTokens" INTEGER,\n    "outputTokens" INTEGER,\n    "estimatedCostUsdMicros" INTEGER NOT NULL DEFAULT 0,\n    "latencyMs" INTEGER,\n    "errorCode" TEXT,\n    "occurredAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\n    CONSTRAINT "AiProviderUsage_pkey" PRIMARY KEY ("id")\n);\n\n-- CreateIndex\nCREATE INDEX "AiProviderUsage_occurredAt_idx" ON "AiProviderUsage"("occurredAt");\n\n-- CreateIndex\nCREATE INDEX "AiProviderUsage_providerMode_taskClass_occurredAt_idx" ON "AiProviderUsage"("providerMode", "taskClass", "occurredAt");\n\n-- CreateIndex\nCREATE INDEX "AiProviderUsage_outcome_occurredAt_idx" ON "AiProviderUsage"("outcome", "occurredAt");\n''')
          PY
          git diff --check
      - name: Commit schema patch
        run: |
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma packages/database/prisma/migrations/20260901181000_ai_provider_usage_gateway/migration.sql
          git commit -m "Add AI provider usage persistence [ai-provider-schema-patch]"
          git push origin HEAD:feat/ai-provider-gateway
