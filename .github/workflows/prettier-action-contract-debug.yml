name: Prettier Action Contract Debug
on:
  pull_request:
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show canonical Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/admin/components/ai-operations-brief-panel.tsx \
            apps/admin/lib/ai-operator-actions.test.ts \
            apps/admin/lib/ai-operator-actions.ts \
            packages/validation/src/ai-operator.ts
          git diff -- \
            apps/admin/components/ai-operations-brief-panel.tsx \
            apps/admin/lib/ai-operator-actions.test.ts \
            apps/admin/lib/ai-operator-actions.ts \
            packages/validation/src/ai-operator.ts
