name: Format social dispatch

on:
  push:
    branches: [feat/secure-social-dispatch-endpoint]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier configuration
        run: |
          pnpm exec prettier --write \
            apps/admin/lib/social-publishing-scheduler.ts \
            apps/admin/lib/social-publishing-scheduler.test.ts \
            packages/database/src/social-publishing-dispatch.ts
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/lib/social-publishing-scheduler.ts \
            apps/admin/lib/social-publishing-scheduler.test.ts \
            packages/database/src/social-publishing-dispatch.ts
          git commit -m "Format secure social dispatch endpoint"
          git push origin HEAD:feat/secure-social-dispatch-endpoint
