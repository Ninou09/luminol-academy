name: Apply recent enquiry status mix

on:
  push:
    branches:
      - feat/recent-enquiry-status-mix

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/recent-enquiry-status-mix
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate recent enquiry status mix into dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          ops = Path('apps/admin/lib/operations.server.ts')
          text = ops.read_text()
          text = text.replace(
              "import {\n  normalizeActiveEnquiryStatusMix,\n  type ActiveEnquiryStatusMixSummary,\n} from './enquiry-status-mix-reporting';\n",
              "import {\n  normalizeActiveEnquiryStatusMix,\n  type ActiveEnquiryStatusMixSummary,\n} from './enquiry-status-mix-reporting';\nimport {\n  normalizeRecentEnquiryStatusMix,\n  type RecentEnquiryStatusMixSummary,\n} from './enquiry-recent-status-mix-reporting';\n",
          )
          text = text.replace(
              "  enquiryLandingPathMixLast30Days: EnquiryLandingPathMixSummary;\n",
              "  enquiryLandingPathMixLast30Days: EnquiryLandingPathMixSummary;\n  enquiryRecentStatusMixLast30Days: RecentEnquiryStatusMixSummary;\n",
          )
          text = text.replace(
              "    timingPreferenceGroupsLast30Days,\n    activeEnquiryStatusGroups,\n",
              "    timingPreferenceGroupsLast30Days,\n    recentEnquiryStatusGroupsLast30Days,\n    activeEnquiryStatusGroups,\n",
          )
          text = text.replace(
              "    db.enquiry.groupBy({\n      by: ['timingPreference'],\n      where: getRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.groupBy({\n      by: ['status'],\n      where: ACTIVE_ENQUIRY_WHERE,\n",
              "    db.enquiry.groupBy({\n      by: ['timingPreference'],\n      where: getRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.groupBy({\n      by: ['status'],\n      where: getRecentEnquiryWhere(now),\n      _count: { _all: true },\n    }),\n    db.enquiry.groupBy({\n      by: ['status'],\n      where: ACTIVE_ENQUIRY_WHERE,\n",
          )
          marker = """    enquiryTimingPreferenceMixLast30Days: normalizeEnquiryTimingPreferenceMix(\n      timingPreferenceGroupsLast30Days,\n      enquiriesLast30Days,\n    ),\n"""
          addition = marker + """    enquiryRecentStatusMixLast30Days: normalizeRecentEnquiryStatusMix(\n      recentEnquiryStatusGroupsLast30Days,\n    ),\n"""
          if marker not in text:
              raise SystemExit('timing preference return marker not found')
          text = text.replace(marker, addition, 1)
          ops.write_text(text)

          page = Path('apps/admin/app/page.tsx')
          text = page.read_text()
          text = text.replace(
              "import { getEnquiryProgrammeMixCopy } from '../lib/enquiry-programme-mix-localization';\n",
              "import { getEnquiryProgrammeMixCopy } from '../lib/enquiry-programme-mix-localization';\nimport { getRecentEnquiryStatusMixCopy } from '../lib/enquiry-recent-status-mix-localization';\n",
          )
          text = text.replace(
              "  const programmeMixCopy = getEnquiryProgrammeMixCopy(locale);\n",
              "  const programmeMixCopy = getEnquiryProgrammeMixCopy(locale);\n  const recentStatusMixCopy = getRecentEnquiryStatusMixCopy(locale);\n",
          )
          marker = """          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{workflowCopy.eyebrow}</p>\n"""
          panel = """          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{recentStatusMixCopy.eyebrow}</p>\n                <h2>{recentStatusMixCopy.title}</h2>\n                <p>{recentStatusMixCopy.intro}</p>\n              </div>\n              <span>{copy.dashboard.rollingThirtyDays}</span>\n            </div>\n            {operations.enquiryRecentStatusMixLast30Days.items.length > 0 ? (\n              <div className=\"metric-grid\" aria-label={recentStatusMixCopy.title}>\n                {operations.enquiryRecentStatusMixLast30Days.items.map((item) => (\n                  <article key={item.status}>\n                    <span>{getAdminEnumLabel(locale, item.status)}</span>\n                    <strong>{number(item.count)}</strong>\n                    <small>{recentStatusMixCopy.count(number(item.count))}</small>\n                  </article>\n                ))}\n              </div>\n            ) : (\n              <p className=\"admin-empty\">{recentStatusMixCopy.noData}</p>\n            )}\n          </section>\n\n"""
          if marker not in text:
              raise SystemExit('workflow panel marker not found')
          text = text.replace(marker, panel + marker, 1)
          page.write_text(text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-recent-status-mix-reporting.ts \
            apps/admin/lib/enquiry-recent-status-mix-reporting.test.ts \
            apps/admin/lib/enquiry-recent-status-mix-localization.ts \
            apps/admin/lib/enquiry-recent-status-mix-localization.test.ts
      - run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-recent-status-mix-reporting.ts \
            apps/admin/lib/enquiry-recent-status-mix-reporting.test.ts \
            apps/admin/lib/enquiry-recent-status-mix-localization.ts \
            apps/admin/lib/enquiry-recent-status-mix-localization.test.ts
          git commit -m "Integrate recent enquiry status reporting"
          git push origin HEAD:feat/recent-enquiry-status-mix
