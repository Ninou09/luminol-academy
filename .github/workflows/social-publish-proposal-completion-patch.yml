name: Temporary Social Publish Proposal Completion Patch
on:
  push:
    branches: [feat/ai-operator-social-publish-attempts]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[social-attempt-proposal-completion]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-operator-social-publish-attempts
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch proposal completion and coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('packages/database/src/social-publishing-attempts.ts')
          text = source.read_text()
          old = '''import {\n  SocialPublishingAttemptEventType,\n  SocialPublishingAttemptStatus,\n  type Prisma,\n'''
          new = '''import {\n  AiOperatorProposalEventType,\n  AiOperatorProposalStatus,\n  SocialPublishingAttemptEventType,\n  SocialPublishingAttemptStatus,\n  type Prisma,\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected one Prisma enum import block')
          text = text.replace(old, new)

          marker = '''        await transaction.socialPublishingAttemptEvent.create({\n          data: {\n            attemptId: claimed.id,\n            eventType: SocialPublishingAttemptEventType.SUCCEEDED,\n            actorUserId,\n            fromStatus: SocialPublishingAttemptStatus.IN_PROGRESS,\n            toStatus: SocialPublishingAttemptStatus.SUCCEEDED,\n            attemptNumber,\n            providerReference,\n            occurredAt: now,\n          },\n        });\n\n        return transaction.socialPublishingAttempt.findUniqueOrThrow({\n'''
          replacement = '''        await transaction.socialPublishingAttemptEvent.create({\n          data: {\n            attemptId: claimed.id,\n            eventType: SocialPublishingAttemptEventType.SUCCEEDED,\n            actorUserId,\n            fromStatus: SocialPublishingAttemptStatus.IN_PROGRESS,\n            toStatus: SocialPublishingAttemptStatus.SUCCEEDED,\n            attemptNumber,\n            providerReference,\n            occurredAt: now,\n          },\n        });\n\n        const completedProposal = await transaction.aiOperatorProposal.updateMany({\n          where: {\n            id: claimed.proposalId,\n            status: AiOperatorProposalStatus.APPROVED,\n            executedAt: null,\n          },\n          data: {\n            status: AiOperatorProposalStatus.EXECUTED,\n            executedByUserId: actorUserId,\n            executedAt: now,\n          },\n        });\n        if (completedProposal.count !== 1) {\n          throw new Error('AI Operator social publish proposal completion failed');\n        }\n\n        await transaction.aiOperatorProposalEvent.create({\n          data: {\n            proposalId: claimed.proposalId,\n            eventType: AiOperatorProposalEventType.EXECUTED,\n            actorUserId,\n            fromStatus: AiOperatorProposalStatus.APPROVED,\n            toStatus: AiOperatorProposalStatus.EXECUTED,\n            occurredAt: now,\n          },\n        });\n\n        return transaction.socialPublishingAttempt.findUniqueOrThrow({\n'''
          if text.count(marker) != 1:
              raise SystemExit('Expected one successful attempt event block')
          source.write_text(text.replace(marker, replacement))

          test_path = Path('packages/database/src/social-publishing-attempts.integration.test.ts')
          tests = test_path.read_text()
          marker = '''    expect(stored.events.map((event) => event.eventType)).toEqual([\n      'PLANNED',\n      'STARTED',\n      'SUCCEEDED',\n    ]);\n\n    await expect(\n'''
          replacement = '''    expect(stored.events.map((event) => event.eventType)).toEqual([\n      'PLANNED',\n      'STARTED',\n      'SUCCEEDED',\n    ]);\n\n    const executedProposal = await db.aiOperatorProposal.findUniqueOrThrow({\n      where: { id: proposal.id },\n      include: { events: { orderBy: { occurredAt: 'asc' } } },\n    });\n    expect(executedProposal).toMatchObject({\n      status: AiOperatorProposalStatus.EXECUTED,\n      executedByUserId: userId,\n      executedAt: executionNow,\n    });\n    expect(executedProposal.events.at(-1)).toMatchObject({\n      eventType: 'EXECUTED',\n      actorUserId: userId,\n      fromStatus: AiOperatorProposalStatus.APPROVED,\n      toStatus: AiOperatorProposalStatus.EXECUTED,\n    });\n\n    await expect(\n'''
          if tests.count(marker) != 1:
              raise SystemExit('Expected one successful attempt assertion block')
          test_path.write_text(tests.replace(marker, replacement))
          PY
          pnpm exec prettier --write packages/database/src/social-publishing-attempts.ts packages/database/src/social-publishing-attempts.integration.test.ts
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/src/social-publishing-attempts.ts packages/database/src/social-publishing-attempts.integration.test.ts
          git commit -m "Complete AI Operator proposal after social publish success [social-attempt-proposal-completion]"
          git push origin HEAD:feat/ai-operator-social-publish-attempts
