name: Milestone 16 admin schema patch

on:
  push:
    branches:
      - feature/milestone-16-organization-admin
    paths:
      - .github/workflows/m16-admin-schema-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-admin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Prisma schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()

          replacements = {
            '  organizationSeats        OrganizationSeat[]\n': '  organizationSeats        OrganizationSeat[]\n  organizationAuditEvents  OrganizationAuditEvent[] @relation("OrganizationAuditActor")\n',
            '  courses      OrganizationCourse[]\n\n  @@index([status, name])': '  courses      OrganizationCourse[]\n  auditEvents  OrganizationAuditEvent[]\n\n  @@index([status, name])',
            'model Role {': '''model OrganizationAuditEvent {\n  id             String       @id @default(cuid())\n  organizationId String\n  actorUserId    String\n  action         String\n  subjectType    String\n  subjectId      String\n  createdAt      DateTime     @default(now())\n  organization   Organization @relation(fields: [organizationId], references: [id], onDelete: Restrict)\n  actor          User         @relation("OrganizationAuditActor", fields: [actorUserId], references: [id], onDelete: Restrict)\n\n  @@index([organizationId, createdAt])\n  @@index([actorUserId, createdAt])\n  @@index([subjectType, subjectId, createdAt])\n}\n\nmodel Role {''',
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one schema anchor for {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          pnpm --filter @luminol/database exec prisma format --schema prisma/schema.prisma
      - name: Commit schema patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/database/prisma/schema.prisma
          git diff --cached --check
          git commit -m "Add organization administration audit schema"
          git push origin HEAD:feature/milestone-16-organization-admin
