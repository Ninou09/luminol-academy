name: Milestone 16 admin schema patch

on:
  push:
    branches:
      - feature/milestone-16-organization-admin
    paths:
      - .github/workflows/m16-admin-schema-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-admin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Prisma schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()

          def replace_once(pattern: str, replacement: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'Expected one schema anchor for {pattern!r}, found {count}')

          replace_once(
              r'^(\s*organizationSeats\s+OrganizationSeat\[\]\s*)$',
              r'\1\n  organizationAuditEvents  OrganizationAuditEvent[] @relation("OrganizationAuditActor")',
          )
          replace_once(
              r'^(\s*courses\s+OrganizationCourse\[\]\s*)$',
              r'\1\n  auditEvents  OrganizationAuditEvent[]',
          )
          replace_once(
              r'^model Role \{',
              '''model OrganizationAuditEvent {
  id             String       @id @default(cuid())
  organizationId String
  actorUserId    String
  action         String
  subjectType    String
  subjectId      String
  createdAt      DateTime     @default(now())
  organization   Organization @relation(fields: [organizationId], references: [id], onDelete: Restrict)
  actor          User         @relation("OrganizationAuditActor", fields: [actorUserId], references: [id], onDelete: Restrict)

  @@index([organizationId, createdAt])
  @@index([actorUserId, createdAt])
  @@index([subjectType, subjectId, createdAt])
}

model Role {''',
          )

          path.write_text(text)
          PY
          pnpm --filter @luminol/database exec prisma format --schema prisma/schema.prisma
      - name: Commit schema patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/database/prisma/schema.prisma
          git diff --cached --check
          git commit -m "Add organization administration audit schema"
          git push origin HEAD:feature/milestone-16-organization-admin
