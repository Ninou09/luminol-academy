name: Milestone 16 seat allocation fix

on:
  push:
    branches:
      - feature/milestone-16-organization-admin
    paths:
      - .github/workflows/m16-seat-allocation-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-admin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply seat allocation review fix
        run: |
          python - <<'PY'
          from pathlib import Path

          actions = Path('apps/admin/app/organizations/actions.ts')
          text = actions.read_text()
          old = '''    const [organization, membership] = await Promise.all([\n      transaction.organization.findFirst({\n        where: { id: input.organizationId, status: 'ACTIVE' },\n        select: { id: true },\n      }),\n      transaction.organizationMembership.findFirst({\n        where: {\n          organizationId: input.organizationId,\n          userId: input.userId,\n          active: true,\n        },\n        select: { id: true },\n      }),\n    ]);\n\n    if (!organization || !membership) {\n      throw new Error('Active organization membership required for seat allocation');\n    }\n'''
          new = '''    const [organization, membership, existingSeat] = await Promise.all([\n      transaction.organization.findFirst({\n        where: { id: input.organizationId, status: 'ACTIVE' },\n        select: { id: true },\n      }),\n      transaction.organizationMembership.findFirst({\n        where: {\n          organizationId: input.organizationId,\n          userId: input.userId,\n          active: true,\n        },\n        select: { id: true },\n      }),\n      transaction.organizationSeat.findUnique({\n        where: {\n          organizationId_userId: {\n            organizationId: input.organizationId,\n            userId: input.userId,\n          },\n        },\n        select: { id: true },\n      }),\n    ]);\n\n    if (!organization || !membership) {\n      throw new Error('Active organization membership required for seat allocation');\n    }\n    if (existingSeat) {\n      throw new Error('Organization member already has a seat record');\n    }\n'''
          if old not in text:
              raise SystemExit('Seat allocation action anchor not found')
          actions.write_text(text.replace(old, new, 1))

          page = Path('apps/admin/app/organizations/page.tsx')
          page_text = page.read_text()
          old_page = '{organization.memberships.map((membership) => ('
          new_page = '{organization.availableSeatMemberships.map((membership) => ('
          if page_text.count(old_page) < 1:
              raise SystemExit('Seat membership selector anchor not found')
          seat_section = page_text.index('<h3>Seats</h3>')
          position = page_text.find(old_page, seat_section)
          if position < 0:
              raise SystemExit('Seat selector map not found after Seats heading')
          page_text = page_text[:position] + new_page + page_text[position + len(old_page):]
          page.write_text(page_text)
          PY
          pnpm exec prettier --write apps/admin/app/organizations/actions.ts apps/admin/app/organizations/page.tsx apps/admin/lib/organization-admin.server.ts
      - name: Commit review fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/admin/app/organizations/actions.ts apps/admin/app/organizations/page.tsx apps/admin/lib/organization-admin.server.ts
          git diff --cached --check
          git commit -m "Address seat and archived-team review findings"
          git push origin HEAD:feature/milestone-16-organization-admin
