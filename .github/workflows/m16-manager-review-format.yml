name: Milestone 16 manager review format

on:
  push:
    branches:
      - feature/milestone-16-organization-manager
    paths:
      - .github/workflows/m16-manager-review-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-manager
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/portal/lib/organization-manager.server.ts
      - run: pnpm db:generate
      - run: pnpm --filter @luminol/portal lint
      - run: pnpm --filter @luminol/portal typecheck
      - run: pnpm --filter @luminol/portal test
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          rm .github/workflows/m16-manager-review-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Format manager privacy hardening"
          git push origin HEAD:feature/milestone-16-organization-manager
