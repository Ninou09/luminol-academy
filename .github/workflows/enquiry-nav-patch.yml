name: Enquiry navigation patch

on:
  push:
    branches:
      - feat/enquiry-follow-up-desk

permissions:
  contents: write

jobs:
  patch-dashboard-navigation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-follow-up-desk
      - name: Link enquiry desk from dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/admin/app/page.tsx')
          text = path.read_text()
          old = '''          <a href="#enquiries">
            <span>02</span> {copy.shell.enquiries}
          </a>'''
          new = '''          <Link href={localizeHref(locale, '/enquiries')}>
            <span>02</span> {copy.shell.enquiries}
          </Link>'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit navigation patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/page.tsx
          git commit -m "feat: link enquiry desk from dashboard"
          git push origin HEAD:feat/enquiry-follow-up-desk
