name: Apply campaign content mix

on:
  push:
    branches:
      - feat/campaign-content-mix

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/campaign-content-mix
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate campaign content mix into dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          ops = Path('apps/admin/lib/operations.server.ts')
          text = ops.read_text()

          import_marker = "import {\n  normalizeEnquiryCampaignMediumMix,\n  type EnquiryCampaignMediumMixSummary,\n} from './enquiry-campaign-medium-reporting';\n"
          import_addition = import_marker + "import {\n  normalizeEnquiryCampaignContentMix,\n  type EnquiryCampaignContentMixSummary,\n} from './enquiry-campaign-content-reporting';\n"
          if import_marker not in text:
              raise SystemExit('campaign medium import marker not found')
          text = text.replace(import_marker, import_addition, 1)

          type_marker = "  enquiryCampaignMediumMixLast30Days: EnquiryCampaignMediumMixSummary;\n"
          type_addition = type_marker + "  enquiryCampaignContentMixLast30Days: EnquiryCampaignContentMixSummary;\n"
          if type_marker not in text:
              raise SystemExit('campaign medium dashboard type marker not found')
          text = text.replace(type_marker, type_addition, 1)

          destructure_marker = "    campaignMediumRecordedLast30Days,\n    campaignMediumGroupsLast30Days,\n    landingPathRecordedLast30Days,\n"
          destructure_addition = "    campaignMediumRecordedLast30Days,\n    campaignMediumGroupsLast30Days,\n    campaignContentRecordedLast30Days,\n    campaignContentGroupsLast30Days,\n    landingPathRecordedLast30Days,\n"
          if destructure_marker not in text:
              raise SystemExit('campaign medium promise destructure marker not found')
          text = text.replace(destructure_marker, destructure_addition, 1)

          query_marker = "    db.enquiry.groupBy({\n      by: ['utmMedium'],\n      where: {\n        ...getRecentEnquiryWhere(now),\n        utmMedium: { not: null },\n      },\n      _count: { _all: true },\n    }),\n    db.enquiry.count({\n      where: {\n        ...getRecentEnquiryWhere(now),\n        landingPath: { not: null },\n      },\n    }),\n"
          query_addition = "    db.enquiry.groupBy({\n      by: ['utmMedium'],\n      where: {\n        ...getRecentEnquiryWhere(now),\n        utmMedium: { not: null },\n      },\n      _count: { _all: true },\n    }),\n    db.enquiry.count({\n      where: {\n        ...getRecentEnquiryWhere(now),\n        utmContent: { not: null },\n      },\n    }),\n    db.enquiry.groupBy({\n      by: ['utmContent'],\n      where: {\n        ...getRecentEnquiryWhere(now),\n        utmContent: { not: null },\n      },\n      _count: { _all: true },\n    }),\n    db.enquiry.count({\n      where: {\n        ...getRecentEnquiryWhere(now),\n        landingPath: { not: null },\n      },\n    }),\n"
          if query_marker not in text:
              raise SystemExit('campaign medium query marker not found')
          text = text.replace(query_marker, query_addition, 1)

          return_marker = "    enquiryCampaignMediumMixLast30Days: normalizeEnquiryCampaignMediumMix(\n      campaignMediumGroupsLast30Days,\n      enquiriesLast30Days,\n      campaignMediumRecordedLast30Days,\n    ),\n"
          return_addition = return_marker + "    enquiryCampaignContentMixLast30Days: normalizeEnquiryCampaignContentMix(\n      campaignContentGroupsLast30Days,\n      enquiriesLast30Days,\n      campaignContentRecordedLast30Days,\n    ),\n"
          if return_marker not in text:
              raise SystemExit('campaign medium return marker not found')
          text = text.replace(return_marker, return_addition, 1)
          ops.write_text(text)

          page = Path('apps/admin/app/page.tsx')
          text = page.read_text()

          page_import_marker = "import { getEnquiryCampaignMediumCopy } from '../lib/enquiry-campaign-medium-localization';\n"
          page_import_addition = page_import_marker + "import { getEnquiryCampaignContentCopy } from '../lib/enquiry-campaign-content-localization';\n"
          if page_import_marker not in text:
              raise SystemExit('campaign medium page import marker not found')
          text = text.replace(page_import_marker, page_import_addition, 1)

          copy_marker = "  const campaignMediumCopy = getEnquiryCampaignMediumCopy(locale);\n"
          copy_addition = copy_marker + "  const campaignContentCopy = getEnquiryCampaignContentCopy(locale);\n"
          if copy_marker not in text:
              raise SystemExit('campaign medium copy initializer marker not found')
          text = text.replace(copy_marker, copy_addition, 1)

          panel_marker = "          <section className=\"admin-panel\">\n            <div className=\"panel-heading\">\n              <div>\n                <p className=\"eyebrow\">{landingPathCopy.eyebrow}</p>\n"
          panel = "\n".join([
            "          <section className=\"admin-panel\">",
            "            <div className=\"panel-heading\">",
            "              <div>",
            "                <p className=\"eyebrow\">{campaignContentCopy.eyebrow}</p>",
            "                <h2>{campaignContentCopy.title}</h2>",
            "                <p>{campaignContentCopy.intro}</p>",
            "              </div>",
            "              <span>{copy.dashboard.rollingThirtyDays}</span>",
            "            </div>",
            "            <div className=\"metric-grid\" aria-label={campaignContentCopy.title}>",
            "              <article>",
            "                <span>{campaignContentCopy.recorded}</span>",
            "                <strong>{number(operations.enquiryCampaignContentMixLast30Days.recorded)}</strong>",
            "                <small>{campaignContentCopy.count(number(operations.enquiryCampaignContentMixLast30Days.recorded))}</small>",
            "              </article>",
            "              <article>",
            "                <span>{campaignContentCopy.missing}</span>",
            "                <strong>{number(operations.enquiryCampaignContentMixLast30Days.missing)}</strong>",
            "                <small>{campaignContentCopy.count(number(operations.enquiryCampaignContentMixLast30Days.missing))}</small>",
            "              </article>",
            "            </div>",
            "            <div className=\"panel-heading\">",
            "              <div>",
            "                <h3>{campaignContentCopy.topContent}</h3>",
            "              </div>",
            "            </div>",
            "            {operations.enquiryCampaignContentMixLast30Days.items.length > 0 ? (",
            "              <div className=\"metric-grid\" aria-label={campaignContentCopy.topContent}>",
            "                {operations.enquiryCampaignContentMixLast30Days.items.map((item) => (",
            "                  <article key={item.utmContent}>",
            "                    <span dir=\"auto\">{item.utmContent}</span>",
            "                    <strong>{number(item.count)}</strong>",
            "                    <small>{campaignContentCopy.count(number(item.count))}</small>",
            "                  </article>",
            "                ))}",
            "              </div>",
            "            ) : (",
            "              <p className=\"admin-empty\">{campaignContentCopy.noContent}</p>",
            "            )}",
            "          </section>",
            "",
          ]) + "\n"
          if panel_marker not in text:
              raise SystemExit('landing path panel marker not found')
          text = text.replace(panel_marker, panel + panel_marker, 1)
          page.write_text(text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-campaign-content-reporting.ts \
            apps/admin/lib/enquiry-campaign-content-reporting.test.ts \
            apps/admin/lib/enquiry-campaign-content-localization.ts \
            apps/admin/lib/enquiry-campaign-content-localization.test.ts
      - name: Run git diff --check
        run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/page.tsx \
            apps/admin/lib/operations.server.ts \
            apps/admin/lib/enquiry-campaign-content-reporting.ts \
            apps/admin/lib/enquiry-campaign-content-reporting.test.ts \
            apps/admin/lib/enquiry-campaign-content-localization.ts \
            apps/admin/lib/enquiry-campaign-content-localization.test.ts
          git commit -m "Integrate campaign content enquiry reporting"
          git push origin HEAD:feat/campaign-content-mix
