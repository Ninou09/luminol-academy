name: Format enquiry outcome coverage

on:
  push:
    branches:
      - feat/enquiry-outcome-recording-coverage

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-outcome-recording-coverage
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: |
          pnpm exec prettier --write \
            apps/admin/lib/enquiry-outcome-coverage-localization.test.ts \
            apps/admin/lib/enquiry-outcome-coverage-localization.ts \
            apps/admin/lib/enquiry-pipeline-reporting.ts
      - run: git diff --check
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/lib/enquiry-outcome-coverage-localization.test.ts \
            apps/admin/lib/enquiry-outcome-coverage-localization.ts \
            apps/admin/lib/enquiry-pipeline-reporting.ts
          git commit -m "Format enquiry outcome coverage"
          git push origin HEAD:feat/enquiry-outcome-recording-coverage
