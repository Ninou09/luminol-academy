name: Format flagship once

on:
  push:
    branches:
      - design/premium-motion-homepage
    paths:
      - .github/workflows/format-flagship-once.yml

permissions:
  contents: write

concurrency:
  group: format-flagship-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/premium-motion-homepage
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: |
          pnpm exec prettier --write \
            apps/web/app/page.tsx \
            apps/web/app/about/page.tsx \
            apps/web/app/contact/page.tsx \
            'apps/web/app/schools/[school]/page.tsx'

      - name: Remove one-time workflow
        run: rm .github/workflows/format-flagship-once.yml

      - name: Commit formatted flagship
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/page.tsx \
            apps/web/app/about/page.tsx \
            apps/web/app/contact/page.tsx \
            'apps/web/app/schools/[school]/page.tsx' \
            .github/workflows/format-flagship-once.yml
          git commit -m 'Format the public flagship implementation'
          git push origin HEAD:design/premium-motion-homepage
