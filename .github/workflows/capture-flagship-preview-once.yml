name: Capture flagship preview once

on:
  push:
    branches:
      - design/premium-motion-homepage
    paths:
      - .github/workflows/capture-flagship-preview-once.yml

permissions:
  contents: read

concurrency:
  group: capture-flagship-preview-once
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luminol
          POSTGRES_PASSWORD: luminol
          POSTGRES_DB: luminol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luminol -d luminol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/premium-motion-homepage
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build exact public website
        run: pnpm --filter @luminol/web build
        env:
          DATABASE_URL: postgresql://luminol:luminol@127.0.0.1:5432/luminol

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Start exact public website
        run: |
          pnpm --dir apps/web exec next start --hostname 127.0.0.1 --port 3000 > /tmp/luminol-web.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/luminol-web.log
          exit 1
        env:
          DATABASE_URL: postgresql://luminol:luminol@127.0.0.1:5432/luminol

      - name: Capture desktop and mobile pages
        run: node scripts/capture-flagship.mjs
        env:
          FLAGSHIP_BASE_URL: http://127.0.0.1:3000

      - name: Upload flagship screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flagship-screenshots-exact-head
          path: artifacts/flagship-screenshots
          if-no-files-found: error
          retention-days: 1
