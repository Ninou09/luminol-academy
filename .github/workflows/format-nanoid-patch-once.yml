name: Format nanoid patch once

on:
  push:
    branches:
      - design/premium-motion-homepage

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/premium-motion-homepage
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Format patched dependency files
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write package.json pnpm-lock.yaml
          rm .github/workflows/format-nanoid-patch-once.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/format-nanoid-patch-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format nanoid security patch"
          git push origin HEAD:design/premium-motion-homepage
