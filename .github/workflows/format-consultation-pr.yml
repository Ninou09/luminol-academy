name: Format consultation PR

on:
  push:
    branches:
      - feat/consultation-founder-authority

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm exec prettier --write apps/web/app/consultations/page.tsx tests/e2e/consultations.spec.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/consultations/page.tsx tests/e2e/consultations.spec.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "Format consultation founder authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
