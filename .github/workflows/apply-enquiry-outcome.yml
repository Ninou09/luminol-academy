name: Apply enquiry outcome patch

on:
  push:
    branches: [feat/enquiry-outcome]

permissions:
  contents: write

concurrency:
  group: apply-enquiry-outcome
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/enquiry-outcome
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply outcome schema and admin patches
        run: python scripts/apply-enquiry-outcome-patch.py
      - name: Format Prisma schema
        run: pnpm --filter @luminol/database exec prisma format
      - name: Validate Prisma schema
        run: pnpm --filter @luminol/database exec prisma validate
      - name: Format changed TypeScript
        run: |
          pnpm exec prettier --write \
            apps/admin/app/enquiries/actions.ts \
            apps/admin/app/enquiries/page.tsx \
            apps/admin/lib/enquiry-desk-localization.ts \
            apps/admin/lib/enquiry-desk-localization.test.ts \
            packages/database/src/enquiry-outcome.integration.test.ts
      - name: Remove temporary patch tooling
        run: |
          rm .github/workflows/apply-enquiry-outcome.yml
          rm scripts/apply-enquiry-outcome-patch.py
      - name: Commit outcome slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add audited enquiry outcomes"
          git push origin HEAD:feat/enquiry-outcome
