name: Production health check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEB_URL: https://luminol-academy-web.vercel.app
      PORTAL_URL: https://luminol-academy-portal.vercel.app
      ADMIN_URL: https://luminol-academy-admin.vercel.app
    steps:
      - name: Check public website and security headers
        shell: bash
        run: |
          set -euo pipefail
          response_meta="$(curl --fail --silent --show-error --location --max-time 20 \
            --output "$RUNNER_TEMP/web-body.html" \
            --write-out '%{http_code}\n%header{x-content-type-options}\n%header{x-frame-options}\n%header{content-security-policy}\n' \
            "$WEB_URL/")"
          mapfile -t response_lines <<< "$response_meta"

          test "${response_lines[0]:-}" = '200'
          grep --fixed-strings 'Grow with clarity.' "$RUNNER_TEMP/web-body.html"
          grep --ignore-case --line-regexp 'nosniff' \
            <<< "${response_lines[1]:-}"
          grep --ignore-case --line-regexp 'DENY' \
            <<< "${response_lines[2]:-}"
          grep --fixed-strings "frame-ancestors 'none'" \
            <<< "${response_lines[3]:-}"

      - name: Check public discovery files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$WEB_URL/robots.txt" \
            | grep --fixed-strings 'Sitemap:'
          curl --fail --silent --show-error --location --max-time 20 "$WEB_URL/sitemap.xml" \
            | grep --fixed-strings '<urlset'

      - name: Check certificate privacy failure behavior
        shell: bash
        run: |
          set -euo pipefail
          response_meta="$(curl --silent --show-error --location --max-time 20 \
            --output "$RUNNER_TEMP/certificate-response.html" \
            --write-out '%{http_code}\n%header{cache-control}\n' \
            "$WEB_URL/certificates/short")"
          mapfile -t response_lines <<< "$response_meta"

          test "${response_lines[0]:-}" = '404'
          grep --fixed-strings 'data-not-found' \
            "$RUNNER_TEMP/certificate-response.html"
          grep --ignore-case --fixed-strings 'no-store' \
            <<< "${response_lines[1]:-}"

      - name: Check learner and administration sign-in availability
        shell: bash
        run: |
          set -euo pipefail
          check_sign_in() {
            local name="$1"
            local url="$2"
            local title="$3"
            local body_file="$RUNNER_TEMP/${name// /-}-sign-in.html"
            local response_meta
            local -a response_lines=()
            local status
            local location
            local cache_control
            local content_type_options
            local frame_options
            local csp

            response_meta="$(curl --silent --show-error --max-time 20 \
              --output "$body_file" \
              --write-out '%{http_code}\n%header{location}\n%header{cache-control}\n%header{x-content-type-options}\n%header{x-frame-options}\n%header{content-security-policy}\n' \
              "$url/sign-in")"
            mapfile -t response_lines <<< "$response_meta"

            status="${response_lines[0]:-}"
            location="${response_lines[1]:-}"
            cache_control="${response_lines[2]:-}"
            content_type_options="${response_lines[3]:-}"
            frame_options="${response_lines[4]:-}"
            csp="${response_lines[5]:-}"

            case "$status" in
              200)
                grep --fixed-strings "<title>$title</title>" "$body_file"
                grep --ignore-case --fixed-strings 'no-store' \
                  <<< "$cache_control"
                grep --ignore-case --line-regexp 'nosniff' \
                  <<< "$content_type_options"
                grep --fixed-strings "frame-ancestors 'none'" \
                  <<< "$csp"
                echo "$name sign-in is reachable with HTTP $status"
                ;;
              302|303|307|308)
                grep --fixed-strings 'https://vercel.com/sso-api?' \
                  <<< "$location"
                grep --ignore-case --fixed-strings 'no-store' \
                  <<< "$cache_control"
                grep --ignore-case --line-regexp 'DENY' \
                  <<< "$frame_options"
                echo "$name sign-in is reachable behind Vercel Deployment Protection with HTTP $status"
                ;;
              *)
                echo "::error::$name sign-in returned unexpected HTTP $status"
                exit 1
                ;;
            esac
          }

          check_sign_in 'Learner portal' "$PORTAL_URL" 'Learner Portal | Luminol'
          check_sign_in 'Administration' "$ADMIN_URL" 'Administration | Luminol'

      - name: Record check summary
        if: always()
        shell: bash
        run: |
          checked_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          printf '%s\n' \
            '## Production health check' \
            '' \
            "- Public website: $WEB_URL" \
            "- Learner portal sign-in: $PORTAL_URL/sign-in" \
            "- Administration sign-in: $ADMIN_URL/sign-in" \
            "- Checked at: $checked_at" \
            '' \
            'Scheduled GitHub Actions executions are approximate and may start later than the cron time.' \
            >> "$GITHUB_STEP_SUMMARY"
