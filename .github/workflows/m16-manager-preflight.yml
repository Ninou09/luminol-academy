name: Milestone 16 manager preflight

on:
  push:
    branches:
      - feature/milestone-16-organization-manager
    paths:
      - .github/workflows/m16-manager-preflight.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-manager
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Apply manager workspace typing fixes
        shell: bash
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          server = Path('apps/portal/lib/organization-manager.server.ts')
          text = server.read_text()
          text = text.replace(
              "import { db } from '@luminol/database';",
              "import { db, type Prisma } from '@luminol/database';",
              1,
          )
          old_where = '''const managerRoles = ['OWNER', 'MANAGER'] as const;

const managerMembershipWhere = (userId: string) => ({
  userId,
  active: true,
  role: { in: managerRoles },
  organization: { archivedAt: null },
});'''
          new_where = '''function managerMembershipWhere(
  userId: string,
): Prisma.OrganizationMembershipWhereInput {
  return {
    userId,
    active: true,
    role: { in: ['OWNER', 'MANAGER'] },
    organization: { archivedAt: null },
  };
}'''
          if old_where not in text:
              raise SystemExit('Expected manager where block not found')
          server.write_text(text.replace(old_where, new_where, 1))

          page = Path('apps/portal/app/organization/page.tsx')
          text = page.read_text()
          text = text.replace(
              '    teamId?: string;\n',
              '    teamId?: string | undefined;\n',
              1,
          )
          pattern = re.compile(
              r"href=\{workspaceHref\(locale, \{\s*\.\.\.baseState,\s*teamId: undefined,\s*rosterPage: 1,\s*\}\)\}"
          )
          replacement = '''href={workspaceHref(locale, {
                  organizationId: baseState.organizationId,
                  organizationPage: baseState.organizationPage,
                  rosterPage: 1,
                  teamPage: baseState.teamPage,
                  coursePage: baseState.coursePage,
                })}'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one team-filter reset block, replaced {count}')
          page.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/portal/app/organization/page.tsx apps/portal/components/portal-header.tsx apps/portal/lib/organization-manager.ts apps/portal/lib/organization-manager.server.ts apps/portal/lib/organization-manager-localization.ts apps/portal/lib/organization-manager.test.ts apps/portal/app/organization/README.md apps/portal/package.json
      - run: pnpm db:generate
      - run: pnpm --filter @luminol/portal lint
      - run: pnpm --filter @luminol/portal typecheck
      - run: pnpm --filter @luminol/portal test
      - name: Commit prepared manager slice
        shell: bash
        run: |
          rm .github/workflows/m16-manager-preflight.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Prepare Milestone 16 manager workspace"
          git push origin HEAD:feature/milestone-16-organization-manager
