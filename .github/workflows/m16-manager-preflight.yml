name: Milestone 16 manager preflight

on:
  push:
    branches:
      - feature/milestone-16-organization-manager
    paths:
      - .github/workflows/m16-manager-preflight.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-manager
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Fix optional team-filter state
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/portal/app/organization/page.tsx')
          text = path.read_text()
          old = '''                href={workspaceHref(locale, {
                  ...baseState,
                  teamId: undefined,
                  rosterPage: 1,
                })}'''
          new = '''                href={workspaceHref(locale, {
                  organizationId: baseState.organizationId,
                  organizationPage: baseState.organizationPage,
                  rosterPage: 1,
                  teamPage: baseState.teamPage,
                  coursePage: baseState.coursePage,
                })}'''
          if old not in text:
              raise SystemExit('Expected team-filter reset block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write apps/portal/app/organization/page.tsx apps/portal/components/portal-header.tsx apps/portal/lib/organization-manager.ts apps/portal/lib/organization-manager.server.ts apps/portal/lib/organization-manager-localization.ts apps/portal/lib/organization-manager.test.ts apps/portal/app/organization/README.md apps/portal/package.json
      - run: pnpm db:generate
      - run: pnpm --filter @luminol/portal lint
      - run: pnpm --filter @luminol/portal typecheck
      - run: pnpm --filter @luminol/portal test
      - name: Commit prepared manager slice
        shell: bash
        run: |
          rm .github/workflows/m16-manager-preflight.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Prepare Milestone 16 manager workspace"
          git push origin HEAD:feature/milestone-16-organization-manager
