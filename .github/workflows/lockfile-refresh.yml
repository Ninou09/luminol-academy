name: Refresh lockfile

on:
  push:
    branches:
      - feat/launch-conversion-upgrades

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/launch-conversion-upgrades
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile and remove helper workflow
        run: |
          rm .github/workflows/lockfile-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/lockfile-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh lockfile for patched fast-uri"
          git push origin HEAD:feat/launch-conversion-upgrades
