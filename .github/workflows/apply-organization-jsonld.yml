name: Apply homepage Organization JSON-LD

on:
  push:
    branches:
      - seo/issue-125-organization-jsonld

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply homepage integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/page.tsx')
          source = path.read_text()

          import_anchor = "import { SiteFooter, SiteHeader } from '../components/site-shell';\n"
          import_replacement = "import { OrganizationJsonLd } from '../components/organization-json-ld';\n" + import_anchor
          if source.count(import_anchor) != 1:
              raise SystemExit('Expected one site-shell import')
          source = source.replace(import_anchor, import_replacement)

          copy_anchor = "  const copy = getPublicCopy(locale).home;\n"
          copy_replacement = "  const publicCopy = getPublicCopy(locale);\n  const copy = publicCopy.home;\n"
          if source.count(copy_anchor) != 1:
              raise SystemExit('Expected one homepage copy assignment')
          source = source.replace(copy_anchor, copy_replacement)

          header_anchor = "      <SiteHeader />\n      <main className={styles.page}>\n"
          header_replacement = "      <SiteHeader />\n      <OrganizationJsonLd description={publicCopy.site.description} />\n      <main className={styles.page}>\n"
          if source.count(header_anchor) != 1:
              raise SystemExit('Expected one homepage shell anchor')
          source = source.replace(header_anchor, header_replacement)

          path.write_text(source)
          PY
      - name: Format structured-data change
        run: pnpm exec prettier --write apps/web/app/page.tsx apps/web/components/organization-json-ld.tsx apps/web/lib/structured-data.ts apps/web/lib/structured-data.test.ts
      - name: Commit structured-data change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-organization-jsonld.yml
          git add apps/web/app/page.tsx apps/web/components/organization-json-ld.tsx apps/web/lib/structured-data.ts apps/web/lib/structured-data.test.ts
          git commit -m 'Add safe Organization JSON-LD to homepage'
          git push origin HEAD:seo/issue-125-organization-jsonld
