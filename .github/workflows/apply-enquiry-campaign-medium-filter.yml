name: Apply enquiry campaign medium filter

on:
  push:
    branches:
      - feat/enquiry-campaign-medium-filter

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-campaign-medium-filter
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate campaign medium filtering
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('apps/admin/app/enquiries/page.tsx')
          text = page.read_text()

          param_marker = "    utmCampaign?: string | string[] | undefined;\n"
          param_addition = param_marker + "    utmMedium?: string | string[] | undefined;\n"
          if param_marker not in text:
              raise SystemExit('utmCampaign search param marker not found')
          text = text.replace(param_marker, param_addition, 1)

          query_marker = "    if (campaignAttribution.utmCampaign) {\n      query.set('utmCampaign', campaignAttribution.utmCampaign);\n    }\n"
          query_addition = query_marker + "    if (campaignAttribution.utmMedium) {\n      query.set('utmMedium', campaignAttribution.utmMedium);\n    }\n"
          if query_marker not in text:
              raise SystemExit('campaign query marker not found')
          text = text.replace(query_marker, query_addition, 1)

          parse_marker = "  const activeCampaignAttribution = parseEnquiryCampaignAttributionFilter(\n    params?.utmSource,\n    params?.utmCampaign,\n  );\n"
          parse_replacement = "  const activeCampaignAttribution = parseEnquiryCampaignAttributionFilter(\n    params?.utmSource,\n    params?.utmCampaign,\n    params?.utmMedium,\n  );\n"
          if parse_marker not in text:
              raise SystemExit('campaign attribution parse marker not found')
          text = text.replace(parse_marker, parse_replacement, 1)

          source_panel = "\n".join([
              "                  <span className={styles.filterLink} dir=\"auto\">",
              "                    {campaignFilterCopy.source}:{' '}",
              "                    {activeCampaignAttribution.utmSource}",
              "                  </span>",
          ])
          source_panel_replacement = "\n".join([
              "                  {activeCampaignAttribution.utmSource ? (",
              "                    <span className={styles.filterLink} dir=\"auto\">",
              "                      {campaignFilterCopy.source}:{' '}",
              "                      {activeCampaignAttribution.utmSource}",
              "                    </span>",
              "                  ) : null}",
          ])
          if source_panel not in text:
              raise SystemExit('active source panel marker not found')
          text = text.replace(source_panel, source_panel_replacement, 1)

          campaign_panel_marker = "\n".join([
              "                  {activeCampaignAttribution.utmCampaign ? (",
              "                    <span className={styles.filterLink} dir=\"auto\">",
              "                      {campaignFilterCopy.campaign}:{' '}",
              "                      {activeCampaignAttribution.utmCampaign}",
              "                    </span>",
              "                  ) : null}",
          ])
          medium_panel = campaign_panel_marker + "\n" + "\n".join([
              "                  {activeCampaignAttribution.utmMedium ? (",
              "                    <span className={styles.filterLink} dir=\"auto\">",
              "                      {campaignFilterCopy.medium}:{' '}",
              "                      {activeCampaignAttribution.utmMedium}",
              "                    </span>",
              "                  ) : null}",
          ])
          if campaign_panel_marker not in text:
              raise SystemExit('active campaign panel marker not found')
          text = text.replace(campaign_panel_marker, medium_panel, 1)
          page.write_text(text)

          dashboard = Path('apps/admin/app/page.tsx')
          dashboard_text = dashboard.read_text()

          source_query_marker = "                            utmSource: item.utmSource,\n                            utmCampaign: null,\n"
          source_query_replacement = source_query_marker + "                            utmMedium: null,\n"
          if source_query_marker not in dashboard_text:
              raise SystemExit('source drill-down query marker not found')
          dashboard_text = dashboard_text.replace(source_query_marker, source_query_replacement, 1)

          pair_query_marker = "                            utmSource: item.utmSource,\n                            utmCampaign: item.utmCampaign,\n"
          pair_query_replacement = pair_query_marker + "                            utmMedium: null,\n"
          if pair_query_marker not in dashboard_text:
              raise SystemExit('campaign pair drill-down query marker not found')
          dashboard_text = dashboard_text.replace(pair_query_marker, pair_query_replacement, 1)

          medium_span = "                      <span dir=\"auto\">{item.utmMedium}</span>\n"
          medium_link = "\n".join([
              "                      <Link",
              "                        href={localizeHref(",
              "                          locale,",
              "                          `/enquiries?${buildEnquiryCampaignAttributionQuery({",
              "                            utmSource: null,",
              "                            utmCampaign: null,",
              "                            utmMedium: item.utmMedium,",
              "                          })}`,",
              "                        )}",
              "                      >",
              "                        <span dir=\"auto\">{item.utmMedium}</span>",
              "                      </Link>",
              "",
          ])
          if medium_span not in dashboard_text:
              raise SystemExit('campaign medium span marker not found')
          dashboard_text = dashboard_text.replace(medium_span, medium_link, 1)
          dashboard.write_text(dashboard_text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/enquiries/page.tsx \
            apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-campaign-filter.ts \
            apps/admin/lib/enquiry-campaign-filter.test.ts \
            apps/admin/lib/enquiry-campaign-filter-localization.ts \
            apps/admin/lib/enquiry-campaign-filter-localization.test.ts
      - name: Run git diff --check
        run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/enquiries/page.tsx \
            apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-campaign-filter.ts \
            apps/admin/lib/enquiry-campaign-filter.test.ts \
            apps/admin/lib/enquiry-campaign-filter-localization.ts \
            apps/admin/lib/enquiry-campaign-filter-localization.test.ts
          git commit -m "Integrate campaign medium enquiry drill-down"
          git push origin HEAD:feat/enquiry-campaign-medium-filter
