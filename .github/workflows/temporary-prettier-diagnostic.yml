name: Temporary Prettier Diagnostic

on:
  push:
    branches:
      - feature/milestone-16-finance-integration

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        shell: bash
        run: |
          target='packages/database/src/milestone16-notification-parent-integrity.integration.test.ts'
          pnpm exec prettier --write "$target"
          git diff -- "$target"
          if ! git diff --quiet -- "$target"; then
            exit 1
          fi
