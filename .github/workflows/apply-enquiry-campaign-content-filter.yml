name: Apply enquiry campaign content filter

on:
  push:
    branches:
      - feat/enquiry-campaign-content-filter

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-campaign-content-filter
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate campaign content filtering
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('apps/admin/app/enquiries/page.tsx')
          text = page.read_text()

          param_marker = "    utmMedium?: string | string[] | undefined;\n"
          param_addition = param_marker + "    utmContent?: string | string[] | undefined;\n"
          if param_marker not in text:
              raise SystemExit('utmMedium search param marker not found')
          text = text.replace(param_marker, param_addition, 1)

          medium_query_marker = "    if (campaignAttribution.utmMedium) {\n      query.set('utmMedium', campaignAttribution.utmMedium);\n    }\n"
          content_query_addition = medium_query_marker + "    if (campaignAttribution.utmContent) {\n      query.set('utmContent', campaignAttribution.utmContent);\n    }\n"
          if medium_query_marker not in text:
              raise SystemExit('utmMedium query marker not found')
          text = text.replace(medium_query_marker, content_query_addition, 1)

          parse_marker = "  const activeCampaignAttribution = parseEnquiryCampaignAttributionFilter(\n    params?.utmSource,\n    params?.utmCampaign,\n    params?.utmMedium,\n  );\n"
          parse_replacement = "  const activeCampaignAttribution = parseEnquiryCampaignAttributionFilter(\n    params?.utmSource,\n    params?.utmCampaign,\n    params?.utmMedium,\n    params?.utmContent,\n  );\n"
          if parse_marker not in text:
              raise SystemExit('campaign attribution parse marker not found')
          text = text.replace(parse_marker, parse_replacement, 1)

          medium_panel = "\n".join([
              "                  {activeCampaignAttribution.utmMedium ? (",
              "                    <span className={styles.filterLink} dir=\"auto\">",
              "                      {campaignFilterCopy.medium}:{' '}",
              "                      {activeCampaignAttribution.utmMedium}",
              "                    </span>",
              "                  ) : null}",
          ])
          content_panel = medium_panel + "\n" + "\n".join([
              "                  {activeCampaignAttribution.utmContent ? (",
              "                    <span className={styles.filterLink} dir=\"auto\">",
              "                      {campaignFilterCopy.content}:{' '}",
              "                      {activeCampaignAttribution.utmContent}",
              "                    </span>",
              "                  ) : null}",
          ])
          if medium_panel not in text:
              raise SystemExit('active medium panel marker not found')
          text = text.replace(medium_panel, content_panel, 1)
          page.write_text(text)

          dashboard = Path('apps/admin/app/page.tsx')
          dashboard_text = dashboard.read_text()

          source_object = "                            utmSource: item.utmSource,\n                            utmCampaign: null,\n                            utmMedium: null,\n"
          source_replacement = source_object + "                            utmContent: null,\n"
          if source_object not in dashboard_text:
              raise SystemExit('source drill-down object marker not found')
          dashboard_text = dashboard_text.replace(source_object, source_replacement, 1)

          pair_object = "                            utmSource: item.utmSource,\n                            utmCampaign: item.utmCampaign,\n                            utmMedium: null,\n"
          pair_replacement = pair_object + "                            utmContent: null,\n"
          if pair_object not in dashboard_text:
              raise SystemExit('campaign pair object marker not found')
          dashboard_text = dashboard_text.replace(pair_object, pair_replacement, 1)

          medium_object = "                            utmSource: null,\n                            utmCampaign: null,\n                            utmMedium: item.utmMedium,\n"
          medium_replacement = medium_object + "                            utmContent: null,\n"
          if medium_object not in dashboard_text:
              raise SystemExit('medium drill-down object marker not found')
          dashboard_text = dashboard_text.replace(medium_object, medium_replacement, 1)

          content_span = "                      <span dir=\"auto\">{item.utmContent}</span>\n"
          content_link = "\n".join([
              "                      <Link",
              "                        href={localizeHref(",
              "                          locale,",
              "                          `/enquiries?${buildEnquiryCampaignAttributionQuery({",
              "                            utmSource: null,",
              "                            utmCampaign: null,",
              "                            utmMedium: null,",
              "                            utmContent: item.utmContent,",
              "                          })}`,",
              "                        )}",
              "                      >",
              "                        <span dir=\"auto\">{item.utmContent}</span>",
              "                      </Link>",
              "",
          ])
          if content_span not in dashboard_text:
              raise SystemExit('campaign content span marker not found')
          dashboard_text = dashboard_text.replace(content_span, content_link, 1)
          dashboard.write_text(dashboard_text)
          PY
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/enquiries/page.tsx \
            apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-campaign-filter.ts \
            apps/admin/lib/enquiry-campaign-filter.test.ts \
            apps/admin/lib/enquiry-campaign-filter-localization.ts \
            apps/admin/lib/enquiry-campaign-filter-localization.test.ts
      - name: Run focused checks
        run: |
          pnpm --filter @luminol/admin typecheck
          pnpm --filter @luminol/admin test -- enquiry-campaign-filter
          git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/enquiries/page.tsx \
            apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-campaign-filter.ts \
            apps/admin/lib/enquiry-campaign-filter.test.ts \
            apps/admin/lib/enquiry-campaign-filter-localization.ts \
            apps/admin/lib/enquiry-campaign-filter-localization.test.ts
          git commit -m "Integrate campaign content enquiry drill-down"
          git push origin HEAD:feat/enquiry-campaign-content-filter
