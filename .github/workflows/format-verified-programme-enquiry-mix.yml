name: Format verified programme enquiry mix

on:
  push:
    branches:
      - feat/verified-programme-enquiry-mix

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'chore: format programme mix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/verified-programme-enquiry-mix
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: |
          pnpm exec prettier --write \
            apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-pipeline-reporting.test.ts \
            apps/admin/lib/enquiry-pipeline-reporting.ts \
            apps/admin/lib/enquiry-programme-mix-localization.test.ts \
            apps/admin/lib/enquiry-programme-mix-localization.ts
      - run: git diff --check
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-pipeline-reporting.test.ts \
            apps/admin/lib/enquiry-pipeline-reporting.ts \
            apps/admin/lib/enquiry-programme-mix-localization.test.ts \
            apps/admin/lib/enquiry-programme-mix-localization.ts
          git commit -m "Format verified programme enquiry mix"
          git push origin HEAD:feat/verified-programme-enquiry-mix
