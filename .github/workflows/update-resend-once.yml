name: Update Resend once

on:
  push:
    branches:
      - deps/upgrade-resend-6

permissions:
  contents: write

concurrency:
  group: update-resend-once
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deps/upgrade-resend-6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate Resend package and lockfile from current main
        run: pnpm --filter @luminol/emails add "resend@^6.18.1"
      - name: Verify controlled dependency diff
        shell: bash
        run: |
          printf '%s\n' packages/emails/package.json pnpm-lock.yaml | sort > "$RUNNER_TEMP/expected.txt"
          git diff --name-only | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          grep -F '"resend": "^6.18.1"' packages/emails/package.json
      - name: Commit regenerated dependency graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/emails/package.json pnpm-lock.yaml
          git commit -m "Upgrade Resend SDK to 6.18.1"
          git push origin HEAD:deps/upgrade-resend-6
