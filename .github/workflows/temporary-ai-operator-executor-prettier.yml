name: Temporary AI Operator Executor Prettier
on:
  push:
    branches: [feat/ai-operator-controlled-crm-executor]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-operator-controlled-crm-executor
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.2.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier formatting
        run: |
          pnpm exec prettier --write \
            apps/admin/lib/ai-operator-proposal-localization.test.ts \
            apps/admin/lib/ai-operator-proposal-localization.ts \
            packages/database/src/ai-operator-crm-executor.integration.test.ts \
            packages/database/src/ai-operator-crm-executor.ts \
            packages/database/src/enquiry-follow-up.ts
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/admin/lib/ai-operator-proposal-localization.test.ts \
            apps/admin/lib/ai-operator-proposal-localization.ts \
            packages/database/src/ai-operator-crm-executor.integration.test.ts \
            packages/database/src/ai-operator-crm-executor.ts \
            packages/database/src/enquiry-follow-up.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format AI Operator executor files [prettier-fix]"
          git push origin HEAD:feat/ai-operator-controlled-crm-executor
