name: Temporary Content Calendar Wiring
on:
  push:
    branches: [feat/ai-operator-content-calendar]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[content-calendar-wiring]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-operator-content-calendar
      - name: Wire package export and admin navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('packages/database/src/index.ts')
          text = index.read_text()
          anchor = "export * from './ai-operator-proposals';\nexport * from './enquiry-follow-up';"
          replacement = "export * from './ai-operator-proposals';\nexport * from './content-calendar';\nexport * from './enquiry-follow-up';"
          if text.count(anchor) != 1:
              raise SystemExit('database export anchor mismatch')
          index.write_text(text.replace(anchor, replacement))

          page = Path('apps/admin/app/page.tsx')
          text = page.read_text()
          import_anchor = "import { getCampaignLinkBuilderCopy } from '../lib/campaign-link-builder-localization';\n"
          import_replacement = import_anchor + "import { getContentCalendarCopy } from '../lib/content-calendar-localization';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('admin import anchor mismatch')
          text = text.replace(import_anchor, import_replacement)

          const_anchor = "  const campaignLinkBuilderCopy = getCampaignLinkBuilderCopy(locale);\n"
          const_replacement = const_anchor + "  const contentCalendarCopy = getContentCalendarCopy(locale);\n"
          if text.count(const_anchor) != 1:
              raise SystemExit('admin copy anchor mismatch')
          text = text.replace(const_anchor, const_replacement)

          nav_anchor = '''          <Link href={localizeHref(locale, '/campaign-links')}>
            <span>08</span> {campaignLinkBuilderCopy.title}
          </Link>
'''
          nav_replacement = nav_anchor + '''          <Link href={localizeHref(locale, '/content-calendar')}>
            <span>09</span> {contentCalendarCopy.title}
          </Link>
'''
          if text.count(nav_anchor) != 1:
              raise SystemExit('admin navigation anchor mismatch')
          page.write_text(text.replace(nav_anchor, nav_replacement))

          operator_page = Path('apps/admin/app/ai-operator/page.tsx')
          text = operator_page.read_text()
          social_anchor = '''    return {
      target: `${action.target.platform} · ${action.target.accountRef}`,
      payload: action.payload.contentCalendarItemId,
    };
'''
          social_replacement = '''    return {
      target: `${action.target.platform} · ${action.target.accountRef}`,
      payload: `${action.payload.contentCalendarItemId} · r${action.payload.contentRevision}`,
    };
'''
          if text.count(social_anchor) != 1:
              raise SystemExit('AI Operator social summary anchor mismatch')
          operator_page.write_text(text.replace(social_anchor, social_replacement))
          PY
          git diff --check
      - name: Commit wiring
        run: |
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/src/index.ts apps/admin/app/page.tsx apps/admin/app/ai-operator/page.tsx
          git commit -m "Wire content calendar into Operating System [content-calendar-wiring]"
          git push origin HEAD:feat/ai-operator-content-calendar
