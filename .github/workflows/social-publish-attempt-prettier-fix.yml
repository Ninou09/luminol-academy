name: Temporary Social Publish Attempt Prettier Fix
on:
  push:
    branches: [feat/ai-operator-social-publish-attempts]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[social-attempt-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-operator-social-publish-attempts
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonicalize changed source files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/social-publishing/actions.ts \
            apps/admin/app/social-publishing/page.tsx \
            apps/admin/lib/social-publishing-localization.ts \
            apps/admin/lib/social-publishing-localization.test.ts \
            packages/database/src/social-publishing-attempts.ts \
            packages/database/src/social-publishing-attempts.test.ts \
            packages/database/src/social-publishing-attempts.integration.test.ts
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/admin/app/social-publishing/actions.ts apps/admin/app/social-publishing/page.tsx apps/admin/lib/social-publishing-localization.ts apps/admin/lib/social-publishing-localization.test.ts packages/database/src/social-publishing-attempts.ts packages/database/src/social-publishing-attempts.test.ts packages/database/src/social-publishing-attempts.integration.test.ts
          git commit -m "Canonicalize social publish attempt formatting [social-attempt-format]"
          git push origin HEAD:feat/ai-operator-social-publish-attempts
