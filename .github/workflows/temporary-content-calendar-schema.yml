name: Temporary Content Calendar Schema Patch
on:
  push:
    branches: [feat/ai-operator-content-calendar]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[content-calendar-schema]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-operator-content-calendar
      - name: Patch Prisma schema and migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()

          enum_anchor = '''enum AiOperatorProposalEventType {\n  PROPOSED\n  APPROVED\n  REJECTED\n  CANCELLED\n  EXECUTED\n}\n'''
          enum_insert = enum_anchor + '''\nenum ContentCalendarPlatform {\n  INSTAGRAM\n  FACEBOOK\n}\n\nenum ContentCalendarFormat {\n  REEL\n  CAROUSEL\n  STATIC_POST\n  STORY\n  OTHER\n}\n\nenum ContentCalendarStatus {\n  DRAFT\n  READY\n  SCHEDULED\n  ARCHIVED\n}\n\nenum ContentCalendarEventType {\n  CREATED\n  UPDATED\n  STATUS_CHANGED\n}\n'''
          if text.count(enum_anchor) != 1:
              raise SystemExit('AI Operator event enum anchor mismatch')
          text = text.replace(enum_anchor, enum_insert)

          user_anchor = '''  aiOperatorProposalsProposed AiOperatorProposal[]      @relation("AiOperatorProposalProposer")\n  aiOperatorProposalsDecided  AiOperatorProposal[]      @relation("AiOperatorProposalDecider")\n  aiOperatorProposalsExecuted AiOperatorProposal[]      @relation("AiOperatorProposalExecutor")\n  aiOperatorProposalEvents    AiOperatorProposalEvent[] @relation("AiOperatorProposalEventActor")\n'''
          user_insert = user_anchor + '''\n  contentCalendarItemsCreated ContentCalendarItem[]      @relation("ContentCalendarItemCreator")\n  contentCalendarItemsUpdated ContentCalendarItem[]      @relation("ContentCalendarItemUpdater")\n  contentCalendarEvents       ContentCalendarItemEvent[] @relation("ContentCalendarEventActor")\n'''
          if text.count(user_anchor) != 1:
              raise SystemExit('User AI Operator relation anchor mismatch')
          text = text.replace(user_anchor, user_insert)

          model_anchor = 'model Invoice {'
          models = '''model ContentCalendarItem {\n  id              String                  @id @default(cuid())\n  title           String\n  caption         String\n  platform        ContentCalendarPlatform\n  accountRef      String\n  format          ContentCalendarFormat\n  status          ContentCalendarStatus    @default(DRAFT)\n  assetReference  String?\n  scheduledFor    DateTime?\n  timezone        String?\n  revision        Int                      @default(1)\n  createdByUserId String\n  updatedByUserId String\n  createdAt       DateTime                 @default(now())\n  updatedAt       DateTime                 @updatedAt\n  createdBy       User                     @relation("ContentCalendarItemCreator", fields: [createdByUserId], references: [id], onDelete: Restrict)\n  updatedBy       User                     @relation("ContentCalendarItemUpdater", fields: [updatedByUserId], references: [id], onDelete: Restrict)\n  events          ContentCalendarItemEvent[]\n\n  @@index([status, scheduledFor])\n  @@index([platform, status, scheduledFor])\n  @@index([createdByUserId, createdAt])\n  @@index([updatedByUserId, updatedAt])\n}\n\nmodel ContentCalendarItemEvent {\n  id           String                   @id @default(cuid())\n  itemId       String\n  eventType    ContentCalendarEventType\n  actorUserId  String\n  fromStatus   ContentCalendarStatus?\n  toStatus     ContentCalendarStatus\n  fromRevision Int?\n  toRevision   Int\n  occurredAt   DateTime                 @default(now())\n  item         ContentCalendarItem      @relation(fields: [itemId], references: [id], onDelete: Cascade)\n  actor        User                     @relation("ContentCalendarEventActor", fields: [actorUserId], references: [id], onDelete: Restrict)\n\n  @@index([itemId, occurredAt])\n  @@index([actorUserId, occurredAt])\n}\n\nmodel Invoice {'''
          if text.count(model_anchor) != 1:
              raise SystemExit('Invoice model anchor mismatch')
          text = text.replace(model_anchor, models)
          path.write_text(text)

          migration = Path('packages/database/prisma/migrations/20260901140000_content_calendar_foundation/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=False)
          migration.write_text('''CREATE TYPE "ContentCalendarPlatform" AS ENUM ('INSTAGRAM', 'FACEBOOK');\nCREATE TYPE "ContentCalendarFormat" AS ENUM ('REEL', 'CAROUSEL', 'STATIC_POST', 'STORY', 'OTHER');\nCREATE TYPE "ContentCalendarStatus" AS ENUM ('DRAFT', 'READY', 'SCHEDULED', 'ARCHIVED');\nCREATE TYPE "ContentCalendarEventType" AS ENUM ('CREATED', 'UPDATED', 'STATUS_CHANGED');\n\nCREATE TABLE "ContentCalendarItem" (\n  "id" TEXT NOT NULL,\n  "title" TEXT NOT NULL,\n  "caption" TEXT NOT NULL,\n  "platform" "ContentCalendarPlatform" NOT NULL,\n  "accountRef" TEXT NOT NULL,\n  "format" "ContentCalendarFormat" NOT NULL,\n  "status" "ContentCalendarStatus" NOT NULL DEFAULT 'DRAFT',\n  "assetReference" TEXT,\n  "scheduledFor" TIMESTAMP(3),\n  "timezone" TEXT,\n  "revision" INTEGER NOT NULL DEFAULT 1,\n  "createdByUserId" TEXT NOT NULL,\n  "updatedByUserId" TEXT NOT NULL,\n  "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  "updatedAt" TIMESTAMP(3) NOT NULL,\n  CONSTRAINT "ContentCalendarItem_pkey" PRIMARY KEY ("id")\n);\n\nCREATE TABLE "ContentCalendarItemEvent" (\n  "id" TEXT NOT NULL,\n  "itemId" TEXT NOT NULL,\n  "eventType" "ContentCalendarEventType" NOT NULL,\n  "actorUserId" TEXT NOT NULL,\n  "fromStatus" "ContentCalendarStatus",\n  "toStatus" "ContentCalendarStatus" NOT NULL,\n  "fromRevision" INTEGER,\n  "toRevision" INTEGER NOT NULL,\n  "occurredAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  CONSTRAINT "ContentCalendarItemEvent_pkey" PRIMARY KEY ("id")\n);\n\nCREATE INDEX "ContentCalendarItem_status_scheduledFor_idx" ON "ContentCalendarItem"("status", "scheduledFor");\nCREATE INDEX "ContentCalendarItem_platform_status_scheduledFor_idx" ON "ContentCalendarItem"("platform", "status", "scheduledFor");\nCREATE INDEX "ContentCalendarItem_createdByUserId_createdAt_idx" ON "ContentCalendarItem"("createdByUserId", "createdAt");\nCREATE INDEX "ContentCalendarItem_updatedByUserId_updatedAt_idx" ON "ContentCalendarItem"("updatedByUserId", "updatedAt");\nCREATE INDEX "ContentCalendarItemEvent_itemId_occurredAt_idx" ON "ContentCalendarItemEvent"("itemId", "occurredAt");\nCREATE INDEX "ContentCalendarItemEvent_actorUserId_occurredAt_idx" ON "ContentCalendarItemEvent"("actorUserId", "occurredAt");\n\nALTER TABLE "ContentCalendarItem" ADD CONSTRAINT "ContentCalendarItem_createdByUserId_fkey" FOREIGN KEY ("createdByUserId") REFERENCES "User"("id") ON DELETE RESTRICT ON UPDATE CASCADE;\nALTER TABLE "ContentCalendarItem" ADD CONSTRAINT "ContentCalendarItem_updatedByUserId_fkey" FOREIGN KEY ("updatedByUserId") REFERENCES "User"("id") ON DELETE RESTRICT ON UPDATE CASCADE;\nALTER TABLE "ContentCalendarItemEvent" ADD CONSTRAINT "ContentCalendarItemEvent_itemId_fkey" FOREIGN KEY ("itemId") REFERENCES "ContentCalendarItem"("id") ON DELETE CASCADE ON UPDATE CASCADE;\nALTER TABLE "ContentCalendarItemEvent" ADD CONSTRAINT "ContentCalendarItemEvent_actorUserId_fkey" FOREIGN KEY ("actorUserId") REFERENCES "User"("id") ON DELETE RESTRICT ON UPDATE CASCADE;\n''')
          PY
          git diff --check
      - name: Commit schema patch
        run: |
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma packages/database/prisma/migrations/20260901140000_content_calendar_foundation/migration.sql
          git commit -m "Add content calendar persistence [content-calendar-schema]"
          git push origin HEAD:feat/ai-operator-content-calendar
