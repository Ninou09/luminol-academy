name: Integrate real academy media once

on:
  push:
    branches:
      - design/premium-motion-homepage
    paths:
      - .github/workflows/real-academy-media-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/premium-motion-homepage
          fetch-depth: 0
      - name: Finish authentic Luminol media integration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # Arabic school-page media source.
          p = Path('apps/web/lib/flagship.ts')
          text = p.read_text()
          if "import { academyMedia } from './academy-media';" not in text:
              text = "import { academyMedia } from './academy-media';\n" + text
          start = 'export const editorialImages = {'
          end = '\n\nexport const editorialVideos = ['
          replacement = '''export const editorialImages = {
            hero: { src: academyMedia.training.src, alt: academyMedia.training.alt, credit: 'Luminol Academy archive', creditUrl: '/about' },
            psychology: { src: academyMedia.psychology.src, alt: academyMedia.psychology.alt, credit: 'Luminol Academy archive', creditUrl: '/about' },
            languages: { src: academyMedia.languages.src, alt: academyMedia.languages.alt, credit: 'Luminol Academy archive', creditUrl: '/about' },
            training: { src: academyMedia.training.src, alt: academyMedia.training.alt, credit: 'Luminol Academy archive', creditUrl: '/about' },
            learning: { src: academyMedia.classroom.src, alt: academyMedia.classroom.alt, credit: 'Luminol Academy archive', creditUrl: '/about' },
          } satisfies Record<string, EditorialImage>;'''
          a = text.index(start)
          b = text.index(end, a)
          p.write_text(text[:a] + replacement + text[b:])

          # Homepage archive: visibly include Psychology as well as Languages and Training.
          p = Path('apps/web/components/academy-archive.tsx')
          text = p.read_text()
          text = text.replace("      'فضاء اللغات',\n      'محطات من مسيرة لومينول',", "      'فضاء اللغات',\n      'أنشطة علم النفس والتعلم',\n      'محطات من مسيرة لومينول',")
          text = text.replace("      'Espace langues',\n      'Moments du parcours Luminol',", "      'Espace langues',\n      'Psychologie et activités',\n      'Moments du parcours Luminol',")
          text = text.replace("      'Language space',\n      'Moments from the Luminol journey',", "      'Language space',\n      'Psychology and learning activities',\n      'Moments from the Luminol journey',")
          text = text.replace("  academyMedia.languages,\n  academyMedia.recognition,", "  academyMedia.languages,\n  academyMedia.psychology,\n  academyMedia.recognition,")
          p.write_text(text)

          # Correct media disclosure: photographs are real, only video remains editorial.
          p = Path('apps/web/components/cinematic-media.tsx')
          text = p.read_text()
          swaps = {
            "      'الفيديو هنا ليس زينة. كل مشهد يشرح فكرة: الإصغاء، المشاركة، الحوار أو التطبيق. المواد تحريرية مؤقتة إلى أن نستبدلها بلقطات لومينول الأصلية والمصرّح بنشرها.',": "      'صور هذه المساحة من أرشيف أكاديمية لومينول الحقيقي. الفيديوهات وحدها مواد تحريرية مؤقتة إلى أن تتوفر لقطات لومينول الأصلية المصرّح بنشرها.',",
            "    galleryAria: 'مجموعة صور تحريرية توضيحية',": "    galleryAria: 'مجموعة صور حقيقية من أرشيف أكاديمية لومينول',",
            "    note: 'جميع الصور والفيديوهات مواد تحريرية توضيحية مرخّصة من Pexels، وليست توثيقًا لطلاب أو حصص أكاديمية لومينول.',": "    note: 'الصور المعروضة هنا من أرشيف أكاديمية لومينول. الفيديوهات فقط مواد تحريرية توضيحية مرخّصة من Pexels ولا تمثّل طلاب لومينول.',",
            "      'La vidéo n’est pas décorative. Chaque scène exprime une idée: écoute, participation, dialogue ou mise en pratique. Ces médias éditoriaux sont temporaires jusqu’à leur remplacement par des images Luminol authentiques et autorisées.',": "      'Les photographies de cette section proviennent des archives réelles de Luminol Academy. Seules les vidéos restent des médias éditoriaux temporaires.',",
            "    galleryAria: 'Galerie éditoriale illustrative',": "    galleryAria: 'Galerie de photographies réelles de Luminol Academy',",
            "    note: 'Toutes les photos et vidéos sont des médias éditoriaux illustratifs sous licence Pexels. Elles ne représentent pas des étudiants ou des séances réelles de Luminol Academy.',": "    note: 'Les photographies sont issues des archives de Luminol Academy. Seules les vidéos sont des médias éditoriaux illustratifs sous licence Pexels.',",
            "      'Video is not decoration here. Each scene communicates an idea: listening, participation, dialogue or application. These editorial assets are temporary until approved authentic Luminol footage replaces them.',": "      'The photography in this section comes from the real Luminol Academy archive. Only the videos remain temporary editorial media.',",
            "    galleryAria: 'Illustrative editorial gallery',": "    galleryAria: 'Real Luminol Academy photography gallery',",
            "    note: 'All photos and videos are illustrative editorial media licensed from Pexels. They do not depict real Luminol Academy students or sessions.',": "    note: 'The photographs shown here are from the Luminol Academy archive. Only the videos are illustrative editorial media licensed from Pexels.',",
          }
          for old, new in swaps.items():
              text = text.replace(old, new)
          p.write_text(text)

          # Update regression expectations without fragile photographer names.
          p = Path('scripts/homepage-motion.test.mjs')
          text = p.read_text()
          start = "    expect(mediaV6Source).toContain('Airam Dato-on / Pexels');"
          end = "    expect(pageSource).not.toContain('12+');"
          a = text.index(start)
          b = text.index(end, a)
          assertions = (
              "    expect(mediaV6Source).toContain('Luminol Academy archive');\n"
              "    expect(mediaV6Source).toContain('academyMedia.classroom.src');\n"
              "    expect(mediaV6Source).toContain('academyMedia.psychology.src');\n"
              "    expect(mediaV6Source).toContain('academyMedia.languages.src');\n"
              "    expect(mediaV6Source).toContain('academyMedia.training.src');\n"
              "    expect(mediaV6Source).toContain('academyMedia.recognition.src');\n"
          )
          p.write_text(text[:a] + assertions + text[b:])
          PY

          pnpm exec prettier --write apps/web/lib/flagship.ts apps/web/components/academy-archive.tsx apps/web/components/cinematic-media.tsx scripts/homepage-motion.test.mjs
          rm .github/workflows/real-academy-media-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/flagship.ts apps/web/components/academy-archive.tsx apps/web/components/cinematic-media.tsx scripts/homepage-motion.test.mjs .github/workflows/real-academy-media-once.yml
          git commit -m "Finish authentic Luminol media integration"
          git push origin HEAD:design/premium-motion-homepage
