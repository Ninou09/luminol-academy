name: Apply programme image approval gate

on:
  push:
    branches:
      - feature/issue-45-programme-image-approval

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply governed approval changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          schema_path = Path('apps/studio/schemaTypes/index.ts')
          schema = schema_path.read_text()
          anchor = """        defineField({
          name: 'alt',
          title: 'Alternative text',
          type: 'string',
          validation: (rule) =>
            rule
              .required()
              .max(180)
              .custom((value) =>
                typeof value === 'string' && value.trim().length >= 3
                  ? true
                  : 'Alternative text must contain at least 3 non-whitespace characters.',
              ),
        }),
"""
          replacement = anchor + """        defineField({
          name: 'publicationApproved',
          title: 'Image publication approved',
          description:
            'Enable only after permission/rights, alternative text and crop/hotspot have been reviewed for public use.',
          type: 'boolean',
          initialValue: false,
          validation: (rule) => rule.required(),
        }),
"""
          if schema.count(anchor) != 1:
              raise SystemExit('Expected exactly one programme image alt field anchor')
          schema_path.write_text(schema.replace(anchor, replacement))

          sanity_path = Path('apps/web/lib/sanity.ts')
          sanity = sanity_path.read_text()
          old_gate = '      defined(image.asset) => {'
          new_gate = """      defined(image.asset) &&
      coalesce(image.publicationApproved, false) == true => {"""
          if sanity.count(old_gate) != 2:
              raise SystemExit('Expected exactly two programme image projection gates')
          sanity_path.write_text(sanity.replace(old_gate, new_gate))

          tests_path = Path('apps/web/lib/sanity.test.ts')
          tests = tests_path.read_text()
          test_anchor = """  it('accepts published programmes without an image', async () => {
"""
          approval_test = """  it('requests image data only after explicit publication approval', async () => {
    vi.stubEnv('NEXT_PUBLIC_SANITY_PROJECT_ID', 'abc123xy');
    const fetchMock = vi.fn().mockResolvedValue(
      new Response(JSON.stringify({ result: [] }), { status: 200 }),
    );
    vi.stubGlobal('fetch', fetchMock);

    await expect(getProgrammesForSchool('languages')).resolves.toEqual([]);

    const requestUrl = new URL(String(fetchMock.mock.calls[0]?.[0]));
    const query = requestUrl.searchParams.get('query') ?? '';
    expect(query).toContain('defined(image.asset) &&');
    expect(query).toContain(
      'coalesce(image.publicationApproved, false) == true',
    );
  });

"""
          if tests.count(test_anchor) != 1:
              raise SystemExit('Expected exactly one no-image test anchor')
          tests_path.write_text(tests.replace(test_anchor, approval_test + test_anchor))

          docs_path = Path('docs/cms.md')
          docs = docs_path.read_text()
          docs = docs.replace(
              'school page. Images require meaningful alternative text.\n',
              'school page. Images require meaningful alternative text and explicit publication\napproval before the public website may render them.\n',
          )
          old_paragraph = """When a programme image is present, the public website accepts only the
published `https://cdn.sanity.io` asset URL together with its approved
alternative text, source dimensions, crop and hotspot. The card image URL is
generated at a stable 16:9 size while preserving the editor-selected crop and
keeping the selected hotspot in frame. A programme without an image keeps the
reviewed text-only card layout. Missing alternative text, a non-Sanity image
host, invalid framing metadata or malformed CMS data causes the complete
external programme response to fail closed and the school page to use its
reviewed fallback programmes.
"""
          new_paragraph = """When a programme image is present, the public website projects it only when
`publicationApproved` is explicitly true. Missing approval is treated exactly
like no public image, so the reviewed programme card fallback remains available
without blocking otherwise approved text content. Approved images must use the
published `https://cdn.sanity.io` asset URL together with meaningful alternative
text, source dimensions, crop and hotspot. The card image URL is generated at a
stable 16:9 size while preserving the editor-selected crop and keeping the
selected hotspot in frame. For an approved image, missing alternative text, a
non-Sanity image host, invalid framing metadata or malformed CMS data causes the
complete external programme response to fail closed and the school page to use
its reviewed fallback programmes.
"""
          if old_paragraph not in docs:
              raise SystemExit('Expected CMS image governance paragraph')
          docs = docs.replace(old_paragraph, new_paragraph)
          old_steps = """3. Check image purpose, permission and meaningful alternative text.
4. Adjust the image crop and hotspot so the important subject remains visible
   in the programme card's 16:9 frame.
5. Review all claims, names and consent-sensitive information.
6. Set `active` to true only when the content is ready.
7. Publish the document.
8. Verify the matching school page after the website cache refreshes.
9. For an image-bearing programme, confirm the rendered asset comes from
   `cdn.sanity.io`, reflects the approved crop and hotspot, and uses the
   approved alternative text.
"""
          new_steps = """3. Check image purpose, permission and meaningful alternative text.
4. Adjust the image crop and hotspot so the important subject remains visible
   in the programme card's 16:9 frame.
5. Set `publicationApproved` only after the image rights/permission,
   alternative text and framing have all been reviewed for public use.
6. Review all claims, names and consent-sensitive information.
7. Set `active` to true only when the content is ready.
8. Publish the document.
9. Verify the matching school page after the website cache refreshes.
10. For an approved image-bearing programme, confirm the rendered asset comes
    from `cdn.sanity.io`, reflects the approved crop and hotspot, and uses the
    approved alternative text.
"""
          if old_steps not in docs:
              raise SystemExit('Expected CMS publishing workflow steps')
          docs_path.write_text(docs.replace(old_steps, new_steps))
          PY
      - name: Format and validate focused change
        run: |
          pnpm exec prettier --write apps/studio/schemaTypes/index.ts apps/web/lib/sanity.ts apps/web/lib/sanity.test.ts docs/cms.md
          pnpm --filter @luminol/studio typecheck
          pnpm --filter @luminol/web test -- sanity.test.ts
      - name: Commit governed approval gate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-45-programme-image-approval.yml
          git add apps/studio/schemaTypes/index.ts apps/web/lib/sanity.ts apps/web/lib/sanity.test.ts docs/cms.md
          git commit -m 'Require explicit approval for public programme images'
          git push origin HEAD:feature/issue-45-programme-image-approval
