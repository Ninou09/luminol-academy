name: Apply programme image approval gate

on:
  push:
    branches:
      - feature/issue-45-programme-image-approval

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply governed approval changes
        run: echo '' | base64 --decode | python
      - name: Format and validate focused change
        run: |
          pnpm exec prettier --write apps/studio/schemaTypes/index.ts apps/web/lib/sanity.ts apps/web/lib/sanity.test.ts docs/cms.md
          pnpm --filter @luminol/studio typecheck
          pnpm --filter @luminol/web exec vitest run lib/sanity.test.ts
      - name: Commit governed approval gate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-45-programme-image-approval.yml
          git add apps/studio/schemaTypes/index.ts apps/web/lib/sanity.ts apps/web/lib/sanity.test.ts docs/cms.md
          git commit -m 'Require explicit approval for public programme images'
          git push origin HEAD:feature/issue-45-programme-image-approval
