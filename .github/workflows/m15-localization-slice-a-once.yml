name: Build Milestone 15 localization slice A once

on:
  push:
    branches:
      - feature/milestone-15-localization-foundation

permissions:
  contents: write

jobs:
  build-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.0
          cache: pnpm
      - name: Build shared localization contract
        shell: bash
        run: |
          mkdir -p packages/localization/src

          cat > packages/localization/package.json <<'EOF'
          {
            "name": "@luminol/localization",
            "version": "0.0.0",
            "private": true,
            "type": "module",
            "exports": {
              ".": "./src/index.ts"
            },
            "scripts": {
              "build": "tsc --noEmit",
              "lint": "eslint .",
              "typecheck": "tsc --noEmit",
              "test": "vitest run"
            },
            "dependencies": {
              "zod": "^4.0.10"
            },
            "devDependencies": {
              "@luminol/config": "workspace:*",
              "eslint": "^10.8.0",
              "typescript": "^5.8.3",
              "vitest": "^3.2.4"
            }
          }
          EOF

          cat > packages/localization/tsconfig.json <<'EOF'
          {
            "extends": "@luminol/config/typescript/base.json",
            "compilerOptions": { "noEmit": true },
            "include": ["src/**/*.ts", "src/**/*.tsx"]
          }
          EOF

          cat > packages/localization/src/index.ts <<'EOF'
          import { z } from 'zod';

          export const SUPPORTED_LOCALES = ['ar', 'fr', 'en'] as const;
          export const localeSchema = z.enum(SUPPORTED_LOCALES);
          export type Locale = z.infer<typeof localeSchema>;
          export type TextDirection = 'ltr' | 'rtl';

          export const DEFAULT_LOCALE: Locale = 'en';
          export const LOCALE_REQUEST_HEADER = 'x-luminol-locale';

          export type LocaleDefinition = {
            code: Locale;
            nativeLabel: string;
            direction: TextDirection;
            intlTag: string;
          };

          export const LOCALE_DEFINITIONS = {
            ar: {
              code: 'ar',
              nativeLabel: 'العربية',
              direction: 'rtl',
              intlTag: 'ar-DZ',
            },
            fr: {
              code: 'fr',
              nativeLabel: 'Français',
              direction: 'ltr',
              intlTag: 'fr-DZ',
            },
            en: {
              code: 'en',
              nativeLabel: 'English',
              direction: 'ltr',
              intlTag: 'en-DZ',
            },
          } as const satisfies Record<Locale, LocaleDefinition>;

          export type CommonDictionary = {
            languageSelectorLabel: string;
            localeNames: Record<Locale, string>;
            actions: {
              search: string;
              apply: string;
              clear: string;
              save: string;
              cancel: string;
            };
          };

          export const COMMON_DICTIONARIES = {
            ar: {
              languageSelectorLabel: 'لغة الواجهة',
              localeNames: {
                ar: 'العربية',
                fr: 'الفرنسية',
                en: 'الإنجليزية',
              },
              actions: {
                search: 'بحث',
                apply: 'تطبيق',
                clear: 'مسح',
                save: 'حفظ',
                cancel: 'إلغاء',
              },
            },
            fr: {
              languageSelectorLabel: "Langue de l’interface",
              localeNames: {
                ar: 'Arabe',
                fr: 'Français',
                en: 'Anglais',
              },
              actions: {
                search: 'Rechercher',
                apply: 'Appliquer',
                clear: 'Effacer',
                save: 'Enregistrer',
                cancel: 'Annuler',
              },
            },
            en: {
              languageSelectorLabel: 'Interface language',
              localeNames: {
                ar: 'Arabic',
                fr: 'French',
                en: 'English',
              },
              actions: {
                search: 'Search',
                apply: 'Apply',
                clear: 'Clear',
                save: 'Save',
                cancel: 'Cancel',
              },
            },
          } as const satisfies Record<Locale, CommonDictionary>;

          export function parseLocale(
            value: unknown,
            fallback: Locale = DEFAULT_LOCALE,
          ): Locale {
            const normalized =
              typeof value === 'string' ? value.trim().toLowerCase() : value;
            const parsed = localeSchema.safeParse(normalized);
            return parsed.success ? parsed.data : fallback;
          }

          export function getLocaleDirection(locale: Locale): TextDirection {
            return LOCALE_DEFINITIONS[locale].direction;
          }

          export function getIntlLocale(locale: Locale): string {
            return LOCALE_DEFINITIONS[locale].intlTag;
          }

          export function getCommonDictionary(locale: Locale): CommonDictionary {
            return COMMON_DICTIONARIES[locale];
          }

          export type LocalizedPathname = {
            locale: Locale;
            pathname: string;
          };

          export function parseLocalizedPathname(
            pathname: string,
          ): LocalizedPathname | null {
            const match = /^\/(ar|fr|en)(?=\/|$)/i.exec(pathname);
            if (!match) return null;

            const locale = parseLocale(match[1]);
            const prefix = `/${match[1]}`;
            const rest = pathname.slice(prefix.length);

            return {
              locale,
              pathname: rest.length === 0 ? '/' : rest,
            };
          }

          export function localizePathname(
            locale: Locale,
            pathname: string,
          ): string {
            const parsed = parseLocalizedPathname(pathname);
            const basePathname = parsed?.pathname ?? pathname;
            const safePathname = basePathname.startsWith('/') ? basePathname : '/';
            return safePathname === '/'
              ? `/${locale}`
              : `/${locale}${safePathname}`;
          }

          export function localizeHref(locale: Locale, href: string): string {
            if (!href.startsWith('/') || href.startsWith('//')) return href;

            try {
              const url = new URL(href, 'https://luminol.local');
              return `${localizePathname(locale, url.pathname)}${url.search}${url.hash}`;
            } catch {
              return localizePathname(locale, '/');
            }
          }

          export function buildLanguageAlternates(
            pathname: string,
          ): Record<Locale | 'x-default', string> {
            return {
              ar: localizePathname('ar', pathname),
              fr: localizePathname('fr', pathname),
              en: localizePathname('en', pathname),
              'x-default': localizePathname(DEFAULT_LOCALE, pathname),
            };
          }

          export function sanitizeInternalReturnTo(
            value: unknown,
            fallback = '/',
          ): string {
            if (typeof value !== 'string' || value.length > 2048) return fallback;

            const candidate = value.trim();
            if (
              !candidate.startsWith('/') ||
              candidate.startsWith('//') ||
              candidate.includes('\\') ||
              /[\u0000-\u001f\u007f]/.test(candidate)
            ) {
              return fallback;
            }

            try {
              const url = new URL(candidate, 'https://luminol.local');
              if (url.origin !== 'https://luminol.local') return fallback;
              return `${url.pathname}${url.search}${url.hash}`;
            } catch {
              return fallback;
            }
          }

          export function formatLocalizedDate(
            value: Date | number | string,
            locale: Locale,
            options: Intl.DateTimeFormatOptions = {
              day: 'numeric',
              month: 'short',
              year: 'numeric',
            },
          ): string {
            const date = value instanceof Date ? value : new Date(value);
            if (Number.isNaN(date.getTime())) {
              throw new RangeError('Invalid date value');
            }

            return new Intl.DateTimeFormat(getIntlLocale(locale), options).format(
              date,
            );
          }

          export function formatLocalizedNumber(
            value: number,
            locale: Locale,
            options?: Intl.NumberFormatOptions,
          ): string {
            if (!Number.isFinite(value)) {
              throw new RangeError('Number must be finite');
            }

            return new Intl.NumberFormat(getIntlLocale(locale), options).format(
              value,
            );
          }

          export function formatLocalizedCurrency(
            minorUnits: number,
            currency: string,
            locale: Locale,
          ): string {
            if (!Number.isInteger(minorUnits)) {
              throw new RangeError('Currency minor units must be an integer');
            }

            const normalizedCurrency = currency.trim().toUpperCase();
            if (!/^[A-Z]{3}$/.test(normalizedCurrency)) {
              throw new RangeError('Currency must be a three-letter ISO code');
            }

            return formatLocalizedNumber(minorUnits / 100, locale, {
              style: 'currency',
              currency: normalizedCurrency,
            });
          }
          EOF

          cat > packages/localization/src/index.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          import {
            buildLanguageAlternates,
            COMMON_DICTIONARIES,
            formatLocalizedCurrency,
            getLocaleDirection,
            localizeHref,
            localizePathname,
            parseLocale,
            parseLocalizedPathname,
            sanitizeInternalReturnTo,
            SUPPORTED_LOCALES,
          } from './index';

          describe('locale contract', () => {
            it('validates supported locale input and falls back deterministically', () => {
              expect(parseLocale('AR')).toBe('ar');
              expect(parseLocale(' fr ')).toBe('fr');
              expect(parseLocale('de')).toBe('en');
              expect(parseLocale(['ar'])).toBe('en');
            });

            it('keeps Arabic RTL and French/English LTR', () => {
              expect(getLocaleDirection('ar')).toBe('rtl');
              expect(getLocaleDirection('fr')).toBe('ltr');
              expect(getLocaleDirection('en')).toBe('ltr');
            });

            it('provides a complete common dictionary for every locale', () => {
              for (const locale of SUPPORTED_LOCALES) {
                expect(
                  COMMON_DICTIONARIES[locale].languageSelectorLabel.length,
                ).toBeGreaterThan(0);
                expect(
                  COMMON_DICTIONARIES[locale].localeNames.ar.length,
                ).toBeGreaterThan(0);
                expect(
                  COMMON_DICTIONARIES[locale].localeNames.fr.length,
                ).toBeGreaterThan(0);
                expect(
                  COMMON_DICTIONARIES[locale].localeNames.en.length,
                ).toBeGreaterThan(0);
              }
            });
          });

          describe('localized paths', () => {
            it('parses and replaces locale path prefixes without changing the route', () => {
              expect(parseLocalizedPathname('/ar/programmes')).toEqual({
                locale: 'ar',
                pathname: '/programmes',
              });
              expect(localizePathname('fr', '/ar/programmes')).toBe(
                '/fr/programmes',
              );
              expect(localizePathname('en', '/')).toBe('/en');
            });

            it('preserves query and fragment state in localized hrefs', () => {
              expect(
                localizeHref(
                  'ar',
                  '/programmes?q=english&school=languages#results',
                ),
              ).toBe('/ar/programmes?q=english&school=languages#results');
              expect(localizeHref('fr', '/en/about')).toBe('/fr/about');
            });

            it('builds canonical language alternates with an English x-default', () => {
              expect(buildLanguageAlternates('/programmes')).toEqual({
                ar: '/ar/programmes',
                fr: '/fr/programmes',
                en: '/en/programmes',
                'x-default': '/en/programmes',
              });
            });
          });

          describe('safe navigation and formatting', () => {
            it('accepts only safe same-origin return targets', () => {
              expect(
                sanitizeInternalReturnTo('/fr/programmes?q=leadership'),
              ).toBe('/fr/programmes?q=leadership');
              expect(sanitizeInternalReturnTo('//evil.example')).toBe('/');
              expect(sanitizeInternalReturnTo('/\\evil')).toBe('/');
              expect(sanitizeInternalReturnTo('https://evil.example')).toBe('/');
            });

            it('formats integer minor units as localized currency', () => {
              expect(formatLocalizedCurrency(125000, 'DZD', 'fr')).toContain('1');
              expect(() => formatLocalizedCurrency(1.5, 'DZD', 'en')).toThrow(
                'Currency minor units must be an integer',
              );
            });
          });
          EOF

          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/localization pnpm-lock.yaml

          rm .github/workflows/m15-localization-slice-a-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/localization pnpm-lock.yaml .github/workflows/m15-localization-slice-a-once.yml
          git commit -m "Build shared localization contract"
          git push
