name: Milestone 16 transition type fix

on:
  push:
    branches:
      - feature/milestone-16-organization-admin
    paths:
      - .github/workflows/m16-transition-type-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-admin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix shared transition typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/professional/src/corporate-training.ts')
          text = path.read_text()
          old = "  if (!CORPORATE_SEAT_TRANSITIONS[current].includes(next)) {\n"
          new = "  const allowedTransitions: readonly CorporateSeatStatus[] =\n    CORPORATE_SEAT_TRANSITIONS[current];\n\n  if (!allowedTransitions.includes(next)) {\n"
          if old not in text:
              raise SystemExit('Seat transition type anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/professional/src/corporate-training.ts
      - name: Commit type fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/professional/src/corporate-training.ts
          git diff --cached --check
          git commit -m "Fix shared corporate seat transition typing"
          git push origin HEAD:feature/milestone-16-organization-admin
