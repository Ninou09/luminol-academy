name: Diagnose programme filter lint

on:
  push:
    branches:
      - feat/enquiry-programme-filter

permissions:
  contents: write

jobs:
  lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-programme-filter
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Run admin lint and capture diagnostics
        run: |
          if ! pnpm --filter @luminol/admin lint > /tmp/programme-filter-lint.log 2>&1; then
            cp /tmp/programme-filter-lint.log .github/programme-filter-lint-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/programme-filter-lint-error.txt
            git commit -m "chore: capture programme filter lint error"
            git push origin HEAD:feat/enquiry-programme-filter
            cat /tmp/programme-filter-lint.log
            exit 1
          fi
