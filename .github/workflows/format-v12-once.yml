name: Format V12 once

on:
  push:
    branches:
      - design/premium-motion-homepage
    paths:
      - .github/workflows/format-v12-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V12 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/premium-motion-homepage
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Format V12 stylesheet
        run: pnpm exec prettier --write apps/web/app/v12-premium-final.css

      - name: Commit formatted stylesheet and remove one-time workflow
        run: |
          rm .github/workflows/format-v12-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/v12-premium-final.css .github/workflows/format-v12-once.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were necessary."
            exit 0
          fi
          git commit -m "Format V12 premium stylesheet"
          git push origin HEAD:design/premium-motion-homepage
