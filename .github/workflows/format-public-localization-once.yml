name: Format public localization once

on:
  push:
    branches:
      - feature/milestone-15-public-localization
    paths:
      - .github/workflows/format-public-localization-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-15-public-localization
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format localization files
        run: >-
          pnpm exec prettier --write
          apps/web/app/programmes/page.tsx
          'apps/web/app/schools/[school]/page.tsx'
          apps/web/app/sitemap.ts
          apps/web/components/site-shell.tsx
          apps/web/lib/programme-discovery.ts
          apps/web/lib/public-localization.test.ts
          apps/web/lib/public-localization.ts
          apps/web/lib/schools.test.ts
          apps/web/lib/schools.ts
      - name: Commit exact formatter output
        run: |
          git rm .github/workflows/format-public-localization-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/programmes/page.tsx 'apps/web/app/schools/[school]/page.tsx' apps/web/app/sitemap.ts apps/web/components/site-shell.tsx apps/web/lib/programme-discovery.ts apps/web/lib/public-localization.test.ts apps/web/lib/public-localization.ts apps/web/lib/schools.test.ts apps/web/lib/schools.ts
          git commit -m "Format Milestone 15 public localization"
          git push origin HEAD:feature/milestone-15-public-localization
