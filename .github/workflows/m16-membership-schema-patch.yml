name: Milestone 16 membership schema patch

on:
  push:
    branches:
      - feature/milestone-16-organization-persistence
    paths:
      - .github/workflows/m16-membership-schema-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-persistence
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make membership activity explicit in Prisma schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/prisma/schema.prisma')
          text = path.read_text()
          old = '  active          Boolean                    @default(false)'
          new = '  active          Boolean'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one membership active default, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm --filter @luminol/database exec prisma format --schema prisma/schema.prisma
      - name: Commit schema patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/database/prisma/schema.prisma
          git diff --cached --check
          git commit -m "Require explicit organization membership activity"
          git push origin HEAD:feature/milestone-16-organization-persistence
