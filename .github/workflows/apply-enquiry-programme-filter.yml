name: Apply enquiry programme filter

on:
  push:
    branches:
      - feat/enquiry-programme-filter

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-programme-filter
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Integrate programme filtering
        run: |
          if ! python .github/scripts/apply-enquiry-programme-filter-v2.py > /tmp/programme-filter.log 2>&1; then
            cp /tmp/programme-filter.log .github/programme-filter-integration-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/programme-filter-integration-error.txt
            git commit -m "chore: capture programme filter integration error"
            git push origin HEAD:feat/enquiry-programme-filter
            cat /tmp/programme-filter.log
            exit 1
          fi
      - name: Format intended files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/enquiries/page.tsx \
            apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-programme-filter.ts \
            apps/admin/lib/enquiry-programme-filter.test.ts \
            apps/admin/lib/enquiry-programme-filter-localization.ts \
            apps/admin/lib/enquiry-programme-filter-localization.test.ts
      - name: Run focused checks
        run: |
          pnpm --filter @luminol/admin typecheck
          pnpm --filter @luminol/admin test -- enquiry-programme-filter
          git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/enquiries/page.tsx \
            apps/admin/app/page.tsx \
            apps/admin/lib/enquiry-programme-filter.ts \
            apps/admin/lib/enquiry-programme-filter.test.ts \
            apps/admin/lib/enquiry-programme-filter-localization.ts \
            apps/admin/lib/enquiry-programme-filter-localization.test.ts
          git commit -m "Integrate verified-programme enquiry drill-down"
          git push origin HEAD:feat/enquiry-programme-filter
