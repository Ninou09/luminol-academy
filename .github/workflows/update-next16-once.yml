name: Update Next.js 16 once

on:
  push:
    branches:
      - deps/upgrade-next-16

permissions:
  contents: write

concurrency:
  group: update-next16-once
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deps/upgrade-next-16
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate Next.js 16 dependencies from current main
        run: pnpm --recursive update next@16.2.12 @next/eslint-plugin-next@16.2.12 --save-exact
      - name: Verify controlled dependency diff
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          apps/admin/package.json
          apps/portal/package.json
          apps/web/package.json
          packages/config/package.json
          pnpm-lock.yaml
          EOF

          git diff --name-only | sort > "$RUNNER_TEMP/actual-files.txt"
          sort "$RUNNER_TEMP/expected-files.txt" > "$RUNNER_TEMP/expected-files-sorted.txt"
          echo 'Expected dependency files:'
          cat "$RUNNER_TEMP/expected-files-sorted.txt"
          echo 'Actual dependency files:'
          cat "$RUNNER_TEMP/actual-files.txt"
          diff -u "$RUNNER_TEMP/expected-files-sorted.txt" "$RUNNER_TEMP/actual-files.txt"

          node <<'NODE'
          const fs = require('node:fs');

          for (const path of [
            'apps/admin/package.json',
            'apps/portal/package.json',
            'apps/web/package.json',
          ]) {
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (manifest.dependencies?.next !== '16.2.12') {
              throw new Error(`${path} did not resolve Next.js exactly to 16.2.12`);
            }
          }

          const configManifest = JSON.parse(
            fs.readFileSync('packages/config/package.json', 'utf8'),
          );
          if (
            configManifest.devDependencies?.['@next/eslint-plugin-next'] !==
            '16.2.12'
          ) {
            throw new Error(
              'packages/config/package.json did not resolve @next/eslint-plugin-next exactly to 16.2.12',
            );
          }
          NODE
      - name: Commit regenerated framework graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-next16-once.yml
          git add \
            apps/admin/package.json \
            apps/portal/package.json \
            apps/web/package.json \
            packages/config/package.json \
            pnpm-lock.yaml \
            .github/workflows/update-next16-once.yml
          git commit -m "Upgrade Next.js applications to 16.2.12"
          git push origin HEAD:deps/upgrade-next-16
