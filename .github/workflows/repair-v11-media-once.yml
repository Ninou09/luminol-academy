name: Repair V11 academy media once

on:
  push:
    branches:
      - design/premium-motion-homepage

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/premium-motion-homepage
          fetch-depth: 1
      - name: Restore verified academy media blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          restore_blob() {
            local sha="$1"
            local path="$2"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode > "${path}"
            test "$(head -c 4 "${path}")" = "RIFF"
            test "$(dd if="${path}" bs=1 skip=8 count=4 status=none)" = "WEBP"
          }

          restore_blob 71671d568afb44971916212a886772ba20897321 apps/web/public/media/academy/classroom-digital.webp
          restore_blob 6361a1f7fd74f304e4b53faebac3594aef83354a apps/web/public/media/academy/language-map.webp
          restore_blob 6e0a01a490cdc685eb3e77efb8f491ff8dbe54bf apps/web/public/media/academy/workshop-training.webp
          restore_blob 4823b91f68546ff9efef88e9a23ce95ec6ceb6e6 apps/web/public/media/academy/child-activities.webp

          test "$(git hash-object apps/web/public/media/academy/classroom-digital.webp)" = "71671d568afb44971916212a886772ba20897321"
          test "$(git hash-object apps/web/public/media/academy/language-map.webp)" = "6361a1f7fd74f304e4b53faebac3594aef83354a"
          test "$(git hash-object apps/web/public/media/academy/workshop-training.webp)" = "6e0a01a490cdc685eb3e77efb8f491ff8dbe54bf"
          test "$(git hash-object apps/web/public/media/academy/child-activities.webp)" = "4823b91f68546ff9efef88e9a23ce95ec6ceb6e6"
          rm .github/workflows/repair-v11-media-once.yml
      - name: Commit repaired media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/media/academy .github/workflows/repair-v11-media-once.yml
          git commit -m "Repair authentic academy media assets"
          git push origin HEAD:design/premium-motion-homepage
