name: Milestone 16 domain contract fix

on:
  push:
    branches:
      - feature/milestone-16-organization-admin
    paths:
      - .github/workflows/m16-domain-contract-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-admin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add shared professional contract dependency
        run: pnpm --filter @luminol/admin add '@luminol/professional@workspace:*'
      - name: Apply shared-domain and membership lifecycle fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          organization_admin = Path('apps/admin/lib/organization-admin.ts')
          organization_admin.write_text('''import {
  assertCorporateOrganizationScope,
  assertCorporateSeatTransition,
  CORPORATE_MEMBERSHIP_ROLES,
  CORPORATE_SEAT_STATUSES,
  CORPORATE_SEAT_TRANSITIONS,
} from '@luminol/professional';
import type {
  CorporateMembershipRole,
  CorporateSeatStatus,
} from '@luminol/professional';

export const ORGANIZATION_MEMBERSHIP_ROLES = CORPORATE_MEMBERSHIP_ROLES;
export const ORGANIZATION_SEAT_STATUSES = CORPORATE_SEAT_STATUSES;
export const ORGANIZATION_SEAT_TRANSITIONS = CORPORATE_SEAT_TRANSITIONS;

export type OrganizationMembershipRole = CorporateMembershipRole;
export type OrganizationSeatStatus = CorporateSeatStatus;

export const assertOrganizationScope = assertCorporateOrganizationScope;

export function getOrganizationSeatLifecycleUpdate(
  current: OrganizationSeatStatus,
  next: OrganizationSeatStatus,
  now: Date,
) {
  assertCorporateSeatTransition(current, next);

  if (next === 'ACTIVE') {
    return {
      status: next,
      activatedAt: now,
      completedAt: null,
      revokedAt: null,
    } as const;
  }

  if (next === 'COMPLETED') {
    return {
      status: next,
      completedAt: now,
      revokedAt: null,
    } as const;
  }

  return {
    status: next,
    revokedAt: now,
  } as const;
}
''')

          test = Path('apps/admin/lib/organization-admin.test.ts')
          test.write_text('''import { describe, expect, test } from 'vitest';

import {
  assertOrganizationScope,
  getOrganizationSeatLifecycleUpdate,
  ORGANIZATION_MEMBERSHIP_ROLES,
  ORGANIZATION_SEAT_STATUSES,
  ORGANIZATION_SEAT_TRANSITIONS,
} from './organization-admin';

describe('organization administration invariants', () => {
  test('reuses the shared organization domain contract', () => {
    expect(ORGANIZATION_MEMBERSHIP_ROLES).toEqual([
      'OWNER',
      'MANAGER',
      'LEARNER',
    ]);
    expect(ORGANIZATION_SEAT_STATUSES).toEqual([
      'INVITED',
      'ACTIVE',
      'COMPLETED',
      'REVOKED',
    ]);
    expect(ORGANIZATION_SEAT_TRANSITIONS.ACTIVE).toEqual([
      'COMPLETED',
      'REVOKED',
    ]);
  });

  test('rejects cross-organization scope', () => {
    expect(() => assertOrganizationScope('org-a', 'org-b')).toThrow(
      'Corporate organization scope mismatch',
    );
    expect(() => assertOrganizationScope('org-a', 'org-a')).not.toThrow();
  });

  test('enforces terminal seat lifecycle states', () => {
    const now = new Date('2026-08-14T13:00:00.000Z');

    expect(
      getOrganizationSeatLifecycleUpdate('INVITED', 'ACTIVE', now),
    ).toEqual({
      status: 'ACTIVE',
      activatedAt: now,
      completedAt: null,
      revokedAt: null,
    });
    expect(() =>
      getOrganizationSeatLifecycleUpdate('COMPLETED', 'ACTIVE', now),
    ).toThrow('Invalid corporate seat transition');
    expect(() =>
      getOrganizationSeatLifecycleUpdate('REVOKED', 'ACTIVE', now),
    ).toThrow('Invalid corporate seat transition');
  });
});
''')

          page = Path('apps/admin/app/organizations/page.tsx')
          page_text = page.read_text()
          old_import = "import type { OrganizationSeatStatus } from '../../lib/organization-admin';\n"
          new_import = "import { ORGANIZATION_SEAT_TRANSITIONS } from '../../lib/organization-admin';\n"
          if old_import not in page_text:
              raise SystemExit('Organization seat type import anchor not found')
          page_text = page_text.replace(old_import, new_import, 1)
          old_block = '''const seatTransitions: Record<
  OrganizationSeatStatus,
  readonly OrganizationSeatStatus[]
> = {
  INVITED: ['ACTIVE', 'REVOKED'],
  ACTIVE: ['COMPLETED', 'REVOKED'],
  COMPLETED: [],
  REVOKED: [],
};

'''
          if old_block not in page_text:
              raise SystemExit('Local seat transition block not found')
          page_text = page_text.replace(old_block, '', 1)
          page_text = page_text.replace(
              'seatTransitions[seat.status]',
              'ORGANIZATION_SEAT_TRANSITIONS[seat.status]',
          )
          page_text = page_text.replace(
              '{dashboard.options.users.map((user) => (',
              '{organization.availableMembershipUsers.map((user) => (',
          )
          page.write_text(page_text)

          server = Path('apps/admin/lib/organization-admin.server.ts')
          server_text = server.read_text()
          anchor = '''      const seatHolderUserIds = new Set(
        organization.seats.map((seat) => seat.userId),
      );

      return {
'''
          replacement = '''      const seatHolderUserIds = new Set(
        organization.seats.map((seat) => seat.userId),
      );
      const activeMemberUserIds = new Set(
        organization.memberships.map((membership) => membership.user.id),
      );

      return {
'''
          if anchor not in server_text:
              raise SystemExit('Organization dashboard mapping anchor not found')
          server_text = server_text.replace(anchor, replacement, 1)
          seat_memberships = '''        availableSeatMemberships: organization.memberships.filter(
          (membership) => !seatHolderUserIds.has(membership.user.id),
        ),
'''
          available_users = seat_memberships + '''        availableMembershipUsers: users.filter(
          (user) => !activeMemberUserIds.has(user.id),
        ),
'''
          if seat_memberships not in server_text:
              raise SystemExit('Available seat memberships anchor not found')
          server_text = server_text.replace(seat_memberships, available_users, 1)
          server.write_text(server_text)

          actions = Path('apps/admin/app/organizations/actions.ts')
          actions_text = actions.read_text()
          start = actions_text.index('export async function deactivateOrganizationMembership')
          end = actions_text.index('\nexport async function updateOrganizationMembershipRole', start)
          replacement_function = '''export async function deactivateOrganizationMembership(formData: FormData) {
  const administrator = await requirePlatformPermission('academy:manage');
  const input = membershipMutationSchema.parse({
    organizationId: formData.get('organizationId'),
    membershipId: formData.get('membershipId'),
  });

  await db.$transaction(async (transaction: Transaction) => {
    await requireActiveOrganization(transaction, input.organizationId);
    const membership = await transaction.organizationMembership.findFirst({
      where: {
        id: input.membershipId,
        organizationId: input.organizationId,
        active: true,
      },
      select: { id: true, userId: true },
    });

    if (!membership) {
      throw new Error('Active organization membership not found');
    }

    const openSeat = await transaction.organizationSeat.findFirst({
      where: {
        organizationId: input.organizationId,
        userId: membership.userId,
        status: { in: ['INVITED', 'ACTIVE'] },
      },
      select: { id: true },
    });

    if (openSeat) {
      throw new Error(
        'Close the organization seat before deactivating membership',
      );
    }

    const updated = await transaction.organizationMembership.updateMany({
      where: {
        id: membership.id,
        organizationId: input.organizationId,
        active: true,
      },
      data: { active: false, endedAt: new Date() },
    });

    if (updated.count !== 1) {
      throw new Error('Organization membership was updated concurrently');
    }

    await transaction.teamMembership.deleteMany({
      where: { organizationMembershipId: membership.id },
    });

    await audit(
      transaction,
      administrator.id,
      input.organizationId,
      'membership.deactivated',
      'organizationMembership',
      membership.id,
    );
  });

  revalidateOrganizationAdmin();
}
'''
          actions_text = actions_text[:start] + replacement_function + actions_text[end:]
          actions.write_text(actions_text)
          PY
          pnpm exec prettier --write packages/professional/src/corporate-training.ts apps/admin/lib/organization-admin.ts apps/admin/lib/organization-admin.test.ts apps/admin/lib/organization-admin.server.ts apps/admin/app/organizations/page.tsx apps/admin/app/organizations/actions.ts apps/admin/package.json pnpm-lock.yaml
      - name: Commit shared-domain fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/professional/src/corporate-training.ts apps/admin/lib/organization-admin.ts apps/admin/lib/organization-admin.test.ts apps/admin/lib/organization-admin.server.ts apps/admin/app/organizations/page.tsx apps/admin/app/organizations/actions.ts apps/admin/package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m "Reuse shared organization domain contract"
          git push origin HEAD:feature/milestone-16-organization-admin
