name: Temporary Social Publish Terminal Immutability Patch
on:
  push:
    branches: [feat/ai-operator-social-publish-attempts]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[social-attempt-terminal-immutability]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-operator-social-publish-attempts
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch terminal immutability and coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('packages/database/prisma/migrations/20260901163500_social_publishing_attempt_ledger/migration.sql')
          text = migration.read_text()
          old = '''  IF OLD."status" IN ('SUCCEEDED', 'DEAD_LETTER') AND NEW."status" <> OLD."status" THEN\n    RAISE EXCEPTION 'SocialPublishingAttempt terminal state is immutable';\n  END IF;\n'''
          new = '''  IF OLD."status" IN ('SUCCEEDED', 'DEAD_LETTER') AND NEW IS DISTINCT FROM OLD THEN\n    RAISE EXCEPTION 'SocialPublishingAttempt terminal state is immutable';\n  END IF;\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected one terminal-state trigger condition')
          migration.write_text(text.replace(old, new))

          test_path = Path('packages/database/src/social-publishing-attempts.integration.test.ts')
          tests = test_path.read_text()
          marker = '''    await expect(\n      db.socialPublishingAttemptEvent.update({\n        where: { id: stored.events[1]!.id },\n        data: { errorCode: 'MUTATED' },\n      }),\n    ).rejects.toThrow('append-only');\n'''
          addition = '''    await expect(\n      db.socialPublishingAttempt.update({\n        where: { id: stored.id },\n        data: { providerReference: 'rewritten-terminal-reference' },\n      }),\n    ).rejects.toThrow('terminal state is immutable');\n'''
          if tests.count(marker) != 1:
              raise SystemExit('Expected one append-only mutation assertion marker')
          test_path.write_text(tests.replace(marker, addition + marker))
          PY
          pnpm exec prettier --write packages/database/src/social-publishing-attempts.integration.test.ts
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/prisma/migrations/20260901163500_social_publishing_attempt_ledger/migration.sql packages/database/src/social-publishing-attempts.integration.test.ts
          git commit -m "Make terminal social publish attempts fully immutable [social-attempt-terminal-immutability]"
          git push origin HEAD:feat/ai-operator-social-publish-attempts
