name: Debug social preview smoke

on:
  push:
    branches:
      - preview-issue-151-social-preview-fixes

permissions:
  contents: read
  pull-requests: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Build public web
        run: pnpm --filter @luminol/web build
        env:
          DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run social preview smoke and capture output
        id: smoke
        shell: bash
        run: |
          set +e
          pnpm test:e2e --grep "social preview metadata" > smoke.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment diagnostic output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Temporary social-preview smoke diagnostic'
            echo '```text'
            tail -n 160 smoke.log
            echo '```'
            echo "Exit status: ${{ steps.smoke.outputs.status }}"
          } > comment.md
          gh pr comment 155 --body-file comment.md
