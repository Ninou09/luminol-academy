name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luminol
          POSTGRES_PASSWORD: luminol
          POSTGRES_DB: luminol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luminol -d luminol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Next.js build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/web/.next/cache
            apps/admin/.next/cache
            apps/portal/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'apps/admin/**', 'apps/portal/**', 'packages/**', 'turbo.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:check
      - run: pnpm db:generate
      - name: Validate, deploy, backfill, and verify migrations on ephemeral PostgreSQL
        run: |
          pnpm --filter @luminol/database exec prisma validate
          pnpm --filter @luminol/database migrate:deploy
          pnpm --filter @luminol/database backfill:m16-organization-links
          pnpm --filter @luminol/database verify:m16-organization-links
        env:
          DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
      - run: pnpm lint
      - name: Check repository formatting
        run: pnpm format:check
      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
        env:
          TEST_DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
          DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          path: test.log
      - name: Reconcile and verify Milestone 16 seeded integration fixtures
        run: |
          pnpm --filter @luminol/database backfill:m16-organization-links
          pnpm --filter @luminol/database verify:m16-organization-links
        env:
          DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run public launch smoke tests
        run: pnpm test:e2e --grep-invert "authenticated launch journeys"
      - name: Check authenticated smoke configuration
        id: authenticated-smoke
        shell: bash
        run: |
          if [ -n "$ADMIN_STATE" ] && [ -n "$PORTAL_STATE" ] && [ -n "$PLAYWRIGHT_ADMIN_BASE_URL" ] && [ -n "$PLAYWRIGHT_PORTAL_BASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticated preview smoke tests remain a launch blocker because restricted state or preview configuration is absent."
          fi
        env:
          ADMIN_STATE: ${{ secrets.PLAYWRIGHT_ADMIN_STORAGE_STATE }}
          PORTAL_STATE: ${{ secrets.PLAYWRIGHT_PORTAL_STORAGE_STATE }}
          PLAYWRIGHT_ADMIN_BASE_URL: ${{ vars.PLAYWRIGHT_ADMIN_BASE_URL }}
          PLAYWRIGHT_PORTAL_BASE_URL: ${{ vars.PLAYWRIGHT_PORTAL_BASE_URL }}
      - name: Run authenticated preview smoke tests
        if: steps.authenticated-smoke.outputs.ready == 'true'
        shell: bash
        run: |
          umask 077
          printf '%s' "$ADMIN_STATE" > "$RUNNER_TEMP/admin-state.json"
          printf '%s' "$PORTAL_STATE" > "$RUNNER_TEMP/portal-state.json"
          PLAYWRIGHT_ADMIN_STORAGE_STATE="$RUNNER_TEMP/admin-state.json" \
          PLAYWRIGHT_PORTAL_STORAGE_STATE="$RUNNER_TEMP/portal-state.json" \
          pnpm test:e2e --grep "authenticated launch journeys"
        env:
          ADMIN_STATE: ${{ secrets.PLAYWRIGHT_ADMIN_STORAGE_STATE }}
          PORTAL_STATE: ${{ secrets.PLAYWRIGHT_PORTAL_STORAGE_STATE }}
          PLAYWRIGHT_ADMIN_BASE_URL: ${{ vars.PLAYWRIGHT_ADMIN_BASE_URL }}
          PLAYWRIGHT_PORTAL_BASE_URL: ${{ vars.PLAYWRIGHT_PORTAL_BASE_URL }}
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Production dependency audit attempt ${attempt}/3"
            if pnpm audit --prod --audit-level high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Production dependency audit failed after three blocking attempts."
          exit 1
