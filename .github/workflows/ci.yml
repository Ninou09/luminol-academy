name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luminol
          POSTGRES_PASSWORD: luminol
          POSTGRES_DB: luminol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luminol -d luminol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - name: Validate and deploy migrations to ephemeral PostgreSQL
        run: |
          pnpm --filter @luminol/database exec prisma validate
          pnpm --filter @luminol/database migrate:deploy
        env:
          DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
      - run: pnpm lint
      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
        env:
          TEST_DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
          DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://luminol:luminol@localhost:5432/luminol
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
