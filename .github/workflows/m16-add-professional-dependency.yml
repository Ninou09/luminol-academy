name: Milestone 16 professional dependency

on:
  push:
    branches:
      - feature/milestone-16-organization-admin
    paths:
      - .github/workflows/m16-add-professional-dependency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/milestone-16-organization-admin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add professional workspace dependency
        run: |
          pnpm --filter @luminol/admin add "@luminol/professional@workspace:*"
      - name: Commit dependency metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/admin/package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m "Add admin professional domain dependency"
          git push origin HEAD:feature/milestone-16-organization-admin
