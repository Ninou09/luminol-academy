name: Temporary AI Provider Typecheck Fix
on:
  push:
    branches: [feat/ai-provider-gateway]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ai-provider-typecheck-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-provider-gateway
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Omit undefined optional fetch implementation
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/database/src/ai-provider-gateway.ts')
          text = path.read_text()
          old = """    createOpenAiResponsesProvider({\n      apiKey: config.OPENAI_API_KEY ?? '',\n      fetchImplementation: options.fetchImplementation,\n    });"""
          new = """    createOpenAiResponsesProvider({\n      apiKey: config.OPENAI_API_KEY ?? '',\n      ...(options.fetchImplementation\n        ? { fetchImplementation: options.fetchImplementation }\n        : {}),\n    });"""
          if text.count(old) != 1:
              raise SystemExit('Expected AI provider construction snippet exactly once')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write packages/database/src/ai-provider-gateway.ts
          pnpm --filter @luminol/database typecheck
          git diff --check
      - name: Commit exact-optional fix
        run: |
          git config user.name "Luminol CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/src/ai-provider-gateway.ts
          git commit -m "Fix AI provider optional fetch wiring [ai-provider-typecheck-fix]"
          git push origin HEAD:feat/ai-provider-gateway
