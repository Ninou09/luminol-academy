name: Apply enquiry pipeline snapshot patch

on:
  push:
    branches:
      - feat/enquiry-pipeline-snapshot
    paths:
      - scripts/apply-enquiry-pipeline-snapshot-patch.py
      - .github/workflows/apply-enquiry-pipeline-snapshot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enquiry-pipeline-snapshot
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Tighten temporary patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-enquiry-pipeline-snapshot-patch.py')
          text = path.read_text()
          old_anchor = '    "  ACTIVE_UNASSIGNED_ENQUIRY_WHERE,\\n",\n'
          new_anchor = '    "import {\\n  ACTIVE_UNASSIGNED_ENQUIRY_WHERE,\\n",\n'
          old_replacement = '    "  ACTIVE_ENQUIRY_WHERE,\\n  ACTIVE_UNASSIGNED_ENQUIRY_WHERE,\\n",\n'
          new_replacement = '    "import {\\n  ACTIVE_ENQUIRY_WHERE,\\n  ACTIVE_UNASSIGNED_ENQUIRY_WHERE,\\n",\n'
          if text.count(old_anchor) != 1 or text.count(old_replacement) != 1:
              raise SystemExit('temporary attention import patch anchors changed')
          path.write_text(text.replace(old_anchor, new_anchor, 1).replace(old_replacement, new_replacement, 1))
          PY
      - name: Apply pipeline snapshot patch
        run: python scripts/apply-enquiry-pipeline-snapshot-patch.py
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/admin/lib/enquiry-attention.ts
          apps/admin/lib/enquiry-attention.test.ts
          apps/admin/lib/enquiry-pipeline-reporting.ts
          apps/admin/lib/enquiry-pipeline-reporting.test.ts
          apps/admin/lib/operations.server.ts
          apps/admin/lib/admin-localization.ts
          apps/admin/app/page.tsx
      - name: Run focused tests
        run: >-
          pnpm exec vitest run
          apps/admin/lib/enquiry-attention.test.ts
          apps/admin/lib/enquiry-pipeline-reporting.test.ts
      - name: Typecheck admin
        run: pnpm --filter @luminol/admin typecheck
      - name: Remove temporary patch tooling
        run: rm scripts/apply-enquiry-pipeline-snapshot-patch.py .github/workflows/apply-enquiry-pipeline-snapshot.yml
      - name: Commit pipeline snapshot slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add enquiry pipeline snapshot"
          git push origin HEAD:feat/enquiry-pipeline-snapshot
