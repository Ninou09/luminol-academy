name: Format enquiry boundary

on:
  push:
    branches:
      - security/enquiry-submission-boundary

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format target file
        run: pnpm exec prettier --write apps/web/app/api/enquiries/route.ts

      - name: Verify scoped mutation
        run: |
          unexpected="$(git diff --name-only | grep -v '^apps/web/app/api/enquiries/route.ts$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files changed during formatting"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit formatted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/api/enquiries/route.ts
          if git diff --cached --quiet; then
            echo 'Source already formatted.'
            exit 0
          fi
          git commit -m 'Format enquiry submission boundary'
          git push
