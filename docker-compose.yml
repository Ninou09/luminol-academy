services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luminol
      POSTGRES_USER: luminol
      POSTGRES_PASSWORD: luminol_local
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luminol -d luminol']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
